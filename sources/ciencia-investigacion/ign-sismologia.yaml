id: ign-sismologia
name: IGN – Catálogo sísmico y últimos terremotos
org: Instituto Geográfico Nacional (IGN)
ministry: Transportes y Movilidad Sostenible
level: age
sector: ciencia-investigacion
tags: [terremotos, sismicidad, catalogo-sismico, volcanes, geofisica, tiempo-real]
summary: >-
  Terremotos localizados por la Red Sísmica Nacional: tablas HTML de los últimos 5, 10 y 30 días y del año
  (magnitud 1,5 o superior o sentidos) y catálogo histórico con formulario por fechas, zona, magnitud e
  intensidad, descargable en csv, kmz o geojson desde la web (no reproducido por script).
access: [portal, scraping]
auth: none
formats: [html, csv, txt, kml, geojson]
update: realtime
coverage: "Catálogo histórico y sismicidad reciente"
license: Reutilización libre con cita de la fuente
base_url: https://www.ign.es/web/ign/portal/ultimos-terremotos
docs_url: https://www.ign.es/web/ign/portal/sis-area-sismicidad
endpoints:
  - path: https://www.ign.es/web/ign/portal/ultimos-terremotos/-/ultimos-terremotos/{get5dias|get10dias|get30dias|getAnio}
    desc: Tabla HTML con evento (es2026tefhw), fecha, hora UTC y local, latitud, longitud, profundidad, magnitud, tipo de magnitud, intensidad máxima y localización
    example: curl -s "https://www.ign.es/web/ign/portal/ultimos-terremotos/-/ultimos-terremotos/get10dias"
  - path: https://www.ign.es/web/ign/portal/sis-catalogo-terremotos
    desc: Formulario del catálogo (POST a /-/catalogo-terremotos/searchTerremoto) con startDate y endDate dd/mm/aaaa, caja lat/lon, magnitud, intensidad y profundidad
  - path: https://www.ign.es/web/ign/portal/sis-catalogo-acelerogramas
    desc: Catálogos de acelerogramas, shakemaps y tsunamis enlazados desde el área de sismicidad
  - path: https://visualizadores.ign.es/tproximos
    desc: Visor de terremotos próximos (aplicación Next.js con teselas propias)
quirks: [js-rendered, session-required, url-drift]
ids: []
gotchas:
  - No localicé API, feed ni fichero estable. El RSS y el KML de la ficha anterior (resources/sismologia/tproximos/) responden 404 y www.ign.es/fdsnws devuelve 404.
  - Las páginas getNdias son la única fuente automatizable; parsear la tabla HTML (200 KB para 10 días). Las horas se dan en UTC y en hora local en columnas separadas.
  - El catálogo es un portlet Liferay con búsqueda y descarga (csv, txt, kmz, zip, geojson) por JavaScript y sesión; mis envíos por script devolvieron solo la cabecera (30/09/2026); replicar las peticiones del navegador.
  - En mis pruebas la descarga devolvió un fichero de anchos fijos (Evento, Fecha, Hora, Latitud, Longitud, Prof., Inten., Mag., Tipo Mag., Localización) aunque se eligiera csv.
  - El tipo de magnitud varía por evento (mb, mbLg, Mw); las magnitudes históricas anteriores a la red instrumental son intensidades macrosísmicas.
tips:
  - "pandas.read_html(get10dias)[0] recupera la tabla de últimos terremotos en una línea; convertir Fecha y Hora UTC a datetime con dayfirst=True."
related: [igme-geologia, cnig-centro-descargas]
status: active
verified: "2026-09-30"
