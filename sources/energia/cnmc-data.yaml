id: cnmc-data
name: CNMC Data – Estadísticas de energía, telecomunicaciones, audiovisual y postal
org: Comisión Nacional de los Mercados y la Competencia (CNMC)
ministry: Organismo independiente adscrito a Economía, Comercio y Empresa
level: age
sector: energia
tags: [cnmc, electricidad, gas, telecomunicaciones, audiovisual, postal, comercio-electronico, comercializadoras, cuotas-mercado, precios, ckan]
summary: >-
  210 datasets de la CNMC en un CKAN con datastore: electricidad y gas (cuotas de comercializadoras, cambios
  de suministrador, precios, garantías de origen, bono social), precios provinciales de carburantes,
  telecomunicaciones, audiovisual, transporte, postal y comercio electrónico.
alerts:
  - "datastore_search recorta limit a 32.000 sin error (limit=50000 en ds_1915_1 da 32.000 de 75.553; result.limit dice el aplicado): paginar con offset sobre el host, no con _links.next, o usar /datastore/dump/{id}."
access: [api-rest, download, portal]
auth: none
formats: [csv, json, xml]
update: quarterly
coverage: "Según dataset (extras periodo y frecuenciaActualizacion); series anuales, trimestrales y mensuales"
license: CC BY-SA 4.0 (license_title de los datasets; condiciones en data.cnmc.es/condiciones-de-uso)
base_url: https://catalogodatos.cnmc.es/api/3/action
docs_url: https://data.cnmc.es/reutilizadores
endpoints:
  - path: /package_search?q={texto}&rows={n}&fq=organization:{org}
    desc: Búsqueda de datasets (name ds_{id}_{v}, title, extras periodo, frecuenciaActualizacion, esInforme); rows=1000 devuelve los 210
    example: curl -s "https://catalogodatos.cnmc.es/api/3/action/package_search?q=comercializadoras&rows=5"
    returns: "CKAN {help, success, result:{count, results:[{id, name (ds_1947_1), title, notes, license_id, metadata_modified, resources:[{id, url, format, name}]}]}}"
  - path: /organization_list?all_fields=true
    desc: Cinco organizaciones temáticas con recuento (org_energia 181, org_telco_visual 12, org_transporte_postal 12, org_comercio_electronico 4, org_panel_hogares 1)
  - path: /package_show?id={name}
    desc: Ficha de un dataset con sus recursos; el CSV con datastore_active true admite datastore_search
  - path: /datastore_search?resource_id={id}&limit={n}
    desc: Registros en JSON con fields tipados y etiqueta original en info.label; limit por defecto 100 y tope 32000 aplicado sin aviso; paginar con offset
    example: curl -s "https://catalogodatos.cnmc.es/api/3/action/datastore_search?resource_id=522dcc75-b5c4-4c8d-9ec3-c8d8cf66d6b2&limit=5"
    returns: "{help, success, result:{records:[{_id, una clave por columna}], fields:[{id, type, info:{label}}], total, limit, _links:{start, next}}}; numeric con cinco decimales (2496967.00000), fechas como text AAAA-MM-DD; _links empiezan por //api/3/"
  - path: https://catalogodatos.cnmc.es/datastore/dump/{resource_id}?format={csv|json|xml}
    desc: Volcado completo de un recurso del datastore
    example: curl -s "https://catalogodatos.cnmc.es/datastore/dump/522dcc75-b5c4-4c8d-9ec3-c8d8cf66d6b2?format=csv"
    returns: "CSV con coma, _id en la primera columna, cabeceras normalizadas y numéricos con punto y cinco decimales (0.73200); format=json da {fields, records} con cada registro como lista y format=xml <data><row _id>"
  - path: https://catalogodatos.cnmc.es/dataset/{uuid}/resource/{id}/download/ds_{n}_{v}.{csv|json|xml}
    desc: Ficheros estáticos de cada dataset (URL en resources[].url de package_show)
    returns: "CSV con punto y coma, coma decimal (0,732), CRLF y las etiquetas originales como cabecera (BOM UTF-8 en los recientes); JSON como lista de objetos con claves normalizadas; XML <resultado><registro>"
  - path: https://data.cnmc.es/{energia|telecomunicaciones-y-sector-audiovisual|transporte-y-postal|panel-de-hogares}
    desc: Portal de navegación (Drupal) con fichas por dataset; las descargas y la API están en catalogodatos.cnmc.es
quirks: [url-drift, js-rendered]
ids: []
gotchas:
  - La API no está en data.cnmc.es (su /api/3 devuelve 404) sino en catalogodatos.cnmc.es; el portal solo enlaza a ella por JavaScript.
  - Cada dataset publica un CSV con datastore (dump y datastore_search) y CSV, JSON y XML estáticos; los resource_id que cita la documentación (8afd824c, c45b35d4) ya no existen (404), comprobar con package_show.
  - Nombres de campo normalizados sin tildes ni ñ (compannia_comercializadora_de_gas); la etiqueta original está en fields[].info.label del datastore.
  - El dump del datastore va con coma, punto decimal y cinco decimales fijos (2496967.00000) y _id primero; el CSV estático ds_*.csv va con punto y coma, coma decimal (0,732), CRLF y etiquetas originales.
  - Un dataset es una tabla de una publicación o de un año (precios provinciales 2025 ds_13984_1, 2026 ds_24451_1), no una serie; 50 de los 88 trimestrales no se tocan desde 2024, mirar periodo y metadata_modified.
  - Demanda, generación y PVPC actuales no están aquí (solo precio final horario de 2019 a 2021) sino en ree-redata; el precio marginal del mercado, en omie-mercado.
tips:
  - "pandas.read_csv('https://catalogodatos.cnmc.es/datastore/dump/{id}') carga la tabla directamente; para el catálogo completo, package_search?rows=1000 y fq=organization:org_energia."
  - package_search?q=title:"Precios diarios provinciales"&sort=metadata_modified desc&rows=1 devuelve el dataset del último año, que cambia de name cada año.
related: [minetur-precios-carburantes, miteco-energia-estadisticas, ree-redata, omie-mercado]
status: active
verified: "2026-10-01"
