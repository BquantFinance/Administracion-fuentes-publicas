id: miteco-energia-estadisticas
name: MITECO y CORES – Balances energéticos y estadísticas de petróleo y gas
org: Secretaría de Estado de Energía y Corporación de Reservas Estratégicas de Productos Petrolíferos (CORES)
ministry: Para la Transición Ecológica y el Reto Demográfico
level: age
sector: energia
tags: [energia, balance-energetico, hidrocarburos, petroleo, gas-natural, consumo-provincial, refino, cores]
summary: >-
  Series de CORES en xlsx con nombre fijo: consumo mensual de productos petrolíferos por provincia desde 1997 y por
  grupo desde 1969, gas natural, importaciones y existencias. Del ministerio, balance energético 1990-2024 en ODS
  (formato Eurostat), refino mensual en xlsx y libros de la energía en PDF.
access: [download, portal]
auth: none
formats: [xlsx, xls, ods, pdf]
update: monthly
coverage: "CORES desde 1969 (consumo por grupo), 1997 por provincia y 2004 gas; balance energético 1990-2024 y 2025 provisional; libros de la energía 2001-2020; coyuntura trimestral 2003-2016"
license: Reutilización libre con cita de la fuente
base_url: https://www.cores.es/es/estadisticas
docs_url: https://www.miteco.gob.es/es/energia/estrategia-normativa/balances.html
endpoints:
  - path: https://www.cores.es/sites/default/files/archivos/estadisticas/consumos-pp-ccaa-provincias.xlsx
    desc: Consumo mensual de productos petrolíferos por CCAA y provincia desde enero de 1997 (hoja Consumos, cabecera en la fila 6, 25.488 filas hasta julio de 2026)
    example: curl -sSL -o consumos-pp-ccaa-provincias.xlsx "https://www.cores.es/sites/default/files/archivos/estadisticas/consumos-pp-ccaa-provincias.xlsx"
    returns: "Hojas Inicio (fuentes y fecha de actualización) y Consumos: Año (int), Mes (texto, enero), CCAA, Provincia, Gasolina 97, 95 y 98 I.O., % bio en gasolinas (fracción), Gasóleo A, B y C, % bio en gasóleos, Fuelóleo BIA, en toneladas con decimales; filas Total por CCAA y Total Nacional"
  - path: https://www.cores.es/sites/default/files/archivos/estadisticas/{fichero}.xlsx
    desc: Series completas con nombre fijo, sobrescritas cada mes; hoja Inicio y una hoja por bloque, con la cabecera en la fila 6 salvo en tres (ver gotchas)
    params: fichero = uno de los 23 xlsx enlazados en /es/estadisticas, como consumos-pp, consumos-pp-por-grupo, consumos-gas, existencias-gas, importaciones-crudo, balance-pp-anual, capacidad-refineria
  - path: https://www.cores.es/sites/default/files/archivos/estadisticas/est-{petroliferos|gas}-{consumo|balance|importaciones|exportaciones|clientes}-{AAAA}.xls
    desc: Cuadros del año (y PDF homónimo); petroliferos con consumo, importaciones, exportaciones y balance; gas con consumo, clientes y balance, este del año anterior
  - path: https://www.miteco.gob.es/es/energia/estrategia-normativa/balances/balances.html
    desc: Balance energético anual 1990-2024 en ODS y 2025 provisional, resumen 2024 en PDF y libros de la energía 2001-2020 en PDF
  - path: https://www.miteco.gob.es/content/dam/miteco/es/energia/files-1/balances/Publicaciones/Documents/balance_2024_2/Balance%20Energetico%20Espa%C3%B1a%201990_2024_v3.ods
    desc: Balance energético nacional 1990-2024 en ODS, una hoja por año en ktep; la carpeta y la versión (_v3) cambian, tomar el enlace de balances.html
    example: curl -s -o balance-1990-2024.ods "https://www.miteco.gob.es/content/dam/miteco/es/energia/files-1/balances/Publicaciones/Documents/balance_2024_2/Balance%20Energetico%20Espa%C3%B1a%201990_2024_v3.ods"
    returns: "ODS de 2 MB con hojas Cubierta, Glosario y una por año (2024 a 1990), 146 filas cada una: signo, concepto y código de flujo Eurostat (PPRD, IMP, GIC...) por fila y código SIEC (fila 3) y nombre de producto (fila 4) por columna, en ktep"
  - path: https://www.miteco.gob.es/es/energia/estrategia-normativa/balances/publicaciones/estadisticas-petroleo.html
    desc: Estadística mensual de refinerías en xlsx y ods, un fichero por mes con ruta y nombre irregulares; cada xlsx acumula una hoja por año desde 2012
  - path: https://www.miteco.gob.es/es/energia/estrategia-normativa/balances/coyuntura-trimestral.html
    desc: Boletín de coyuntura energética trimestral en PDF, solo de 2003 a 2016
  - path: https://www.miteco.gob.es/es/energia/estadisticas-informes.html
    desc: Índice de estadísticas del ministerio (petróleo, carbón, biocarburantes, minería)
quirks: [overwritten-in-place, url-drift]
ids: [ine-provincia]
gotchas:
  - Todas las rutas energia.gob.es (cadena FNMT incompleta) redirigen a www.miteco.gob.es/es/energia; Balances.aspx pasa a estrategia-normativa/balances.html y las páginas SharePoint (Paginas/*.aspx) ya no existen.
  - El balance tabular del ministerio es un ODS con una hoja por año (1990-2024, más 2025 provisional) en ktep y formato Eurostat; el resumen 2024 y los libros de la energía son PDF.
  - Los xlsx de CORES traen hoja Inicio y las de datos con cabecera en la fila 6 (5 en consumos-pp-por-grupo, produccion-refineria-por-grupo y sectorializacion-pp); Mes va en texto y la unidad varía (t, kt, GWh).
  - La hoja Consumos mezcla provincias con filas Total por CCAA y Total Nacional, y Canarias va sin desglose provincial de 1997 a 2002; filtrar las filas Total antes de sumar.
  - Los ficheros de CORES se sobrescriben con el mismo nombre; guardar copia fechada si se quiere reproducir un cálculo.
  - Los ficheros de refino mensual del ministerio cambian de carpeta y nombre cada mes (petróleo-feb-2026 contiene «FEB 2025.xlsx» con datos de febrero de 2026); leer los href de la página.
  - El registro de instalaciones de producción eléctrica y el de autoconsumo no tienen descarga abierta localizable; sedeaplicaciones.minetur.gob.es/PRETOR devuelve 404.
  - El catálogo abierto de la sede de Industria (sede.serviciosmin.gob.es) no recoge registros eléctricos; su catalogo.csv (cp1252) trae URL sin puntos (https://sedemineturgobes/) y dcat.rdf sí da las accessURL.
tips:
  - "pandas.read_excel(f, sheet_name='Consumos', header=5) carga la serie provincial; Mes se convierte con un diccionario enero..diciembre y Provincia a código INE con uno propio (Gerona, Orense, Sta. Cruz Tenerife)."
  - Las estadísticas eléctricas oficiales (demanda, generación, precios) están en Red Eléctrica y en CNMC Data; los precios al por menor de carburantes, en la API de precios de carburantes.
  - CNMC Data publica también el consumo provincial de productos petrolíferos, un dataset por año con API CKAN (Estadística Petróleo - 2026 - Consumos mensuales provincial, ds_24401_1).
related: [cnmc-data, minetur-precios-carburantes]
