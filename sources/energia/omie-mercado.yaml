id: omie-mercado
name: OMIE – Resultados del mercado diario e intradiario de electricidad
org: OMI-Polo Español (OMIE), operador designado del mercado eléctrico ibérico
ministry: Operador del mercado designado por la Ley 24/2013 del Sector Eléctrico; supervisado por la CNMC
level: age
sector: energia
tags: [electricidad, mercado-diario, mercado-intradiario, precio-marginal, omie, mibel, curvas-oferta-demanda, casacion]
summary: >-
  Precio marginal del mercado diario en España y Portugal (96 periodos cuarto-horarios por día en 2026),
  programas de casación, curvas de oferta y demanda, ofertas, intradiario de subastas y continuo, capacidades
  e indisponibilidades. Ficheros de texto con URL fija, sin clave.
access: [download]
auth: none
formats: [csv, txt, zip]
update: daily
coverage: "Ficheros diarios en línea desde el 18/12/2023; ZIP mensuales anteriores en las carpetas de ficheros mensuales"
base_url: https://www.omie.es/es/file-access-list
docs_url: https://www.omie.es/es/market-results/daily/daily-market/day-ahead-price
endpoints:
  - path: https://www.omie.es/es/file-download?parents%5B0%5D={carpeta}&filename={carpeta}_{AAAAMMDD}.{version}
    desc: Fichero diario de una carpeta; marginalpdbc (precio España), marginalpdbcpt (Portugal), pdbc_stota (programas), curva_pbc, cab y det (ofertas), precios_pibcic
    example: curl -s "https://www.omie.es/es/file-download?parents%5B0%5D=marginalpdbc&filename=marginalpdbc_20260929.1"
  - path: https://www.omie.es/es/file-download?parents%5B0%5D=marginalpibc&filename=marginalpibc_{AAAAMMDD}{SS}.1
    desc: Precio marginal del intradiario de subastas; SS es la sesión (01 a 03 en 2026)
    example: curl -s "https://www.omie.es/es/file-download?parents%5B0%5D=marginalpibc&filename=marginalpibc_2026092901.1"
  - path: https://www.omie.es/es/file-access-list?parents%5B0%5D={carpeta}&dir={nombre}&realdir={carpeta}
    desc: Listado HTML de los ficheros de una carpeta (1018 en marginalpdbc, desde el 18/12/2023); sin parámetros, las 67 carpetas de todos los mercados
    example: curl -s "https://www.omie.es/es/file-access-list?parents%5B0%5D=marginalpdbc&dir=Precios%20horarios%20del%20mercado%20diario%20en%20Espa%C3%B1a&realdir=marginalpdbc" | grep -o 'filename=[^"&]*'
  - path: https://www.omie.es/es/file-download?parents%5B0%5D={carpeta_mensual}&filename={familia}_{AAAAMM}.zip
    desc: ZIP mensuales; comunzip agrupa todas las familias (trades, pibcie, pibcipt) y curva_pbc_uof y curva_pibc_uof tienen carpeta propia (202607 verificado)
    example: curl -sO "https://www.omie.es/es/file-download?parents%5B0%5D=curva_pbc_uof&filename=curva_pbc_uof_202607.zip"
  - path: https://www.omie.es/es/market-results/daily/daily-market/day-ahead-price
    desc: Página de resultados con gráficos; los datos salen de los mismos ficheros
quirks: [latin1, static-html]
ids: []
gotchas:
  - "marginalpdbc: cabecera MARGINALPDBC;, filas AAAA;MM;DD;periodo;precio;precio; y un asterisco final; 96 periodos por día en 2026 frente a 24 el 01/01/2025; las dos columnas de precio coinciden en los días vistos."
  - Los ficheros con cabecera "OMIE - Mercado de electricidad" (pdbc_stota, curva_pbc) van en ISO-8859-1, con coma decimal y punto de miles, dos filas de título antes de las columnas y periodos H1Q1 a H24Q4.
  - El sufijo de versión (.1, .2, .3) marca republicaciones; el listado dice cuál existe y una versión inexistente devuelve 404 con HTML.
  - Un fichero diario anterior al 18/12/2023 devuelve 404 aunque el histórico exista; para años anteriores usar los ZIP mensuales.
  - El parámetro se envía como parents[0] (parents%5B0%5D); la redirección lo reescribe a parents= y ambas formas funcionan.
  - El intradiario continuo publica precios_pibcic (máximo, mínimo y medio por periodo) y precios_pibcic_ronda; el de subastas lleva la sesión pegada a la fecha.
tips:
  - "pd.read_csv(url, sep=';', skiprows=1, header=None).dropna(subset=[3]).iloc[:, :6] lee marginalpdbc y descarta la fila del asterisco; columnas año, mes, día, periodo y dos precios."
  - Precios horarios PVPC y spot ya combinados, y demanda y generación, en ree-redata; OMIE es la fuente primaria del precio marginal.
related: [ree-redata, cnmc-data]
status: active
verified: "2026-09-30"
