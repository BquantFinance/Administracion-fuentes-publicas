id: mincotur-industria-turismo
name: Ministerio de Industria y Turismo – Estadísticas industriales, BADASE y DATAESTUR (API)
org: Secretaría de Estado de Industria y Secretaría de Estado de Turismo (Turespaña y SEGITTUR)
ministry: Industria y Turismo
level: age
sector: comercio-industria-propiedad
tags: [industria, turismo, frontur, egatur, badase, dataestur, api, coyuntura-industrial]
summary: >-
  Estadísticas de industria (coyuntura, vehículos, cemento, pyme) y base de series BADASE en aplicaciones
  ASP.NET, más DATAESTUR, plataforma de datos turísticos con 124 conjuntos descargables y una API REST
  (API-SEGITTUR v2, OpenAPI, clave de API) que reúne FRONTUR, EGATUR, afiliación y AENA.
access: [api-rest, portal, download]
auth: api-key
formats: [json, xlsx, csv, html]
update: monthly
coverage: "Turismo desde 2015 en DATAESTUR; series industriales según encuesta"
license: Reutilización libre con cita de la fuente
base_url: https://www.dataestur.es/
docs_url: https://www.dataestur.es/apidata/
endpoints:
  - path: https://www.dataestur.es/app/themes/mini-mandrake/apidata/openapi.json
    desc: Especificación OpenAPI 3 de API-SEGITTUR v2 (124 rutas _DL con filtros desde y hasta año y mes, CCAA y provincia; seguridad apiKeyHeader o apiKeyQuery)
    example: curl -s "https://www.dataestur.es/app/themes/mini-mandrake/apidata/openapi.json"
  - path: https://www.dataestur.es/API-SEGITTUR-v2/{conjunto}_DL
    desc: Descarga de un conjunto (AENA_DESTINOS_DL, FRONTUR_DL...); la página API no pide clave; desde el entorno de verificación respondió 504 a los 30 s
  - path: https://www.dataestur.es/general/{frontur|egatur}/
    desc: Páginas de FRONTUR y EGATUR en DATAESTUR con descargas por indicador
  - path: https://sedeaplicaciones.serviciosmin.gob.es/Badase/
    desc: BADASE, base de series estadísticas de industria (ASP.NET con __VIEWSTATE, selección de series y salida en varios formatos)
  - path: https://industria.gob.es/es-es/estadisticas
    desc: Encuesta de coyuntura industrial, estadística de vehículos, cemento y publicaciones sobre pyme
quirks: [viewstate-forms, url-drift]
ids: []
gotchas:
  - La ruta IndicadoresyEstadisticas de mintur.gob.es da 404; las estadísticas de industria viven en industria.gob.es y las de turismo en turismo.gob.es, que remite a DATAESTUR.
  - La página API de DATAESTUR no menciona clave ni registro aunque la especificación OpenAPI declare apiKey; desde este entorno las rutas _DL dieron 504 a los 30 s con y sin cabecera (30/09/2026).
  - FRONTUR y EGATUR las produce el INE desde 2015; DATAESTUR redistribuye y añade fuentes (AENA, afiliación, telefonía móvil). Para series largas ir al INE.
  - BADASE es una aplicación con postbacks y estado; la salida se elige en un desplegable (formato y tipo) y no localicé URL estable por serie.
  - El portal de datos abiertos de la sede de Industria (sede.serviciosmin.gob.es) tiene el catálogo roto (ficha miteco-energia-estadisticas).
tips:
  - Leer openapi.json y generar el cliente (por ejemplo con openapi-python-client); todas las rutas devuelven el conjunto completo filtrable por fechas y territorio.
related: [ine-api-tempus, miteco-energia-estadisticas, aesa-aviacion]
status: active
verified: "2026-09-30"
