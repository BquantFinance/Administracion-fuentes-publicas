id: datacomex
name: DataComex – Estadísticas de comercio exterior de España
org: Secretaría de Estado de Comercio
ministry: Economía, Comercio y Empresa
level: age
sector: comercio-industria-propiedad
tags: [comercio-exterior, exportaciones, importaciones, aduanas, taric, paises, provincias]
summary: >-
  Exportaciones e importaciones mensuales por producto (TARIC hasta 8 dígitos, CNAE, CUCI), país, provincia y
  CCAA, en valor y volumen, desde 1995. Consulta multidimensional con exportación a CSV y Excel.
access: [portal, download]
auth: none
formats: [csv, xlsx, html]
