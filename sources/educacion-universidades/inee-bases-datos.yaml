id: inee-bases-datos
name: INEE – Bases de datos de PISA, TIMSS, PIAAC, ICILS y evaluaciones nacionales (España)
org: Instituto Nacional de Evaluación Educativa
ministry: Educación, Formación Profesional y Deportes
level: age
sector: educacion-universidades
tags: [inee, pisa, timss, piaac, pirls, icils, evaluacion-educativa, microdatos, spss, stata, rendimiento-escolar]
summary: >-
  Muestras españolas de las evaluaciones internacionales (PISA 2000-2022 con base conjunta 2000-2015, TIMSS 2023,
  PIAAC ciclo 1, ICILS, PISA para centros) y bases de las evaluaciones nacionales (EGD 2009 y 2010, Escuela 2.0,
  PROA, Enseñanzas Medias 1984-1989) en SPSS, Stata, xlsx y CSV sin registro.
access: [download]
auth: none
formats: [zip, rar, sav, dta, csv, xlsx]
update: irregular
coverage: "PISA 2000-2022; TIMSS 2023; PIAAC ciclo 1 (2012); evaluaciones nacionales 1984-1989 y 2009-2010"
base_url: https://www.educacionfpydeportes.gob.es/inee/bases-datos.html
docs_url: https://www.educacionfpydeportes.gob.es/inee/bases-datos/evaluaciones-internacionales.html
endpoints:
  - path: https://www.educacionfpydeportes.gob.es/inee/bases-datos/evaluaciones-internacionales/{pisa|timss|piaac|pirls|icils|iccs|talis|pisa-para-centros-educativos}.html
    desc: Página por programa con enlaces a la base internacional (OCDE, IEA) y a la muestra española bajo /inee/dam/jcr:{uuid}/; iccs y talis solo enlazan fuera
    example: curl -s "https://www.educacionfpydeportes.gob.es/inee/bases-datos/evaluaciones-internacionales/pisa.html" | grep -o 'href="[^"]*/inee/dam/[^"]*"'
  - path: https://www.educacionfpydeportes.gob.es/inee/dam/jcr:{uuid}/{fichero}
    desc: PISA 2022 pisa-2022-esp.rar (26,6 MB SPSS), PISA 2018 esp-06-diciembre-pisa2018.zip, PISA 2000-2015 esp-pisa00-03-06-09-12-15.zip (91,5 MB), TIMSS 2023 rar
    example: curl -sS -o pisa-2022-esp.rar "https://www.educacionfpydeportes.gob.es/inee/dam/jcr:8f5e9ff3-41ce-4661-b56e-237766dfff2d/pisa-2022-esp.rar"
  - path: https://www.educacionfpydeportes.gob.es/inee/bases-datos/evaluaciones-nacionales.html
    desc: EGD 2009 (EGD09.xlsx) y 2010 (EGD10.xlsx), Escuela 2.0 (xlsx, sav y dta), PROA (basesddproa{excel|spss|stata}.zip) y prueba piloto de inglés en la PAU (xlsx)
  - path: https://www.educacionfpydeportes.gob.es/inee/bases-datos/evaluaciones-nacionales/evaluacion-externa.html
    desc: Evaluación externa de la reforma de Enseñanzas Medias 1984-1989; basesdedatos.zip (seis .sav REEM2G1A a REEM3G3A, 7,2 MB) y librosdecodigos.zip
    example: curl -sS -o reem_basesdedatos.zip "https://www.educacionfpydeportes.gob.es/inee/dam/jcr:9c9031fe-f08f-432c-99a9-f79fbbaebaef/basesdedatos.zip"
  - path: https://www.educacionfpydeportes.gob.es/inee/bases-datos/evaluaciones-internacionales/piaac.html
    desc: PIAAC ciclo 1 ronda 1, base nacional esp-31-oct.zip (21 MB); ciclo 2 solo en la OCDE
quirks: [url-drift, static-html]
ids: []
gotchas:
  - HEAD sobre los ficheros /inee/dam/ responde 403; usar GET, que admite Range (206) para comprobar tamaño y tipo antes de bajar 400 MB.
  - educacionyfp.gob.es y educacion.gob.es redirigen a educacionfpydeportes.gob.es/inee/portada.html; las URL de fichero llevan jcr:{uuid}, que cambia si se resube el fichero, leer los href de la página.
  - PISA 2022, TIMSS 2023, ICILS y PISA 2012 Stata vienen en .rar (application/x-rar-compressed), que zipfile no abre; hace falta unrar o 7z. Los .sav y .dta llegan con charset=UTF-8 en el Content-Type aunque son binarios.
  - El CSV conjunto PISA 2000-2012 pesa 404 MB con BOM UTF-8 y separador ;, una columna Participa{año} por ciclo y prefijos P00_, P03_ en las variables; el zip SPSS 2000-2015 equivalente pesa 91 MB.
  - Son la muestra española de la base internacional; pesos, réplicas y valores plausibles siguen la metodología de la OCDE o la IEA, cuyas guías de uso enlaza cada página.
  - TALIS, ICCS y PIAAC ciclo 2 no tienen fichero nacional (solo enlace a la OCDE o la IEA) y PIRLS solo trae guias-de-uso-pirls-2011.rar; PISA 2025 solo enlaza a la base internacional.
tips:
  - "pyreadstat.read_sav() lee los .sav con etiquetas; para el CSV de 404 MB usar pandas.read_csv(sep=';', encoding='utf-8-sig', usecols=[...]) seleccionando columnas."
related: [educacion-estadisticas-ruct, ine-microdatos]
status: active
verified: "2026-09-30"
