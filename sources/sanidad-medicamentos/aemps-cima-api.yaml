id: aemps-cima-api
name: AEMPS CIMA – API REST de medicamentos autorizados y nomenclátor de prescripción
org: Agencia Española de Medicamentos y Productos Sanitarios (AEMPS)
ministry: Sanidad
level: age
sector: sanidad-medicamentos
tags: [medicamentos, cima, aemps, principios-activos, fichas-tecnicas, prospectos, codigo-nacional, atc, problemas-suministro, snomed]
summary: >-
  Los 25.487 medicamentos registrados en España (20.464 autorizados): composición, principios activos, ATC,
  presentaciones con código nacional, estado, ficha técnica y prospecto en PDF, HTML y secciones,
  problemas de suministro y registro de cambios. JSON sin autenticación y nomenclátor XML diario.
alerts:
  - nombre y practiv1 buscan por subcadena; practiv1=ibuprofeno trae también DEXIBUPROFENO (260 frente a 253). Para un principio exacto, idpractiv1 con el id de maestras.
access: [api-rest, download]
auth: none
formats: [json, xml, pdf, html, zip]
update: daily
coverage: "Medicamentos autorizados, suspendidos y revocados; registro de cambios por fecha"
license: Reutilización libre con cita de la fuente
base_url: https://cima.aemps.es/cima/rest
docs_url: https://sede.aemps.gob.es/docs/CIMA-REST-API_1_19.pdf
endpoints:
  - path: /medicamentos?nombre={texto}&pagina={n}
    desc: Búsqueda paginada; también practiv1, idpractiv1, atc, laboratorio, comerc, receta, autorizados y otros filtros del manual, combinables; sin filtro lista todo
    example: curl -s "https://cima.aemps.es/cima/rest/medicamentos?nombre=ibuprofeno&pagina=1"
    returns: "{totalFilas, pagina, tamanioPagina (200), resultados:[{nregistro, nombre, labtitular, cpresc, estado:{aut y susp o rev, epoch ms}, comerc, receta, generico, conduc, triangulo, huerfano, biosimilar, nosustituible{id,nombre}, psum, ema, docs[], fotos[], viasAdministracion[], formaFarmaceutica, vtm, dosis}]}; sin pactivos"
  - path: /medicamento?nregistro={nreg}
    desc: Detalle completo (pactivos, atcs, presentaciones con cn y estado, docs con url PDF y urlHtml, fotos, vtm, dosis, estado aut/rev); también ?cn={cn}
    example: curl -s "https://cima.aemps.es/cima/rest/medicamento?nregistro=80298"
    returns: "Objeto con los campos del listado y pactivos (texto), atcs[{codigo, nombre, nivel}], principiosActivos[{id, codigo, nombre, cantidad texto '200.00', unidad, orden}], presentaciones[{cn, nombre, estado, comerc, psum}]; docs[{tipo 1 ficha técnica, 2 prospecto, url, urlHtml, secc, fecha}]; notas y materialesInf booleanos"
  - path: /presentaciones?cn={cn}
    desc: Presentaciones por cn, nregistro, vmp o idpractiv1; presentacion/{cn} devuelve una sola como objeto
    example: curl -s "https://cima.aemps.es/cima/rest/presentaciones?cn=708201"
    returns: "{totalFilas, pagina, tamanioPagina, resultados:[{nregistro, cn, nombre, pactivos, labtitular, labcomercializador, cpresc, estado, comerc, psum, docs[{tipo, url, secc}], fotos[]...}]}; un cn inexistente da 200 con totalFilas 0, no 204"
  - path: /psuministro
    desc: Problemas de suministro activos, paginados de 200 (880 el 2026-10-01); psuministro/{cn} para una presentación
    example: curl -s "https://cima.aemps.es/cima/rest/psuministro"
    returns: "{totalFilas, pagina, tamanioPagina, resultados:[{cn (texto), nombre, tipoProblemaSuministro (int), fini, ffin (epoch ms; ffin falta si no hay fecha prevista), activo, observ}]}"
  - path: /docSegmentado/secciones/{1|2}?nregistro={nreg} y /docSegmentado/contenido/{1|2}?nregistro={nreg}&seccion={s}
    desc: Ficha técnica (1) o prospecto (2) por secciones; secciones lista [{seccion, titulo, orden}] y contenido da una sección (4.1 indicaciones...) o todas
    example: curl -s "https://cima.aemps.es/cima/rest/docSegmentado/contenido/1?nregistro=80298&seccion=4.1"
    returns: "JSON [{seccion, titulo, contenido (HTML con estilos de Word y entidades como &#225;), orden}]; con Accept text/html devuelve solo el fragmento HTML; sin seccion, todas las secciones"
  - path: /registroCambios?fecha={dd/mm/aaaa}
    desc: Medicamentos cambiados desde la fecha (nregistro, fecha, tipoCambio, cambio), para sincronizar sin rebajar todo
    example: curl -s "https://cima.aemps.es/cima/rest/registroCambios?fecha=01/09/2026"
    params: "fecha dd/mm/aaaa obligatoria (sin ella 204); nregistro repetible para limitar a esos medicamentos; pagina"
    returns: "{totalFilas, pagina, tamanioPagina, resultados:[{nregistro (texto, a veces BE 174115), nombre, labtitular, fecha (epoch ms), tipoCambio (1 nuevo, 2 baja, 3 modificado), cambio:[estado, comerc, prosp, ft, psum, notasSeguridad, matinf u otros]}]}; sin orden por fecha; 110.361 filas desde el 01/09/2026"
  - path: /maestras?maestra={id}&nombre={texto}
    desc: Tablas maestras filtradas por texto (1 principios activos, 3 formas farmacéuticas, 4 vías, 6 laboratorios, 7 ATC); sin filtro responde 204
    example: curl -s "https://cima.aemps.es/cima/rest/maestras?maestra=1&nombre=ibu"
    returns: "{totalFilas, pagina, tamanioPagina, resultados:[{id, codigo, nombre}]}; nombre busca por subcadena; el id se repite entre sales del mismo principio (1769A y 1769YD) y el codigo es único"
  - path: /vmpp?practiv1={texto}
    desc: Descripción clínica SNOMED CT (VMP y VMPP) filtrada por practiv1, idpractiv1, atc, nombre, forma o dosis; sin filtro responde 204
    example: curl -s "https://cima.aemps.es/cima/rest/vmpp?practiv1=ibuprofeno"
    returns: "{totalFilas, pagina, tamanioPagina, resultados:[{vmp, vmpDesc, vmpp, vmppDesc, presComerc}]}; vmp y vmpp son códigos SNOMED en texto"
  - path: https://listadomedicamentos.aemps.gob.es/prescripcion.zip
    desc: Nomenclátor de prescripción completo (16 MB; Prescripcion.xml de 193 MB con una entrada por presentación más 13 diccionarios XML), regenerado a diario
    example: curl -sSL -A "Mozilla/5.0" -o prescripcion.zip "https://listadomedicamentos.aemps.gob.es/prescripcion.zip"
    returns: "Zip de 14 XML UTF-8 con BOM y espacio de nombres por defecto; Prescripcion.xml trae header/listprescriptiondate y 30.718 prescription (cod_nacion, nro_definitivo, cod_dcsa, cod_dcp, cod_dcpf, indicadores sw_* 0/1, fechas ISO), con anuladas y suspendidas (cod_sitreg_presen 3 y 4)"
  - path: https://cima.aemps.es/cima/pdfs/{ft|p}/{nreg}/{FT|P}_{nreg}.pdf
    desc: Ficha técnica y prospecto en PDF con URL estable por nregistro; versión HTML en /cima/dochtml/{ft|p}/{nreg}/{FT|P}_{nreg}.html
    example: curl -sO "https://cima.aemps.es/cima/pdfs/ft/80298/FT_80298.pdf"
    returns: "PDF (admite Range); el mismo documento está en /cima/pdfs/es/{ft|p}/{nreg}/{nreg}_{ft|p}.pdf, la ruta que usa url_fictec en prescripcion.zip"
rate_limit: No documentado; sin 429. El 2026-10-01, desde un centro de datos, hubo esperas de 10 a 140 s y conexiones sin respuesta; usar timeout y reintentos
quirks: [user-agent-browser, overwritten-in-place]
ids: [cn-medicamento]
gotchas:
  - Páginas de 200 (tamanioPagina se ignora) y pagina empieza en 1; una página fuera de rango (0 o pasada la última) responde 200 con totalFilas 0, no con el total.
  - Un nregistro o cn inexistente en medicamento responde 204 sin cuerpo, igual que maestras, vmpp y registroCambios sin filtro; presentaciones con un cn inexistente da 200 con totalFilas 0.
  - Solo JSON; Accept application/xml da 406 con cuerpo de texto Not Acceptable (docSegmentado/contenido admite además text/html). La raíz /cima/rest da 404 HTML.
  - Fechas en epoch ms; aut, fini y ffin son medianoche de Madrid (22:00 o 23:00 UTC del día anterior), así que convertir con Europe/Madrid o el día sale uno antes.
  - El listado medicamentos no trae pactivos, atcs ni principiosActivos (solo el detalle). Por defecto incluye suspendidos y revocados; autorizados=1 deja 20.464 de 25.487.
  - registroCambios da unas 53.000 filas por semana sin orden por fecha y con una fecha antigua (01/01/2010) responde 500; el manual llama cambios al campo que llega como cambio.
  - listadomedicamentos.aemps.gob.es (prescripcion.zip) responde 403 de openresty al User-Agent de curl; con -A Mozilla/5.0 descarga. cima.aemps.es no lo exige.
  - El nomenclátor se regenera a diario en la misma URL (listprescriptiondate) con códigos SNOMED; cod_dcsa coincide con vtm.id del detalle de la API.
  - El 2026-10-01 CIMA alternó respuestas de 0,5 s con esperas de 10 a 140 s y conexiones colgadas sin respuesta desde un centro de datos; poner timeout de lectura y reintentar.
tips:
  - Maestro completo con prescripcion.zip e iterparse sobre {http://schemas.aemps.es/prescripcion/aemps_prescripcion}prescription (unos 5 s); para mantenerlo al día, registroCambios desde la última descarga.
  - "Secciones útiles de ficha técnica: 4.1 indicaciones, 4.2 posología, 4.3 contraindicaciones, 4.8 reacciones adversas; el HTML de contenido conserva estilos de Word, limpiar con BeautifulSoup get_text."
  - 'POST buscarEnFichaTecnica con el cuerpo JSON [{"seccion":"4.1","texto":"migraña","contiene":1}] busca texto dentro de una sección de la ficha técnica (70 medicamentos el 2026-10-01).'
related: [sanidad-portal-estadistico, aemps-otros-registros, sanidad-nomenclator-facturacion]
status: active
verified: "2026-10-01"
