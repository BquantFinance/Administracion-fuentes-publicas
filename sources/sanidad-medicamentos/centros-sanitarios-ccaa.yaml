id: centros-sanitarios-ccaa
name: Centros sanitarios con coordenadas – Cataluña, Madrid y Comunitat Valenciana
org: Generalitat de Catalunya (Equipaments de Catalunya), Comunidad de Madrid (registro de centros, servicios y establecimientos sanitarios) y Generalitat Valenciana (ICV)
level: ccaa
sector: sanidad-medicamentos
tags: [sanidad, centros-de-salud, atencion-primaria, hospitales, cap, consultorios, coordenadas, geolocalizacion, que-hay-cerca]
summary: >-
  Centros de salud, consultorios y hospitales con coordenadas: equipamientos de Cataluña, registro de centros sanitarios
  de Madrid (todos los tipos, por especialidad) y capas del Sistema Valenciano de Salud. El Catálogo Nacional de
  Hospitales no trae coordenadas.
alerts:
  - "Madrid (centros_servicios_establecimientos_sanitarios): una fila por centro y especialidad, 45.961 filas para 15.867 centros (Hospital general, 3.801 filas para 59). Contar centro_nro_registro distintos."
  - "Equipaments de Catalunya (8gmd-gz7i): 70 equipamientos con latitud y longitud 0 y categoria con varias separadas por «||» en 3.214; descartar el 0 y filtrar con categoria like '%Salut|Centres sanitaris|1.%'."
code:
  module: fuentes_publicas.clientes.cerca
  use:
    - "cerca.cargar_salud('mad'): 506 hospitales, centros de salud y consultorios, uno por centro y no por especialidad, con lat y lon desde UTM; también 'cat' y 'gva'"
  mcp: [perfil_municipio]
access: [api-rest, ogc]
auth: none
formats: [json, csv, gml]
update: daily
coverage: "Cataluña 730 CAP y consultorios y 70 hospitales (8gmd-gz7i, al día); Madrid 15.867 centros de todos los tipos; Comunitat Valenciana 248 centros de salud y 35 hospitales; Andalucía no conseguido"
license: "Llicència oberta d'ús d'informació – Catalunya (cita); CC BY en Madrid y la Comunitat Valenciana"
base_url: https://analisi.transparenciacatalunya.cat/resource/8gmd-gz7i.json
docs_url: https://datos.comunidad.madrid/catalogo/dataset/centros_servicios_establecimientos_sanitarios
endpoints:
  - path: https://analisi.transparenciacatalunya.cat/resource/8gmd-gz7i.json?$where={filtro}
    desc: Equipaments de Catalunya (Socrata, 33.512 equipamientos de todos los tipos); los sanitarios van en Salut|Centres sanitaris|1. (CAP) y |3. (hospitales)
    example: curl -sG "https://analisi.transparenciacatalunya.cat/resource/8gmd-gz7i.json" --data-urlencode '$select=nom,categoria,latitud,longitud' --data-urlencode '$where=categoria like "%Salut|Centres sanitaris|3.%"' --data-urlencode '$limit=3'
    returns: "[{idequipament, nom, categoria (Salut|Centres sanitaris|3. Hospitals|), via, cpostal sin cero, poblacio, codi_municipi (INE con control y sin cero, 81326), latitud y longitud como texto, data_modificacio, localitzacio}]"
  - path: https://datos.comunidad.madrid/api/3/action/datastore_search?resource_id=2948b4da-8b39-42b7-b667-779a5284f39d&filters={json}
    desc: Registro de centros, servicios y establecimientos sanitarios de la Comunidad de Madrid, una fila por centro y oferta asistencial
    example: curl -sG -A "Mozilla/5.0" "https://datos.comunidad.madrid/api/3/action/datastore_search" --data-urlencode "resource_id=2948b4da-8b39-42b7-b667-779a5284f39d" --data-urlencode 'filters={"centro_tipo":["Centro de salud"]}' --data-urlencode "limit=1"
    returns: "{result:{total 2196, records:[{centro_nro_registro, centro_tipo, dependecia_funcional, oferta_asistecial, municipio_nombre, direccion_vial_tipo, _nombre y _nro, direccion_codigo_postal entero, localizacion_coordenada_x e _y (UTM huso 30), NIF}]}}; sin nombre del centro"
  - path: https://terramapas.icv.gva.es/15_SistemaValencianoSalud?request=GetFeature&service=WFS&version=2.0.0&typename=CentrosSanitarios.{CentrosSalud|Hospitales}&outputformat=csv
    desc: Capas del Sistema Valenciano de Salud (ICV) en CSV; también departamentos y zonas básicas (MapaSanitario)
    example: curl -s "https://terramapas.icv.gva.es/15_SistemaValencianoSalud?request=GetFeature&service=WFS&version=2.0.0&typename=CentrosSanitarios.Hospitales&outputformat=csv"
    returns: "CSV con WKT, cen_cod, cen_desclar (nombre), cod_ine_mun (5), municipio, cen_nombcall, cen_numcall, cen_codpos, nombre_departamento, nombre_zona, x_coord e y_coord (UTM huso 30) y tipo; 35 hospitales y 248 centros de salud"
rate_limit: No documentado
quirks: [user-agent-browser]
ids: [ine-municipio, nif]
gotchas:
  - "Madrid no da el nombre del centro (tipo y dirección) y escribe «Dato personal» en el NIF de 6.413 centros (consultas y clínicas de personas físicas)."
  - "Madrid: datastore_search_sql da 500 con tildes en un literal («Consultorio de atención primaria»); filtrar con filters en JSON, que sí las admite (7.317 filas de los seis tipos de primaria y hospitales)."
  - "Madrid y la Comunitat Valenciana dan UTM ETRS89 huso 30 (localizacion_coordenada_x/y y x_coord/y_coord), no latitud y longitud."
  - "La capa CentrosSanitarios.CentrosEspecialidades de la GVA devolvió un CSV vacío el 2026-10-05; centros de salud y hospitales sí."
  - "Andalucía, no conseguido el 2026-10-05: ise:eq_02_salud del WFS del Inventario de Sedes y Equipamientos (ideandalucia.es/services/ise/wfs) cortó a los 48 s con 25 KB; sin otro conjunto con coordenadas localizado."
  - "Equipaments de Catalunya: cpostal y codi_municipi pierden el cero inicial (8612, 81326 es 081326, INE 08132 con dígito de control)."
related: [sanidad-portal-estadistico, gencat-dades-obertes, comunidad-madrid-datos-abiertos, gva-dadesobertes-api, junta-andalucia-datos-abiertos]
status: active
verified: "2026-10-05"
