id: bne-datos
name: BNE – datos.bne.es (linked data, SPARQL) e Hispana (OAI-PMH)
org: Biblioteca Nacional de España (BNE) y Ministerio de Cultura
ministry: Cultura
level: age
sector: cultura-patrimonio
tags: [bne, bibliografia, autoridades, linked-data, sparql, oai-pmh, hispana, patrimonio-digital, europeana]
summary: >-
  Catálogo bibliográfico y de autoridades de la BNE como datos enlazados (RDF, SPARQL, JSON-LD) e Hispana,
  agregador nacional de patrimonio digital con OAI-PMH (10,6 millones de registros, 124 sets, formatos
  oai_dc, edm, ese y didl). datos.bne.es respondió 403 desde este entorno; Hispana sí.
access: [oai-pmh, sparql, api-rest, download]
auth: none
formats: [xml, rdf, ttl, jsonld, json]
update: monthly
coverage: "Fondos desde el siglo XV; Hispana según repositorio"
license: CC0 (datos.bne.es); Hispana según repositorio
base_url: https://hispana.mcu.es/oai/oai.cmd
docs_url: https://www.bne.es/es/catalogos/datos-enlazados
endpoints:
  - path: https://hispana.mcu.es/oai/oai.cmd?verb=ListRecords&metadataPrefix={oai_dc|edm|ese|didl}&set={set}
    desc: Cosecha de Hispana (100 registros por página, resumptionToken numérico con completeListSize 10658209)
    example: curl -s "https://hispana.mcu.es/oai/oai.cmd?verb=ListRecords&metadataPrefix=oai_dc"
    returns: "XML OAI-PMH 2.0 UTF-8 con 100 record por página (unos 200 KB en oai_dc y 3 MB en edm), header sin setSpec, y resumptionToken numérico con expirationDate al día siguiente; completeListSize y cursor solo en la primera página"
  - path: https://hispana.mcu.es/oai/oai.cmd?verb=ListSets
    desc: 124 sets (driver, esegen, esebvph y uno por repositorio agregado, como gal con 341.359 registros); algunos están vacíos
  - path: https://datos.bne.es/sparql
    desc: Endpoint SPARQL de la BNE (no verificado, 403)
  - path: https://datos.bne.es/resource/{id}.jsonld
    desc: Recurso en JSON-LD, Turtle o RDF/XML cambiando la extensión (no verificado, 403)
quirks: [waf-blocks-bots, url-drift]
ids: []
gotchas:
  - datos.bne.es (portada, sparql, resource) y www.bne.es/es/catalogos/datos-enlazados dan 403 (Cloudflare) con una página de bloqueo de 1,3 MB a IP de centros de datos con cualquier User-Agent; www.bne.es/es da 200.
  - La ruta OAI antigua hispana.mcu.es/es/oai da 404; el endpoint es /oai/oai.cmd (Identify anuncia /i18n/oai/oai_hispana.mcu.es.do, que también responde).
  - Algunos sets de ListSets están vacíos en todos los formatos (esegen y bdh dan noRecordsMatch en oai_dc y edm); mirar completeListSize en la primera página.
  - El resumptionToken caduca (expirationDate al día siguiente) y el listado completo son 106.583 páginas; cosechar por set.
  - from sin set acaba en 502 Proxy Error del servidor tras 180 s; con set responde (casi 1 min por página) pero su completeListSize no es fiable (6.238.539 para set=gal&from=2026-01-01, que sin from tiene 341.359).
  - El modelo de datos.bne.es es FRBR (obra, expresión, manifestación); un libro es una manifestación enlazada a obra y autor, y los ids (XX1234567) no son ISBN.
tips:
  - "Con sickle: Sickle('https://hispana.mcu.es/oai/oai.cmd').ListRecords(metadataPrefix='edm', set='<set>') recorre un repositorio; edm trae el enlace al objeto digital (isShownBy)."
related: [csic-digital]
status: active
verified: "2026-09-30"
