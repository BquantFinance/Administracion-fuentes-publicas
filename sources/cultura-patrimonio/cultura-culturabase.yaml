id: cultura-culturabase
name: Ministerio de Cultura – CULTURAbase y estadísticas culturales
org: División de Estadística y Estudios, Secretaría General Técnica
ministry: Cultura
level: age
sector: cultura-patrimonio
tags: [estadisticas-culturales, culturabase, pc-axis, empleo-cultural, bibliotecas, museos, cine, bono-cultural, anuario]
summary: >-
  Sistema PC-Axis (el mismo software que INEbase) con las estadísticas culturales: empleo cultural,
  bibliotecas, museos, cine, comercio exterior, bono cultural, fundaciones y asuntos taurinos; cada tabla se
  descarga en CSV, px o xlsx con URL deducible. Más el Anuario en PDF.
access: [download, portal]
auth: none
formats: [csv, px, xlsx, pdf, html]
update: annual
coverage: "Según estadística; empleo cultural desde 2008 en varias bases (la vigente, CNAE 2025, hasta 2026-2T), bibliotecas por ediciones (2005, 2020), Anuario 2005-2025"
license: Reutilización libre con cita de la fuente
base_url: https://www.cultura.gob.es/servicios-a-la-ciudadania/estadisticas/cultura/mc/culturabase/portada.html
docs_url: https://www.cultura.gob.es/servicios-a-la-ciudadania/estadisticas.html
endpoints:
  - path: https://www.cultura.gob.es/servicios-a-la-ciudadania/estadisticas/cultura/mc/culturabase/{tema}.html
    desc: Página por tema (bibliotecas, empleo-cultural, museos-y-colecciones-museograficas, comercio-exterior...); redirige con 302 a {tema}/resultados-*.html
    example: curl -sL "https://www.cultura.gob.es/servicios-a-la-ciudadania/estadisticas/cultura/mc/culturabase/empleo-cultural.html" | grep -o 'CulturaDynPx[^"]*'
    returns: "HTML con enlaces CulturaDynPx/culturabase/index.htm?type=pcaxis&amp;path=/t1/p1f/M_Anuales/&amp;file=pcaxis (13 en empleo cultural, uno por serie y base); el & llega escapado como &amp;"
  - path: https://estadisticas.cultura.gob.es/CulturaDynPx/culturabase/index.htm?type=pcaxis&path={ruta}&file=pcaxis
    desc: Índice de tablas de un conjunto (ruta como /t1/p1f/M_Anuales/ o /t14/p14b/a2020/) con enlaces CulturaJaxiPx/Tabla.htm que llevan path y file
    example: curl -s "https://estadisticas.cultura.gob.es/CulturaDynPx/culturabase/index.htm?type=pcaxis&path=/t1/p1f/M_Anuales/&file=pcaxis" | grep -o 'Tabla.htm[^"]*'
    returns: "HTML con enlaces Tabla.htm?path=/t1/p1f/M_Anuales/l0/&amp;file=T1FM1001.px&amp;L=0 (13 tablas en este índice)"
  - path: https://estadisticas.cultura.gob.es/CulturaJaxiPx/files/_px/es/{csv_bdsc|px|xlsx}{path}{file}?nocab=1
    desc: Tabla en CSV (separador ;), PC-Axis o xlsx; path y file son los del enlace Tabla.htm (/t1/p1f/M_Anuales/l0/ y T1FM1001.px)
    example: curl -s "https://estadisticas.cultura.gob.es/CulturaJaxiPx/files/_px/es/csv_bdsc/t1/p1f/M_Anuales/l0/T1FM1001.px?nocab=1"
    returns: "CSV UTF-8 con BOM y CRLF; cabecera con el nombre de cada variable (Indicador;Sexo, edad y nivel de estudios;periodo;Total) y una fila por combinación; coma decimal y punto de miles (5.799); periodo mezcla años (2025) y medias móviles (De 2025-3T hasta 2026-2T)"
  - path: https://www.cultura.gob.es/servicios-a-la-ciudadania/estadisticas/cultura/mc/aec.html
    desc: Anuario de Estadísticas Culturales (PDF por edición, 2005-2025 sin 2017) y notas resumen; ficheros bajo /dam/jcr:{uuid}/
quirks: [static-html, latin1, url-drift, soft-errors-200]
ids: []
gotchas:
  - Los CSV llegan en UTF-8 con BOM aunque Content-Type diga ISO-8859-15 (leídos como latin-1 salen «econÃ³micas»); los px sí van en ISO-8859-15 (CODEPAGE).
  - El 01/10/2026 www y estadisticas.cultura.gob.es enviaban la cadena completa (FNMT AC Servidores Seguros Tipo2 G2R) y validaban con certifi; ya no hacía falta añadir ACCOMP.crt.
  - Los {tema}.html redirigen con 302 (curl sin -L no ve los enlaces) y un slug erróneo como museos.html acaba en /comunes/errores/404.html con 200; /servicios-al-ciudadano/ redirige con 301.
  - Un índice CulturaDynPx sin la subcarpeta (path=/t1/) responde 404 con "Error page"; usar la ruta completa que enlaza la página del tema.
  - Empleo cultural tiene una carpeta por base (/t1/p1/ solo 2008-2010, p1b a p1e otras bases y la vigente /t1/p1f/, CNAE 2025, hasta 2026-2T); elegir por la etiqueta del enlace.
  - Los códigos de tabla (T1FM1001, T14B1001) y la carpeta l0 se toman del enlace Tabla.htm; csv_bdsc sale idéntico con o sin nocab=1 y la columna de periodo cambia de nombre entre tablas (periodo, Periodo).
tips:
  - Receta tabla-pcaxis-a-csv; con pandas, read_csv(url, sep=';', encoding='utf-8-sig', decimal=',', thousands='.').
related: [bne-datos, ine-api-tempus, educacion-estadisticas-ruct, interior-criminalidad]
status: active
verified: "2026-10-01"
