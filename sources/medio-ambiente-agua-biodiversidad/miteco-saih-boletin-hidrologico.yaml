id: miteco-saih-boletin-hidrologico
name: MITECO – Boletín hidrológico, histórico de embalses y anuario de aforos
org: Dirección General del Agua
ministry: Para la Transición Ecológica y el Reto Demográfico
level: age
sector: medio-ambiente-agua-biodiversidad
tags: [agua, embalses, reservas, saih, caudales, aforos, cuencas, confederaciones]
summary: >-
  Reserva semanal de cada embalse peninsular de más de 5 hm3 desde 1988 (base Access), boletín hidrológico
  semanal en PDF, anuario de aforos con series diarias de caudal y nivel por estación desde 1912 (CSV por
  cuenca) y listado de estaciones. Los SAIH en tiempo real son de cada confederación.
access: [download, portal]
auth: none
formats: [csv, zip, pdf, html]
update: weekly
coverage: "Embalses 1988-; aforos 1912-2022 (anuario 2021-2022)"
license: Reutilización libre con cita de la fuente
base_url: https://www.miteco.gob.es/es/agua/temas/evaluacion-de-los-recursos-hidricos/boletin-hidrologico.html
docs_url: https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/evaluacion-de-los-recursos-hidricos/modelo-de-datos-bd-embalses-1988-2022_tcm30-538818.pdf
endpoints:
  - path: https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/evaluacion-de-los-recursos-hidricos/boletin-hidrologico/Historico-de-embalses/BD-Embalses.zip
    desc: Access .mdb (10 MB comprimido, 222 MB) con la tabla T_Datos Embalses (AMBITO_NOMBRE, EMBALSE_NOMBRE, FECHA, AGUA_TOTAL, AGUA_ACTUAL, ELECTRICO_FLAG) desde 1988
    example: curl -sSL -o BD-Embalses.zip "https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/evaluacion-de-los-recursos-hidricos/boletin-hidrologico/Historico-de-embalses/BD-Embalses.zip"
    returns: "Zip (10 MB) con un único fichero BD-Embalses.mdb (Access); leer con mdbtools (mdb-tables, mdb-export) o pandas_access, no con pandas directamente"
  - path: https://sede.miteco.gob.es/BoleHWeb/
    desc: Boletín hidrológico semanal en PDF (aplicación con calendario JS, sin URL estable por fecha)
  - path: https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/evaluacion-de-los-recursos-hidricos/sistema-informacion-anuario-aforos/Anuario-21-22-csv.zip
    desc: Anuario completo en CSV (136 MB), una carpeta por cuenca con afliq.csv (indroea;fecha;altura;caudal diarios), estaf.csv, embalse.csv y anual_a.csv
    example: curl -sSL -o Anuario-21-22-csv.zip "https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/evaluacion-de-los-recursos-hidricos/sistema-informacion-anuario-aforos/Anuario-21-22-csv.zip"
    returns: "Zip (130 MB, 342 ficheros) con una carpeta por demarcación (CANTABRICO, DUERO, EBRO...) y CSV ; por tipo: afliq.csv (indroea;fecha;altura;caudal diario, fecha dd/mm/aaaa, desde 1912 en algunas estaciones), afliqc (ref_ceh;fecha;altura;caudal), afliqe, afliqi y anual_*.csv"
  - path: https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/evaluacion-de-los-recursos-hidricos/sistema-informacion-anuario-aforos/listado-estaciones-aforo.zip
    desc: Cuatro CSV de estaciones (río, embalse, canal, evaporimétrica) con COD_HIDRO, COD_SAIH, COD_SAICA, UTM huso 30 ETRS89, masa de agua, municipio y provincia
    returns: "Cuatro CSV ; (Situac 1_Canal, 2_Embalse, 3_Evaporimetrica, 4_Rio) con ORGANISMO_CUENCA_VISOR, COD_SITUACION_ESTACION, COD_HIDRO (indroea), NOM_ANUARIO, COD_SAIH, COD_SAICA, ESTADO, ANO_INICIO_MEDIDAS, COORD_UTMX_H30_ETRS89, COORD_UTMY_H30_ETRS89, RIO, TERMINO_MUNICIPAL, PROVINCIA, COD_MASA_AGUA"
  - path: https://www.miteco.gob.es/es/agua/temas/evaluacion-de-los-recursos-hidricos/sistema-informacion-anuario-aforos.html
    desc: Página del anuario con la variante mdb, la memoria y la descripción de tablas en PDF
  - path: https://www.miteco.gob.es/es/agua/temas/evaluacion-de-los-recursos-hidricos/saih.html
    desc: Enlaces a los SAIH de cada confederación (Ebro, Tajo, Duero, Guadalquivir, Júcar, Segura, Miño-Sil, Sur), cada uno con su web y formato
quirks: [url-drift, js-rendered]
ids: []
gotchas:
  - No hay CSV ni xlsx del boletín semanal; el dato semanal por embalse solo está en el .mdb (fichero actualizado el 29/09/2026) y en los PDF de BoleHWeb.
  - Leer el .mdb requiere mdbtools (mdb-export) o un driver Access; no hay lector puro Python fiable. El PDF del modelo de datos describe los campos.
  - Los datos del boletín son provisionales y sin validar; los validados de embalses están en el anuario de aforos (embalse.csv), que llega con dos o tres años de retraso.
  - CSV del anuario con separador ; y punto decimal, fechas dd/mm/aaaa y huecos como campo vacío; afliq.csv del Cantábrico pesa 25 MB. Once carpetas de cuenca, incluida SIN DEFINIR.
  - Cada estación tiene varios códigos (indroea o ref_ceh en las series, COD_HIDRO, COD_SAIH y COD_SAICA en el listado); estaf.csv trae coordenadas UTM, ETRS89 y WGS84 y cod_saih.
  - La ruta historico-de-boletines.html da 404 y el visor sig.mapama.gob.es/redes-seguimiento redirige al índice de visores de mapa.gob.es.
  - Las capas GIS (embalses, estaciones de aforo, SAIH) se descargan en gis.miteco.gob.es tras resolver un desafío ALTCHA (ver miteco-banco-datos-naturaleza); los ZIP del catálogo CKAN dan 404.
tips:
  - "Con mdbtools, mdb-export BD-Embalses.mdb 'T_Datos Embalses' > embalses.csv saca toda la serie; AGUA_ACTUAL y AGUA_TOTAL están en hm3 y ELECTRICO_FLAG distingue uso consuntivo (0) e hidroeléctrico (1)."
  - "Series diarias de caudal listas para pandas: read_csv de afliq.csv con sep=';' y parse_dates de fecha (dayfirst=True), y merge con estaf.csv por indroea para nombre y coordenadas."
