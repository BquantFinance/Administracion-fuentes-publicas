id: miteco-prtr
name: PRTR-España – Registro Estatal de Emisiones y Fuentes Contaminantes
org: Dirección General de Calidad y Evaluación Ambiental
ministry: Para la Transición Ecológica y el Reto Demográfico
level: age
sector: medio-ambiente-agua-biodiversidad
tags: [prtr, emisiones, contaminantes, industria, residuos, complejos-industriales, cnae, ippc]
summary: >-
  Emisiones anuales a aire, agua y suelo y transferencias de residuos de cada complejo industrial afectado,
  por sustancia y método, más el inventario de complejos con CNAE, actividad PRTR e IPPC y municipio.
  Descarga masiva en XML por año (emisiones 2001-2024, residuos 2007-2024) y consultas web.
access: [download, portal]
auth: none
formats: [xml, zip, html]
update: annual
coverage: "2001-2024"
license: Reutilización libre con cita de la fuente
base_url: https://prtr-es.miteco.gob.es/
docs_url: https://prtr-es.miteco.gob.es/INFORMACION-METADATOS-PRTREspana-1468112022.html
endpoints:
  - path: /informes/descargas/PRTR_Espana_MITECO_Complejos.zip
    desc: Inventario de complejos (XML ArrayOfComplejo con CodigoPRTR, nombre, empresa matriz, CNAE-2009, CodPRTRDEI, CodIPPC, dirección, municipio, provincia y CCAA)
    example: curl -sSL -o complejos.zip "https://prtr-es.miteco.gob.es/informes/descargas/PRTR_Espana_MITECO_Complejos.zip"
    returns: "Zip de 640 KB con [Content_Types].xml y un XML UTF-8 de 5,5 MB, ArrayOfComplejo con 9369 Complejo: CodigoPRTR, NombreDelComplejo, EmpresaMatriz, ActividadEconomica, CNAE-2009 (20.14), CodPRTRDEI (4.a.ii), CodIPPC, Direccion, CodPostal, Poblacion, Municipio, Provincia, CCAA y DemarcacionHidrografica, sin código INE"
  - path: /informes/descargas/PRTR_Espana_MITECO_emisiones{AAAA}.zip
    desc: Emisiones de un año (XML ArrayOfEmisiones con CodigoPRTR, AnyoReferencia, Contaminante, CantidadTotalkgporaño, MedioReceptor, Metodo y detalle Metodo_MCE)
    example: curl -sSL -o emisiones2024.zip "https://prtr-es.miteco.gob.es/informes/descargas/PRTR_Espana_MITECO_emisiones2024.zip"
    returns: "Zip de 1,2 MB con un XML de 27 MB, ArrayOfEmisiones con 47.317 Emision en 2024: CodigoPRTR, NombreDelComplejo, AnyoReferencia, Contaminante (Metano (CH4)), CantidadTotalkgporaño, MedioReceptor (Aire, Suelo, Litoral, cuencas, EDAR...), Metodo (M, C, E) y Metodo_MCE; sin municipio ni CNAE, cruzar por CodigoPRTR"
  - path: /informes/descargas/PRTR_Espana_MITECO_residuos{AAAA}.zip
    desc: Transferencias de residuos de un año (2007-2024)
    example: curl -sSL -o residuos2024.zip "https://prtr-es.miteco.gob.es/informes/descargas/PRTR_Espana_MITECO_residuos2024.zip"
    returns: "Zip de 1,9 MB con un XML de 53 MB, ArrayOfResiduos con 53.206 Residuo en 2024: CodigoPRTR, NombreDelComplejo, Provincia, AnyoReferencia, Residuo (código LER y texto), CantidadTransferidatoneladasporaño en toneladas, OperacionTratamiento (R13, D15...), Metodo, Metodo_MC y datos del gestor"
  - path: /informes/descargasEmisiones.aspx
    desc: Índice de ZIP de emisiones por año; descargasResiduos.aspx para residuos y descargas.aspx para el inventario
  - path: /Informes/InventarioInstalacionesIPPC.aspx
    desc: Buscador de complejos, formulario ASP.NET con __VIEWSTATE como facilitylevel, seriesPlanta y pollutant; el inventario completo está en el ZIP de complejos
quirks: [viewstate-forms, url-drift, overwritten-in-place]
ids: [cnae]
gotchas:
  - El dominio prtr-es.es da 404 por https y 503 por http; www.prtr-es.es sirve un certificado sin ese nombre y en.prtr-es.es uno caducado. El portal vive en prtr-es.miteco.gob.es.
  - Cada ZIP contiene un solo XML grande (Emisiones2023 son 28 MB) más un [Content_Types].xml; no hay CSV. Parsear en streaming (iterparse) por elemento Emision o Complejo.
  - En residuos el registro Residuo contiene un campo también llamado Residuo (código LER y texto); un iterparse por esa etiqueta cuenta el doble (106.412 para 53.206 registros). Tomar solo los hijos directos de la raíz.
  - MedioReceptor no tiene el valor Agua; en 2024 son 10 (Aire, Suelo, Litoral, cuatro de cuenca, EDAR, depuradora privada, alcantarillado) con mayúsculas y espacios finales irregulares, y 2001 usa otros (EPER Depuradora).
  - Emisiones y complejos se enlazan por CodigoPRTR; el fichero de emisiones repite NombreDelComplejo pero no lleva municipio ni CNAE.
  - CCAA lleva siempre un espacio final ('Cataluña ', 'Balears  (Illes) ') y CNAE-2009 va con punto (20.14); limpiar ambos antes de cruzar con códigos INE o con CNAE de 4 dígitos.
  - Solo se declaran emisiones que superan el umbral de cada sustancia; ausencia no significa emisión cero. Contaminante viene por nombre en castellano con fórmula (Metano (CH4)), no por código CAS.
  - Cantidades como texto con punto y 14 decimales (215.00000000000000), en kg en emisiones y en toneladas en residuos; Metodo es M (medido), C (calculado) o E (estimado), con el detalle en Metodo_MCE.
  - El ZIP del último año y el de complejos se regeneran en la misma URL (emisiones2024 con Last-Modified 30/09/2026 23:06 GMT y XML interno del 1/10); guardar copia fechada si se necesita reproducir un análisis.
  - El catálogo CKAN de MITECO, que listaba el dataset PRTR con un WMS roto y ZIP en descargafichero.aspx (404), daba 404 en su API el 1/10/2026 («El catálogo se está desplegando actualmente»).
tips:
  - Cruce típico. Complejos por CNAE-2009 y CodIPPC con las emisiones por CodigoPRTR; CodPRTRDEI identifica el epígrafe del anexo I del Reglamento E-PRTR.
  - Para comparar con otros países, el mismo dato agregado está en el Industrial Emissions Portal de la EEA; para España la fuente primaria es este registro.
related: [miteco-calidad-aire]
