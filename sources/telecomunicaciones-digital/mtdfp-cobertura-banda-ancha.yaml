id: mtdfp-cobertura-banda-ancha
name: SETELECO – Cobertura de banda ancha por municipio, provincia y CCAA
org: Secretaría de Estado de Telecomunicaciones e Infraestructuras Digitales
ministry: Transformación Digital y de la Función Pública
level: age
sector: telecomunicaciones-digital
tags: [banda-ancha, cobertura, fibra, ftth, 5g, 4g, telecomunicaciones, municipios, entidades-singulares, arcgis]
summary: >-
  Dos xlsx con la fracción de hogares o viviendas con cobertura por tecnología (FTTH, HFC, inalámbrico, 4G,
  5G) y velocidad (30 Mbps a 1 Gbps) por municipio (código INE), provincia y CCAA de 2013 a 2025 y por entidad
  singular hasta 2020, capas ArcGIS consultables del último año e informes en PDF.
code:
  module: fuentes_publicas.clientes.arcgis
  use:
    - "arcgis.entidades(arcgis.COBERTURA_FTTH): las 8.132 filas de cobertura FTTH por municipio paginando por OID; una consulta sola se queda en 2.000 sin error"
access: [download, api-rest]
auth: none
formats: [xlsx, json, geojson, pdf, html]
update: annual
coverage: "Diciembre de 2013 a 2015 y junio de 2016 a 2025 (2016 solo FTTH, LTE y velocidades)"
base_url: https://digital.gob.es/telecomunicaciones-infraestructuras-digitales/areas-interes/banda-ancha/informacion-cobertura
docs_url: https://digital.gob.es/telecomunicaciones-infraestructuras-digitales/areas-interes/banda-ancha/informacion-cobertura/informes-cobertura/informe-cobertura-2025
endpoints:
  - path: https://digital.gob.es/content/dam/portal-mtdfp/avance-digital/telecomunicacion-e-infraestructuras-digitales/areas_interes/banda-ancha/cobertura/documents/Cobertura_BA_Espa%C3%B1a_2021-2025_MUN_PROV_CCAA_Nacional_datosgob_DEF.xlsx
    desc: Cobertura junio 2021-2025 (6,5 MB); hojas Municipio, Provincia, CCAA y Nacional en versión _%hogar (2023-2025) y _%viviendas (2021-2025); CMUN y Habitantes
    example: curl -sL -o cobertura_2021_2025.xlsx "https://digital.gob.es/content/dam/portal-mtdfp/avance-digital/telecomunicacion-e-infraestructuras-digitales/areas_interes/banda-ancha/cobertura/documents/Cobertura_BA_Espa%C3%B1a_2021-2025_MUN_PROV_CCAA_Nacional_datosgob_DEF.xlsx"
    returns: "Hoja Leyenda y 8 hojas; Municipio_%hogar con 8.132 municipios más una fila vacía final: CMUN texto de 5 dígitos, Habitantes y Hogares enteros, columnas vacías entre grupos y fracciones float de 0 a 1 por tecnología y año"
  - path: https://digital.gob.es/content/dam/portal-mtdfp/avance-digital/telecomunicacion-e-infraestructuras-digitales/areas_interes/banda-ancha/cobertura/documents/cobertura_ba_espana_2013-2020_esp_mun_prov_ccaa_nacional_datosgob.xlsx
    desc: Cobertura 2013-2020 (42 MB); hoja ES con 61.818 entidades singulares (Código ESP, 11 dígitos), Municipio, Provincia, CCAA y Nacional; ADSL, VDSL, FTTH, HFC, LTE
    example: curl -sL -o cobertura_2013_2020.xlsx "https://digital.gob.es/content/dam/portal-mtdfp/avance-digital/telecomunicacion-e-infraestructuras-digitales/areas_interes/banda-ancha/cobertura/documents/cobertura_ba_espana_2013-2020_esp_mun_prov_ccaa_nacional_datosgob.xlsx"
    returns: "Hojas Leyenda, ES, Municipio (8.131), Provincia, CCAA y Nacional; ES con 118 columnas: Código ESP texto de 11 dígitos acabado en 00, Habitantes entero, Viviendas y Hogares estimados con decimales, fracciones de 0 a 1 y N.D. como texto"
  - path: /informes-cobertura/informe-cobertura-{AAAA}
    desc: Página por año (2012-2025) con el informe, el resumen ejecutivo y la metodología en PDF bajo /content/dam/ (Informe_Cobertura-BA-2025.pdf)
    example: curl -s "https://digital.gob.es/telecomunicaciones-infraestructuras-digitales/areas-interes/banda-ancha/informacion-cobertura/informes-cobertura/informe-cobertura-2025" | grep -o '/content/dam/[^"]*\.pdf'
  - path: https://services-eu1.arcgis.com/3LqdsBPalJaUFvo1/arcgis/rest/services/cobertura_municipios_2025_hogar_{ftth|100mbps|1gbps|5gglobal|5g35ghz|5gsa}/FeatureServer/0/query
    desc: Capas de los mapas de /mapas-cobertura-agregada, una por tecnología (sin _hogar, % de viviendas); también cobertura_provincias_2025 y cobertura_ccaa_2025
    params: "where (cod_munici='28079' o 1=1), outFields=*, returnGeometry=false, f=json o geojson, resultOffset para paginar"
    example: curl -s "https://services-eu1.arcgis.com/3LqdsBPalJaUFvo1/arcgis/rest/services/cobertura_municipios_2025_hogar_ftth/FeatureServer/0/query?where=cod_munici%3D%2728079%27&outFields=*&returnGeometry=false&f=json"
    returns: "{features:[{attributes:{cod_ccaa, cod_provin, cod_munici (texto INE), municipio, nuts, tecnologia, porcentaje (de 0 a 100), habitantes, viviendas_, hogares_to, fecha (epoch ms, 2025-06-30)}}]}; 8.132 municipios, 2.000 por página con exceededTransferLimit"
quirks: [static-html, url-drift]
ids: [ine-municipio, ine-provincia, ccaa, nuts, ine-entidad-singular]
gotchas:
  - Los valores del xlsx son fracciones entre 0 y 1 (0.9982), no porcentajes, con algún 1,00000004 por redondeo; las capas ArcGIS dan porcentaje de 0 a 100 (99,39 frente a 0,9939 en Madrid).
  - Las cabeceras llevan salto de línea y el periodo entre paréntesis, a veces con espacios sueltos (FTTH \n(junio 2025), máxima demanda\n(junio 2023) con espacio final); hay columnas vacías entre grupos.
  - "Dos bases no comparables en el fichero 2021-2025: hojas _%hogar (hogares del censo INE 2021, desde junio 2023) y _%viviendas (viviendas catastrales, desde junio 2021)."
  - En _%viviendas el denominador cambia cada año (catastro de agosto de 2020 para 2021, enero de 2022, enero de 2023 y enero de 2024) aunque la columna Viviendas sea solo la de enero de 2024.
  - CMUN es el código INE de 5 dígitos como texto y el Código ESP tiene 11 (municipio, colectiva, singular y 00); las hojas de provincia y CCAA no traen código y cambian la grafía (MADRID (COMUNIDAD DE), PAIS VASCO).
  - La ñ del nombre del fichero 2021-2025 va en UTF-8 (%C3%B1); con %F1 o sin tilde el servidor da 404.
  - El fichero 2013-2020 pesa 42 MB; la hoja ES tarda 49 s con openpyxl en read_only y 8,5 s con calamine. Trae N.D. como texto en celdas numéricas (38.516 en ES y 1.056 en Municipio).
  - 2013-2015 son de diciembre y desde 2016 de junio, pero junio de 2016 solo trae FTTH, LTE y velocidades y hay una columna extra de diciembre de 2019 para 2, 10 y 30 Mbps; máxima demanda desde 2022.
  - Las capas ArcGIS cambian de nombre cada año (cobertura_municipios_2023_ftth, cobertura_municipios_2025_hogar_ftth), conviven con capas de prueba (_borrar_2026) y un error llega con HTTP 200 y error.code 400.
  - Los nombres de municipio varían entre hojas y ficheros (Alegria-Dulantzi en Municipio 2013-2020, Alegría-Dulantzi en ES); cruzar siempre por CMUN o Código ESP.
tips:
  - "pd.read_excel(url, sheet_name='Municipio_%hogar', dtype={'CMUN': str}) y normalizar cabeceras con str.replace(r'\\s+', ' ', regex=True).str.strip(); Habitantes y Hogares permiten ponderar agregados propios."
  - Cruce por CMUN con ine-codigos-territoriales; líneas y operadores por municipio en cnmc-data.
  - La capa ArcGIS 5gsa (5G standalone) no tiene columna en el xlsx; para un valor suelto de 2025 basta una consulta por cod_munici.
related: [ine-codigos-territoriales, cnmc-data, datos-gob-es-api]
status: active
verified: "2026-10-01"
