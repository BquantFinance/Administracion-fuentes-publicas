gotchas:
  - Las tablas se sirven como HTML paginado; la exportación a Excel está enlace a enlace, sin descarga masiva.
  - La estadística de IRPF por municipios solo cubre municipios de más de 1.000 habitantes en territorio de régimen común (excluye País Vasco y Navarra).
  - Las URLs de la sede cambiaron en 2021 (de agenciatributaria.es a sede.agenciatributaria.gob.es); enlaces antiguos redirigen de forma inconsistente.
