id: aeat-estadisticas
name: AEAT – Estadísticas tributarias y descarga masiva
org: Agencia Estatal de Administración Tributaria (AEAT)
ministry: Hacienda
level: age
sector: hacienda-presupuestos
tags: [aeat, irpf, iva, sociedades, patrimonio, recaudacion, estadisticas-tributarias, municipios]
summary: >-
  Estadísticas de declarantes de IRPF (nacional, por municipio y por código postal), IVA, Sociedades y Patrimonio,
  informes mensuales y anuales de recaudación, ventas, empleo y salarios en fuentes tributarias, comercio exterior.
  CSV masivos del anuario y series de recaudación en xlsx con URL estable.
access: [download, portal]
auth: none
formats: [csv, xlsx, html, pdf]
update: monthly
coverage: "1992- según estadística"
license: Reutilización libre con cita de la fuente
base_url: https://sede.agenciatributaria.gob.es/Sede/estadisticas.html
docs_url: https://sede.agenciatributaria.gob.es/Sede/estadisticas/anuario-estadistico/acceso-descarga-masiva-datos.html
endpoints:
  - path: https://sede.agenciatributaria.gob.es/static_files/Sede/Tema/Estadisticas/Anuario_estadistico/Exportacion/{fichero}.csv
    desc: CSV masivos del anuario. IRPFmunicipios, modelo100 (IRPF), modelo190_salarios, modelo190_pensiones, modelo200 (Sociedades), modelo390 (IVA), modelo714 (Patrimonio)
    example: curl -sO "https://sede.agenciatributaria.gob.es/static_files/Sede/Tema/Estadisticas/Anuario_estadistico/Exportacion/IRPFmunicipios.csv"
  - path: https://sede.agenciatributaria.gob.es/static_files/Sede/Tema/Estadisticas/Recaudacion_Tributaria/Informes_mensuales/Cuadros_estadisticos_series_es_es.xlsx
    desc: Series mensuales de recaudación por figura tributaria; en la misma carpeta Ingresos_por_Delegaciones.xlsx
    example: curl -sO "https://sede.agenciatributaria.gob.es/static_files/Sede/Tema/Estadisticas/Recaudacion_Tributaria/Informes_mensuales/Cuadros_estadisticos_series_es_es.xlsx"
  - path: https://sede.agenciatributaria.gob.es/static_files/AEAT/Estudios/Estadisticas/Informes_Estadisticos/Informes_mensuales_recaudacion_tributaria/{AAAA}/IMR_{AA}_{MM}_es_es.pdf
    desc: Informe mensual de recaudación en PDF
  - path: https://sede.agenciatributaria.gob.es/Sede/datosabiertos/catalogo/hacienda/{Estadistica}.shtml
    desc: Ficha de cada estadística con enlaces a las tablas HTML por ejercicio y a su documentación
  - path: https://sede.agenciatributaria.gob.es/Sede/estadisticas/estadisticas-impuesto.html
    desc: Índice de estadísticas por impuesto con enlace a la ficha de cada una
gotchas:
  - Los CSV usan punto y coma como separador, coma decimal y CRLF; las columnas son códigos (MUNI_1, M714_3) descritos en AyudaCSV_AnuarioTotal.pdf y AyudaCSV_AnuarioMunicipal.pdf de la misma carpeta.
  - IRPFmunicipios.csv pesa 30 MB y trae todos los ejercicios en una sola tabla (columnas EJER y TRAMO).
  - Las rutas estadisticas-irpf.html, informes-mensuales-recaudacion-tributaria.html y /Sede/datos-abiertos.html no existen (404); el índice real es estadisticas-impuesto.html y las fichas cuelgan de /Sede/datosabiertos/catalogo/hacienda/.
  - Las tablas de cada estadística son sitios HTML estáticos por ejercicio bajo /AEAT/Contenidos_Comunes/.../Publicaciones/sites/{impuesto}/{AAAA}/; exportación a Excel tabla a tabla.
  - Los xlsx de series se sobreescriben cada mes en la misma URL; guardar copia si se necesita el histórico de revisiones.
tips:
  - El CSV masivo del anuario evita rascar las tablas HTML; para series de recaudación usar el xlsx de cuadros.
related: [aeat-servicios-web, igae-ejecucion-presupuestaria, ine-codigos-territoriales]
status: active
verified: "2026-09-30"
