id: hacienda-ovef
name: Hacienda – Entidades locales, presupuestos, deuda viva, financiación y tributos
org: Secretaría General de Financiación Autonómica y Local
ministry: Hacienda
level: age
sector: hacienda-presupuestos
tags: [ayuntamientos, entidades-locales, presupuestos, liquidaciones, deuda-viva, financiacion-local, tributos-locales, pmp]
summary: >-
  Entidades locales: deuda viva por ayuntamiento, entregas a cuenta mensuales, ejecución trimestral, estabilidad,
  presupuestos y liquidaciones por entidad desde 2002 (CONPREL), periodo medio de pago y tipos impositivos
  municipales. Ficheros xlsx, xls y Access por año, trimestre o mes.
access: [download, portal]
auth: none
formats: [xlsx, xls, zip, pdf]
update: monthly
license: Reutilización libre con cita de la fuente
base_url: https://www.hacienda.gob.es/es-ES/Areas%20Tematicas/Administracion%20Electronica/OVEELL/Paginas/OVEntidadesLocales.aspx
docs_url: https://www.hacienda.gob.es/es-ES/Areas%20Tematicas/Administracion%20Electronica/OVEELL/Paginas/OVEntidadesLocales.aspx
endpoints:
  - path: https://www.hacienda.gob.es/cdi/sist%20financiacion%20y%20deuda/informacioneells/{AAAA}/deuda-viva-ayuntamientos-{AAAA}12.xlsx
    desc: Deuda viva a 31 de diciembre por ayuntamiento; en la misma carpeta deuda-viva-dipycab y deuda-viva-restoeell
    example: curl -sO "https://www.hacienda.gob.es/cdi/sist%20financiacion%20y%20deuda/informacioneells/2025/deuda-viva-ayuntamientos-202512.xlsx"
    returns: "xlsx con hojas Datos, Datos_Format y Resumen_CCAA_Prov; en Datos título en la fila 9 y cabecera en la 12; códigos de CCAA, provincia (2) y municipio (3) como texto y nombres con espacios de relleno; deuda en miles de euros con decimales; última fila TOTAL; 8132 municipios en 2025"
  - path: https://serviciostelematicosext.hacienda.gob.es/SGFAL/CONPREL/Consulta/DescargaFichero?CCAA={n}&TipoDato={Presupuestos|Liquidaciones}&Ejercicio={AAAA}&TipoPublicacion={Definitiva|Avance|Access}
    desc: CONPREL, presupuestos y liquidaciones de las EELL; Definitiva da el xlsx agregado (CCAA 0 nacional, 1 a 19 por comunidad) y Access el detalle por entidad
    params: "Ejercicio 2002-2025; con Access y Avance el CCAA va vacío; Avance es lo último provisional (liquidación 2025 y presupuesto 2026 el 30/09/2026); un año no publicado da 500 en HTML"
    example: curl -s -OJ "https://serviciostelematicosext.hacienda.gob.es/SGFAL/CONPREL/Consulta/DescargaFichero?CCAA=0&TipoDato=Liquidaciones&Ejercicio=2024&TipoPublicacion=Definitiva"
    returns: "Nombre en Content-Disposition. Definitiva EL2024C00.xlsx con unas 80 hojas (Parametros, Indice, Tabla 1 a 11.4, Relación); Avance EL2025CT.xlsx; Access Liquidaciones2024.zip de 52 MB con una base .accdb; el servidor ignora Range"
  - path: https://www.hacienda.gob.es/es-es/cdi/paginas/sistemasfinanciaciondeuda/informacioneells/datosfinanciacionel.aspx
    desc: Entregas a cuenta mensuales (entrega-a-cuenta-mensual-{AAAA}-{MM}), cesión de tributos y variables de financiación local por ejercicio
  - path: https://www.hacienda.gob.es/es-es/cdi/paginas/informacionpresupuestaria/informacioneells/consultaejecprestrimestral.aspx
    desc: Ejecución presupuestaria trimestral de las EELL agregada por CCAA y grandes ciudades, un fichero por trimestre desde el 2T de 2013
  - path: https://www.hacienda.gob.es/es-ES/CDI/Paginas/EstabilidadPresupuestaria/InformacionCCLLs/Cumplimiento_objetivoestabilidad_EELL.aspx
    desc: Liquidación anual por entidad con saldo no financiero, estabilidad y regla de gasto, un fichero por ejercicio
    returns: "xlsx con hojas Ayuntamientos, Diputaciones y RESUMEN; cabecera en la fila 20 tras las notas; código de entidad en cuatro columnas (provincia, municipio y dos letras de tipo); importes en euros; Remisión Si o No, con celdas vacías si no remitió"
  - path: https://serviciostelematicosext.hacienda.gob.es/SGCIEF/PublicacionPresupuestos/aspx/inicio.aspx
    desc: Presupuestos de las comunidades autónomas, no de EELL (2002-2025 y avance 2026), consolidados y por entidad; xlsx tras el POST del formulario
  - path: https://serviciostelematicosext.hacienda.gob.es/SGFAL/ConsultaTipos/html/portadaconsultasm.aspx
    desc: Tipos de IBI, IAE, IVTM y otros tributos por municipio desde 2000; formulario con postback, sin descarga estructurada
  - path: https://serviciostelematicosext.hacienda.gob.es/SGCIEF/PMP_NET/aspx/consulta/consulta.aspx?tipoPublicacion=2
    desc: Periodo medio de pago de las EELL, mensual (cesión) o trimestral (variables); la descarga directa del xlsx está en hacienda-central-informacion
quirks: [static-html, session-required, viewstate-forms, url-drift]
ids: [ine-municipio, ine-provincia]
gotchas:
  - SelDescargaDC.aspx y SeldescargaDF.aspx (presupuestos de CCAA) redirigen a sesion_expirada.htm por URL directa; con cookie jar, GET de inicio.aspx y del formulario y POST con __VIEWSTATE dan el xlsx sin navegador.
  - Las rutas de hacienda.gob.es llevan espacios (sist financiacion y deuda) y a veces tildes (liquidaci%c3%b3n2017); usar el href tal cual, codificado.
  - Los nombres de fichero llevan la fecha de publicación con formato variable (liquidacion2024eell-...-13022026, 2025q2-...-20250930); rascar la página. Solo deuda viva y entregas a cuenta mensuales siguen patrón fijo.
  - xls y xlsx conviven sin regla (ejecución trimestral xlsx desde 2021q2, liquidaciones desde 2020; entrega-a-cuenta-mensual-2026-07 es xls y la de 2026-09 xlsx); tomar la extensión del enlace.
  - Deuda viva y liquidaciones dan el municipio en 3 dígitos separado de la provincia; concatenar provincia y municipio para el código INE de 5.
  - El código de CCAA de Hacienda (deuda viva, parámetro CCAA de CONPREL) no es el del INE de 10 a 17 (Extremadura 10, Madrid 12, C. Valenciana 17); cruzar por provincia.
  - La liquidación por entidad excluye los ayuntamientos del País Vasco y Navarra y deja vacías las filas de quien no remitió (Remisión No, 2281 de 7608 en 2025).
  - La página de tributos locales de la ficha anterior (ImpuestosTasasEELL.aspx) devuelve 404; la consulta está en SGFAL/ConsultaTipos.
related: [igae-ejecucion-presupuestaria, hacienda-central-informacion, ine-codigos-territoriales]
status: active
verified: "2026-10-01"
