id: igae-ejecucion-presupuestaria
name: IGAE – Ejecución presupuestaria y contabilidad nacional
org: Intervención General de la Administración del Estado (IGAE)
ministry: Hacienda
level: age
sector: hacienda-presupuestos
tags: [igae, presupuestos, ejecucion, deficit, contabilidad-nacional, sector-publico, invente, pmp]
summary: >-
  Déficit y operaciones no financieras de las AAPP en contabilidad nacional (mensual por subsector, trimestral y
  anual), ejecución mensual del presupuesto del Estado en caja, cuentas anuales de las AAPP e inventario de entes
  públicos (INVENTE). Ficheros xlsx anuales con URL predecible.
access: [download, portal]
auth: none
formats: [xlsx, pdf, html]
update: monthly
license: Reutilización libre con cita de la fuente
base_url: https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadNacional/Publicaciones/Paginas/Publicaciones.aspx
docs_url: https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadNacional/Paginas/Calendario.aspx
endpoints:
  - path: https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadNacional/Publicaciones/Documents/AACC-M/M_AACC_{AAAA}.xlsx
    desc: Operaciones no financieras mensuales de la Administración Central en contabilidad nacional, un xlsx por año desde 2013
    example: curl -sO "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadNacional/Publicaciones/Documents/AACC-M/M_AACC_2026.xlsx"
  - path: https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadNacional/Publicaciones/Paginas/{im|it|ia}nofinancieras{AC|CA|CL|SS|Total|AAPP}.aspx
    desc: Páginas de operaciones no financieras mensuales (im), trimestrales (it) y anuales (ia) por subsector
  - path: https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadNacional/Publicaciones/Documents/CCAA-M/M_CCAA_Sub_Det_{AAAA}.xlsx
    desc: Ejecución presupuestaria mensual de las comunidades autónomas por subsector con detalle (xlsx anual acumulado, URL predecible)
    example: curl -sO "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadNacional/Publicaciones/Documents/CCAA-M/M_CCAA_Sub_Det_2026.xlsx"
  - path: https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadNacional/Publicaciones/Documents/CAAP/CAP_Serie.xlsx
    desc: Cuentas anuales de las AAPP, serie completa; liquidaciones y subvenciones por año en la misma carpeta
  - path: https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Paginas/imejecucionpresupuesto.aspx
    desc: Ejecución mensual del presupuesto del Estado en caja; PDF por mes y xlsx con anexos
  - path: https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/BasesDatos/Invente/Paginas/inicio.aspx
    desc: INVENTE, inventario de entes del sector público estatal, autonómico y local
quirks: [static-html]
gotchas:
  - Las rutas imMensualEstado.aspx y pap.hacienda.gob.es/invente2/ de la ficha anterior no existen (404 y rechazo del WAF); INVENTE cuelga de BasesDatos/Invente.
  - Sitio SharePoint. Los xlsx de contabilidad nacional siguen patrón por año (M_AACC_{AAAA}.xlsx); los de ejecución en caja llevan el mes en mayúsculas y espacios (MENSUAL ABRIL 2026.xlsx), codificar %20.
  - Los trimestrales del total de AAPP (itnofinancierasAAPP) solo se publican en PDF.
  - Contabilidad nacional (SEC 2010, devengo) y ejecución presupuestaria (caja) dan cifras distintas para el mismo periodo.
  - Los datos por CCAA y por ayuntamiento están en Hacienda (hacienda-ovef), no en la IGAE.
related: [hacienda-ovef, airef-datos, tesoro-estadisticas, bde-estadisticas]
status: active
verified: "2026-09-30"
