id: cis-estudios
name: CIS – Catálogo de estudios y microdatos de barómetros y encuestas (MD{n}.zip)
org: Centro de Investigaciones Sociológicas
ministry: Presidencia, Justicia y Relaciones con las Cortes
level: age
sector: demografia-migraciones-sociedad
tags: [cis, encuestas, barometro, opinion-publica, microdatos, estimacion-voto, spss, sociologia, json-ld, liferay]
summary: >-
  Microdatos de los estudios del CIS (barómetros, preelectorales, postelectorales y encuestas temáticas) sin
  registro como MD{n}.zip con .sav, CSV y texto de ancho fijo, más cuestionario, ficha técnica, tabulaciones xlsx
  y estimación de voto en PDF; cada página de estudio lleva JSON-LD con las URL.
access: [download, scraping]
auth: none
formats: [zip, sav, csv, xlsx, pdf, html, jsonld, xml]
update: monthly
coverage: "Catálogo con 2582 estudios; ficheros MD verificados para los estudios 2000, 3000, 3490, 3500 y 3577 (barómetro de septiembre de 2026)"
license: CC BY 4.0 según el JSON-LD de cada estudio; condiciones en /es/condiciones-reutilizacion-datos-del-cis
base_url: https://www.cis.es/es/estudios/catalogo
docs_url: https://www.cis.es/es/estudios/informacion-general
endpoints:
  - path: https://www.cis.es/es/estudios/{slug}
    desc: Página de un estudio (barometro-de-septiembre-2026); su JSON-LD trae un nodo Dataset con identifier (número de estudio), datePublished, distribution e isPartOf
    example: curl -s "https://www.cis.es/es/estudios/barometro-de-septiembre-2026" | grep -o '"contentUrl":"[^"]*"'
    returns: "HTML de 560 KB con dos bloques JSON-LD (Report, Dataset y WebPage); el Dataset del 3577 lista seis distribution (estimación, cuestionario, MD zip, ficha técnica, {n}-multi_enlace.html y marginales) con encodingFormat, contentUrl y name, license CC BY 4.0 e isPartOf con 31 series"
  - path: https://www.cis.es/documents/20117/{carpeta}/MD{n}.zip
    desc: Microdatos del estudio n; zip con {n}.sav, {n}_num.csv y {n}_etiq.csv (UTF-8 con BOM, separador ;), DA{n} de ancho fijo con sintaxis ES{n} y PDF de cuestionario
    params: "carpeta es el id de carpeta Liferay propio de cada estudio (13446540 para el 3490, 14250083 para el 3577); se lee de distribution[].contentUrl del JSON-LD, no se deduce"
    example: curl -sSL -o MD3577.zip "https://www.cis.es/documents/20117/14250083/MD3577.zip"
    returns: "zip de 2 MB con 8 ficheros (3577.sav, 3577_num.csv, 3577_etiq.csv de 8 MB, DA3577, ES3577, codigo, cues y FT en PDF); CSV con CRLF, 4042 filas y 176 columnas con cabeceras «CCAA: Comunidad autónoma» y decimales con coma (PESO 2,87887)"
  - path: https://www.cis.es/documents/d/guest/md{n}
    desc: URL amigable del mismo zip sin conocer la carpeta (verificada para 2000, 3000, 3490 y 3500; 3577, 3571 y 1000 responden 410)
    example: curl -sSL -o MD3500.zip "https://www.cis.es/documents/d/guest/md3500"
  - path: https://www.cis.es/documents/20117/{carpeta}/{n}-multi.xlsx
    desc: Tabulaciones en 14 hojas (marginales y cruces por sexo, edad, estudios, municipio, recuerdo de voto, ocupación, clase, ideología, religión); más _fila y _abs
    example: curl -sSL -o 3577-multi.xlsx "https://www.cis.es/documents/20117/14250083/3577-multi.xlsx"
  - path: https://www.cis.es/documents/20117/{carpeta}/{n}_Estimacion.pdf
    desc: Estimación de voto del barómetro (solo PDF); en la misma carpeta es{n}mar.pdf (marginales), FT{n}.pdf (ficha técnica) y cues{n}.pdf (cuestionario)
    example: curl -sSL -o 3577_Estimacion.pdf "https://www.cis.es/documents/20117/14250083/3577_Estimacion.pdf"
  - path: https://www.cis.es/sitemap.xml
    desc: Índice de 6643 sitemaps hijos (sitemap.xml?p_l_id=...) sin orden por tipo; cada hijo de estudio lista su URL /es/estudios/{slug} en seis idiomas
    example: curl -s "https://www.cis.es/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/&amp;/\&/g' | head -3
    returns: "sitemapindex de 1,1 MB con 6643 loc; cada hijo es un urlset de una página (estudio, serie o estática) con seis idiomas (es, en, ca, eu, gl, fr), salvo uno de 13,5 MB con 10.506 URL /w/ de noticias y avances"
  - path: https://www.cis.es/es/avance-de-resultados
    desc: Últimos barómetros con enlaces a /es/estudios/{slug} y a las notas /es/w/avance-de-resultados-del-estudio-{n}-...; vía más corta al último estudio
  - path: https://www.cis.es/es/series/{slug}
    desc: Página de una serie (intencion-de-voto-en-unas-supuestas-elecciones-generales-noviembre-2023-recodificada-cati-); JSON-LD sin datos, tabla por JavaScript
  - path: https://www.cis.es/o/headless-admin-taxonomy/v1.0/taxonomy-vocabularies/{id}/taxonomy-categories
    desc: Categorías de los vocabularios del catálogo (4674191 tipo de estudio, 4675153 índice temático, 4674204 colecciones); único endpoint headless abierto
    example: 'curl -s -H "Accept: application/json" "https://www.cis.es/o/headless-admin-taxonomy/v1.0/taxonomy-vocabularies/4674191/taxonomy-categories?pageSize=50"'
    returns: "JSON con items, page, pageSize, totalCount y lastPage; 3 categorías en 4674191 (Cualitativo, Cuantitativo, Mixto), 17 en 4675153 con numberOfTaxonomyCategories para las hijas y 39 en 4674204; responde igual sin Accept"
quirks: [js-rendered, waf-blocks-bots, static-html]
ids: [ine-provincia, ine-municipio]
gotchas:
  - El catálogo solo sirve en HTML la primera página (?catalogo=estudio, Mostrando 50 de 2582 elementos); con start=, q= o /es/buscar redirige a /__cis_antibot o da 429. No localicé API de búsqueda.
  - detalle-ficha-estudio?idEstudio={id} redirige (301) al catálogo y las rutas cis/opencms van a /en/cis/opencms/..., que da 404; el idEstudio interno de cinco cifras no es el número de estudio.
  - Si el cliente envía Accept-Encoding, el zip llega recomprimido en gzip y sin Content-Length (curl sin --compressed guarda entonces un gzip); Range se ignora y devuelve 200 con el fichero entero.
  - DA{n} es texto de ancho fijo sin cabecera; las posiciones están en ES{n} (sintaxis SPSS en cp1252 que termina en WEIGHT BY PESO). _etiq.csv pesa cinco veces más que _num.csv por las etiquetas.
  - CCAA coincide con el código INE salvo 7 y 8, intercambiados (7 Castilla-La Mancha, 8 Castilla y León); PROV es el código INE y MUN solo se da en capitales y municipios de más de 100.000 habitantes (0 en 2135 de 4042).
  - Cada estudio tiene su carpeta documents/20117/{carpeta}; con otra carpeta o con /0/ responde 302 a /en/documents/... y luego 404 HTML. La URL amigable md{n} no existe para todos (410 en 3577, 3571 y 1000).
  - Los ids del JSON-LD llevan sufijo #dataset, #report y #catalog; isPartOf enumera las series del estudio (31 en un barómetro) con URL /es/series/{slug}, cuyos datos solo cargan por JavaScript.
  - datePublished del JSON-LD no es la fecha del avance (los barómetros de mayo y junio de 2026 marcan 2026-06-26 y el de julio 2026-09-07); ordenar por número de estudio.
  - El sitemap mezcla estudios, series y páginas en 6643 hijos de una sola página cada uno, sin orden estable; enumerar estudios por él exige miles de peticiones.
  - analisis.cis.es (banco de datos antiguo) no fue alcanzable desde el entorno de prueba (CONNECT 502 el 01/10/2026); no verificado.
tips:
  - "pandas.read_csv('3577_num.csv', sep=';', encoding='utf-8-sig', decimal=',') y quedarse con lo anterior a ': ' en cada cabecera; el .sav (pyreadstat) trae etiquetas de variables y valores; ponderar siempre por PESO."
  - Para la serie de estimación de voto descargar {n}_Estimacion.pdf de cada barómetro; en 2026 el número de estudio avanza 4 o 6 por mes (3557 abril, 3562 mayo, 3567 junio, 3571 julio, 3577 septiembre).
  - La página del estudio, el zip y el sitemap responden al User-Agent por defecto de curl; solo el catálogo y el buscador tienen protección anti-bot.
related: [ine-microdatos, ine-api-tempus, ine-codigos-territoriales]
status: active
verified: "2026-10-01"
