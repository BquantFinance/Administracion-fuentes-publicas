id: ine-api-tempus
name: INE – API JSON (Tempus3)
org: Instituto Nacional de Estadística (INE)
ministry: Economía, Comercio y Empresa
level: age
sector: estadistica
tags: [ine, api, series-temporales, ipc, epa, pib, padron, demografia, empresas]
summary: >-
  Acceso programático a las 112 operaciones estadísticas del INE: metadatos (operaciones, tablas, variables,
  valores) y datos de tablas y series (IPC, EPA, PIB, padrón, natalidad, empresas). JSON y CSV, sin autenticación.
access: [api-rest]
auth: none
formats: [json, csv]
update: daily
coverage: "Según operación; el IPC general enlaza desde 1961 en la tabla 24077"
license: Reutilización libre con cita de la fuente (licencia INE compatible CC BY 4.0)
base_url: https://servicios.ine.es/wstempus/js/ES
docs_url: https://www.ine.es/dyngs/DAB/index.htm?cid=1099
endpoints:
  - path: /OPERACIONES_DISPONIBLES
    desc: Las 112 operaciones con Id numérico y Codigo (IPC es 25, EPA 293, ECP 450)
    example: curl -s "https://servicios.ine.es/wstempus/js/ES/OPERACIONES_DISPONIBLES"
  - path: /TABLAS_OPERACION/{id_o_codigo}
    desc: Tablas vigentes de una operación con periodo inicial y última modificación; acepta IPC o 25
    example: curl -s "https://servicios.ine.es/wstempus/js/ES/TABLAS_OPERACION/IPC"
  - path: /DATOS_TABLA/{id_tabla}?nult={n}
    desc: Todas las series de una tabla con sus últimos n periodos
    example: curl -s "https://servicios.ine.es/wstempus/js/ES/DATOS_TABLA/24077?nult=3"
    params: "nult o date=AAAAMMDD:AAAAMMDD (uno obligatorio); tv=id_variable:id_valor filtra, repetible; tip=A nombres legibles y fechas ISO, tip=M metadatos, tip=AM ambos; det=2 desglosa unidad y escala"
  - path: /DATOS_SERIE/{cod_serie}?nult={n}
    desc: Una serie por su código
    example: curl -s "https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/IPC290751?nult=12&tip=A"
  - path: /SERIES_TABLA/{id_tabla}
    desc: Series que componen una tabla con código, decimales, periodicidad y unidad
    example: curl -sL "https://servicios.ine.es/wstempus/js/ES/SERIES_TABLA/24077"
  - path: /SERIE/{cod_serie}
    desc: Metadatos de una serie
  - path: /VARIABLES_OPERACION/{id_operacion}
    desc: Variables de una operación; sus valores en /VALORES_VARIABLEOPERACION/{id_variable}/{id_operacion}
    example: curl -s "https://servicios.ine.es/wstempus/js/ES/VALORES_VARIABLEOPERACION/3/IPC"
  - path: https://servicios.ine.es/wstempus/csv/ES/DATOS_TABLA/{id_tabla}?nult={n}
    desc: Misma API con salida CSV cambiando js por csv
    example: curl -s "https://servicios.ine.es/wstempus/csv/ES/DATOS_TABLA/24077?nult=12"
rate_limit: No documentado; una tabla grande con nult=1 devuelve 600 KB (4248 series en la 25333)
quirks: [errors-html-or-xml]
gotchas:
  - Los códigos de serie y los ids de tabla cambian con cada cambio de base. El IPC general fue IPC206446 (hasta 2021), IPC251852 (hasta 2025M12) y es IPC290751 (base 2025).
  - Una tabla retirada (50902) sigue respondiendo con datos viejos aunque ya no aparezca en TABLAS_OPERACION; validar siempre la tabla contra ese listado.
  - DATOS_SERIE y DATOS_TABLA sin nult ni date devuelven 404 con HTML, no la serie completa. Para toda la serie usar date con un rango amplio.
  - Un código de serie inexistente devuelve 200 con cuerpo vacío; un tv con un par variable:valor que no existe en la tabla devuelve 500 con HTML.
  - nult cuenta periodos de la tabla, no observaciones. En tablas con avance (IPC) las series sin dato en el último periodo llegan con Data vacío.
  - Fecha es epoch en milisegundos con zona Europe/Madrid; usar Anyo y FK_Periodo para el periodo. FK_TipoDato 3 marca dato provisional o avance; Secreto true marca secreto estadístico con Valor ausente.
  - El CSV llega con BOM UTF-8, separador tabulador y coma decimal aunque la cabecera diga ISO-8859-15.
  - SERIES_TABLA redirige con 301 a /jsCache/; seguir redirecciones. El parámetro page no pagina (devuelve lo mismo).
  - Cambiar ES por EN en la ruta traduce los nombres; jsCache sirve copias cacheadas, para datos recién publicados usar js.
tips:
  - Flujo típico. TABLAS_OPERACION para localizar la tabla vigente, DATOS_TABLA con nult=1 y tip=A para ver códigos y nombres, DATOS_SERIE con date para el histórico.
  - Los ids de tabla del portal INEbase (parámetro t=NNNNN en la URL) son los mismos que acepta DATOS_TABLA.
  - En Python, pandas.json_normalize sobre Data de cada serie; con tip=A la fecha ya viene en ISO 8601.
related: [ine-codigos-territoriales, ine-microdatos]
status: active
verified: "2026-09-30"
