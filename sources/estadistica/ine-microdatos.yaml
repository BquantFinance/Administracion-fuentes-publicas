gotchas:
  - Los ficheros son de ancho fijo o CSV con separador tabulador; el diseño de registro va en Excel aparte y cambia entre años.
  - Los ZIP incluyen programas de lectura para SAS, SPSS, R y Stata, pero no siempre para Python.
  - Los factores de elevación son obligatorios para cualquier estimación; no contar registros.
