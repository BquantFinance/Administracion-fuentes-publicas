  Ficheros de microdatos anonimizados de encuestas (EPA, Encuesta de Condiciones de Vida, Presupuestos Familiares,
  Estructura Salarial, Censo, Movimiento Natural de la Población) con diseño de registro y programas de lectura.
access: [download]
auth: none
formats: [csv, txt, zip, sql]
