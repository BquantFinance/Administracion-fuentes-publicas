id: aemet-opendata
name: AEMET OpenData – API meteorológica y climatológica
org: Agencia Estatal de Meteorología (AEMET)
ministry: Para la Transición Ecológica y el Reto Demográfico
level: age
sector: meteorologia-clima
tags: [aemet, meteorologia, prediccion, observacion, climatologia, estaciones, avisos, radar, rayos]
summary: >-
  API REST con clave gratuita (JWT): predicciones por municipio, provincia y comunidad, observación de estaciones,
  climatología diaria, mensual, normales y extremos, avisos CAP, radar, rayos, radiación, ozono, satélite y
  maestro de municipios. 64 rutas en la especificación OpenAPI 3.0.1.
access: [api-rest]
auth: api-key
formats: [json, xml, csv, png]
update: hourly
coverage: "Climatología diaria desde 1920 según estación"
license: Reutilización libre con cita de la fuente (aviso legal AEMET)
base_url: https://opendata.aemet.es/opendata/api
docs_url: https://opendata.aemet.es/dist/index.html
endpoints:
  - path: /prediccion/especifica/municipio/diaria/{cod_municipio_ine}
    desc: Predicción diaria a 7 días para un municipio; /todos devuelve todos los municipios
    example: 'curl -s -H "api_key: $AEMET_KEY" "https://opendata.aemet.es/opendata/api/prediccion/especifica/municipio/diaria/28079"'
    returns: "datos es lista de un objeto {nombre, provincia, elaborado, id, prediccion:{dia:[{fecha, probPrecipitacion[{value, periodo}], estadoCielo[{value, periodo, descripcion}], viento[{direccion, velocidad, periodo}], temperatura{maxima, minima, dato[{value, hora}]}, sensTermica, humedadRelativa, uvMax}]}}"
  - path: /prediccion/especifica/municipio/horaria/{cod_municipio_ine}
    desc: Predicción horaria a 48 horas; /todos para todos los municipios
  - path: /maestro/municipios
    desc: Maestro de municipios con el código que aceptan las predicciones; /maestro/municipio/{id} para uno
    returns: "Lista de municipios [{id (id28079, INE con prefijo id), id_old, nombre, capital, latitud_dec, longitud_dec, altitud, num_hab, zona_comarcal, url}]; todo como texto"
  - path: /observacion/convencional/todas
    desc: Últimas 24 horas de observación de todas las estaciones
    returns: "Lista de observaciones horarias de todas las estaciones (3,5 MB) [{idema, ubi, lon, lat, alt, fint (ISO UTC), ta, tamin, tamax, tpr, hr, prec, pres, pres_nmar, vv, dv, vmax, dmax, stdvv, stddv}]; números con punto"
  - path: /observacion/convencional/datos/estacion/{idema}
    desc: Observación de una estación
  - path: /valores/climatologicos/inventarioestaciones/todasestaciones
    desc: Inventario de estaciones con idema y coordenadas
    returns: "Lista de 926 estaciones [{indicativo (idema), nombre, provincia, altitud, latitud, longitud, indsinop}]; coordenadas en grados, minutos y segundos con letra (394924N, 025309E), no decimales"
  - path: /valores/climatologicos/diarios/datos/fechaini/{AAAA-MM-DDTHH:MM:SSUTC}/fechafin/{AAAA-MM-DDTHH:MM:SSUTC}/estacion/{idema}
    desc: Climatología diaria de una o varias estaciones (idema separados por coma) en un rango; /todasestaciones para todas
    example: 'curl -s -H "api_key: $AEMET_KEY" "https://opendata.aemet.es/opendata/api/valores/climatologicos/diarios/datos/fechaini/2024-01-01T00:00:00UTC/fechafin/2024-01-31T23:59:59UTC/estacion/3195"'
    returns: "Lista [{fecha, indicativo, nombre, provincia, altitud, tmed, prec, tmin, horatmin, tmax, horatmax, dir, velmedia, racha, horaracha, presMax, presMin, hrMedia, hrMax, hrMin}]; todos los valores son texto con coma decimal"
  - path: /valores/climatologicos/mensualesanuales/datos/anioini/{AAAA}/aniofin/{AAAA}/estacion/{idema}
    desc: Climatología mensual y anual; normales en /valores/climatologicos/normales/estacion/{idema} y extremos en /valoresextremos/parametro/{p}/estacion/{idema}
  - path: /avisos_cap/ultimoelaborado/area/{area}
    desc: Avisos meteorológicos en formato CAP; archivo por fechas en /avisos_cap/archivo/fechaini/{f}/fechafin/{f}
  - path: /red/radar/nacional
    desc: Radar nacional; regional en /red/radar/regional/{radar}, rayos en /red/rayos/mapa, radiación y ozono bajo /red/especial/
  - path: https://opendata.aemet.es/AEMET_OpenData_specification.json
    desc: Especificación OpenAPI 3.0.1 completa con las 64 rutas y sus parámetros
    example: curl -s "https://opendata.aemet.es/AEMET_OpenData_specification.json"
rate_limit: No documentado en la especificación; la clave es un JWT gratuito
quirks: [latin1, soft-errors-200]
ids: [ine-municipio, idema]
gotchas:
  - Sin clave la API responde 200 con cuerpo vacío, no 401; con clave inválida, 401 y JSON con descripcion (JWT strings must contain exactly 2 period characters). Tratar el cuerpo vacío como fallo de autenticación.
  - La clave va en la cabecera api_key o en el parámetro api_key (ambos verificados); se solicita en opendata.aemet.es/centrodedescargas/altaUsuario (correo y captcha), llega por correo y caduca a los tres meses.
  - Toda llamada responde con un JSON intermedio (estado, datos, metadatos); los datos reales se descargan con una segunda petición a la URL del campo datos (opendata/sh/{hash}), que no conviene fijar.
  - Los errores de datos llegan con HTTP 200 y estado en el cuerpo (404 Error al obtener los datos para un municipio inexistente, 404 No hay datos que satisfagan esos criterios con dígito de control o estación inexistente).
  - Límite de uso; tras unas diez peticiones en un minuto responde 429 (Se ha alcanzado uno de los límites de uso. Vuelva a intentarlo el próximo minuto) durante el resto del minuto. Espaciar y cachear.
  - Rangos máximos por petición; 6 meses en climatologías diarias y 36 meses en mensuales y anuales (estado 400 en el JSON intermedio). Iterar por ventanas.
  - Los ficheros de datos llegan como text/plain;charset=ISO-8859-15 con JSON dentro; decodificar como ISO-8859-15 o las tildes salen mal. Climatología con valores en texto y coma decimal (tmed 6,6).
  - El código de municipio de las predicciones es el INE de 5 dígitos sin dígito de control (Madrid 28079); el maestro de municipios (3 MB, id con prefijo id, latitud en grados y minutos) lo confirma.
  - Las fechas de climatología van como AAAA-MM-DDTHH:MM:SSUTC, con el sufijo UTC literal; el inventario de estaciones da latitud y longitud compactas (394924N, 025309E), no decimales.
  - Tamaños; predicción diaria de todos los municipios 2,3 MB, observación de todas las estaciones 3,2 MB; los avisos CAP se sirven como tar (application/x-gtar) con un XML por aviso.
tips:
  - Envolver las dos peticiones en una función que decodifique ISO-8859-15, compruebe estado en el JSON intermedio y espere un minuto ante 429.
  - Cachear el inventario de estaciones y el maestro de municipios; cambian raramente.
  - Para series largas de climatología diaria, ventanas de 6 meses por estación; el inventario da la lista de idema.
related: [ine-codigos-territoriales, miteco-saih-boletin-hidrologico]
status: active
verified: "2026-10-01"
