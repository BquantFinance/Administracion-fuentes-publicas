id: hacienda-registro-licitadores
name: ROLECSP – Registro Oficial de Licitadores y Empresas Clasificadas del Sector Público
org: Dirección General del Patrimonio del Estado
ministry: Hacienda
level: age
sector: contratacion-subvenciones
tags: [rolece, rolecsp, licitadores, clasificacion-empresas, contratistas, deuc, prohibiciones-contratar]
summary: >-
  Registro de empresas inscritas para contratar con el sector público y su clasificación. La consulta por empresa
  exige certificado; sin él solo hay el XML de prohibiciones de contratar vigentes, los esquemas XSD del
  certificado, el visor de certificados ROLECE y DEUC y el generador del DEUC.
code:
  module: fuentes_publicas.clientes.consulta
  use:
    - "consulta.empresa_nif('B87601571')['prohibiciones_contratar']: prohibiciones vigentes de la empresa, casadas por denominación normalizada (el XML no trae el NIF)"
  mcp: [empresa_nif]
access: [portal, download]
auth: certificate
formats: [html, xml, pdf, zip]
update: daily
license: Consulta restringida; incluye datos personales de administradores y apoderados
base_url: https://registrodelicitadores.gob.es/rolece/public/inicio.action
docs_url: https://registrodelicitadores.gob.es/rolece/static/manuales/EsquemasXSD.zip
endpoints:
  - path: https://visor.registrodelicitadores.gob.es/svcr/controller/prohibiciones
    desc: Prohibiciones de contratar vigentes (230 el 2026-10-01) en un XML sin certificado ni parámetros; es la descarga que usa el visor
    example: curl -s --cacert ca-age.pem -o prohibiciones.xml "https://visor.registrodelicitadores.gob.es/svcr/controller/prohibiciones"
    returns: "XML ISO-8859-1 de 175 KB: prohibiciones/prohibicion con tipoIdentificador (NIF, NIE o VIES), identificador, denominacionSocial, fechaAcuerdo, causaProhibicion, ambitoProhibicion, autoridad, fechaInicioProhibicion y fechaFinProhibicion (AAAA-MM-DD); orden por inicio descendente, sin paginación"
  - path: https://visor.registrodelicitadores.gob.es/
    desc: Visor que transforma a HTML o PDF un XML de certificado ROLECE o de DEUC subido por el usuario
  - path: https://visor.registrodelicitadores.gob.es/espd-web/filter?lang=es
    desc: Generador del Documento Europeo Único de Contratación (DEUC 1.02)
quirks: [tls-chain-incomplete, latin1, overwritten-in-place, url-drift]
gotchas:
  - La antigua consulta pública (/rolece/public/consulta_publica) da 404; la raíz redirige por meta refresh a /rolece y de ahí, con otro meta refresh, a public/inicio.action.
  - El servidor solo envía el certificado final, emitido por la intermedia FNMT AC Servidores Seguros Tipo2; añadirla al bundle o falla la verificación TLS (ver guía).
  - La búsqueda por NIF exige certificado y no localicé API; la inscripción de un licitador se acredita con el certificado XML que él mismo aporta, validable con los XSD de docs_url (ROLECE-RegistrationCertificate-2.4.xsd).
  - El XML de prohibiciones oculta el identificador en todas las filas («VER https://registrodelicitadores.gob.es»); cruzar con otras fuentes por denominacionSocial normalizada.
  - El XML de prohibiciones solo trae las vigentes (todas abarcan el día de la consulta) y fechaAcuerdo es posterior al inicio en 33 de 230; para un histórico, guardar copia diaria.
  - La URL de prohibiciones sale de descargarProhibiciones() en svcr/resources/js/myuploadfunction.js; el botón está comentado en el HTML del visor y podría retirarse sin aviso.
tips:
  - xsl.zip, en la misma carpeta static/manuales, trae las plantillas del visor y las listas de códigos del certificado (xml/*.xml en ISO-8859-1), útiles para leer un certificado sin el visor.
related: [placsp-datos-abiertos]
status: degraded
verified: "2026-10-01"
