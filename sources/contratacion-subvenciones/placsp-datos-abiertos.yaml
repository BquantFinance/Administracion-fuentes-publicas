id: placsp-datos-abiertos
name: Plataforma de Contratación del Sector Público – Sindicación ATOM (CODICE)
org: Dirección General del Patrimonio del Estado
ministry: Hacienda
level: age
sector: contratacion-subvenciones
tags: [contratacion-publica, licitaciones, adjudicaciones, contratos-menores, codice, atom, placsp, cpv]
summary: >-
  Todas las licitaciones, adjudicaciones y contratos menores publicados en la Plataforma (Estado y perfiles
  alojados) y los agregados de plataformas autonómicas, como feeds ATOM diarios con el documento CODICE (XML
  basado en UBL) de cada expediente, y ZIP anuales y mensuales del histórico.
alerts:
  - "En acuerdos marco el importe del lote se repite en cada WinningParty; en el 1044 de agosto de 2026, 521 de 574 lotes con varios adjudicatarios, y sumar por fila dio 33.302 M€ frente a 9.709 M€ contando cada lote una vez."
  - "La adjudicación va en un cac:TenderResult por lote con uno o varios WinningParty; el 2026-10-05, 38 de 198 entradas adjudicadas tenían varios lotes (SAS_CGIPC-2026-50002, 20 filas). Recorrerlos todos."
  - "Con la IP rechazada por el WAF, atom y ZIP dan 200 con un HTML de 187 bytes que un parser XML lee como feed vacío; el 2026-10-01 desde GitHub placsp.py salió con código 0 y «0 expedientes». Comprobar que la raíz es feed."
access: [feed, download]
auth: none
formats: [atom, xml, zip, xlsx]
update: daily
coverage: "2012- (agregadas desde 2016, menores desde 2018)"
sync:
  since: "2012 en el 643; agregadas (1044) desde 2016 y menores (1143) desde 2018"
  full: "ZIP anuales de los tres feeds y mensuales del año en curso, empezando cada ZIP por el .atom que se llama como el feed; deduplicar por id de entry con updated máximo."
  size: "El 643 pesa 2,2 GB al año en ZIP (150 a 300 MB al mes) y descomprimido de 10 a 18 veces más; el 1044 y el 1143, de 12 a 37 MB al mes. Sin Content-Length; el tamaño asoma en el ETag, en hexadecimal."
  new: "Seguir rel=next desde la página vigente hasta la primera instantánea ya descargada (los nombres se conservan); el 643 se regenera hacia las 20:15 y el 1044 y el 1143 hacia las 03:00."
license: Reutilización libre con cita de la fuente
base_url: https://contrataciondelestado.es/sindicacion/
docs_url: https://www.hacienda.gob.es/es-ES/GobiernoAbierto/Datos%20Abiertos/Paginas/licitaciones_plataforma_contratacion.aspx
endpoints:
  - path: sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
    desc: Licitaciones de perfiles alojados, sin menores; la vigente solo trae lo último (127 entradas, 3,8 MB el 2026-10-01) y cada instantánea anterior 500 y 14 a 17 MB
    example: curl -s "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom"
    returns: "Hasta 500 entry, at:deleted-entry delante; cada entry: id, updated con milisegundos y +02:00, ContractFolderStatus con ContractFolderID, ContractFolderStatusCode (PRE, PUB, EV, ADJ, RES, ANUL), ID del órgano por schemeName (DIR3, NIF, ID_PLATAFORMA), importes con punto, uno o varios CPV y CountrySubentityCode NUTS"
  - path: sindicacion_1044/PlataformasAgregadasSinMenores.atom
    desc: Licitaciones agregadas desde plataformas autonómicas y locales, sin contratos menores
  - path: sindicacion_1143/contratosMenoresPerfilesContratantes.atom
    desc: Contratos menores de perfiles alojados (ProcedureCode 6); el CPV faltaba en 145 de las 235 entradas de la página del 2026-10-01
  - path: sindicacion_{n}/{nombre_feed}_{AAAA}.zip y sindicacion_{n}/{nombre_feed}_{AAAA}{MM}.zip
    desc: Histórico en ZIP anual y, solo en 2025 y 2026, mensual; el 643 pesa 150 a 300 MB al mes y 2,2 GB al año, el 1044 y el 1143 de 12 a 37 MB al mes
    example: curl -sO "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202508.zip"
    returns: "ZIP con varios .atom del mismo formato encadenados por rel=next relativo; se empieza por el que se llama como el feed (licitacionesPerfilesContratanteCompleto3.atom); descomprimido ocupa de 10 a 18 veces más"
quirks: [soft-errors-200, waf-temporary-ban]
ids: [dir3, nif, cpv, nuts]
gotchas:
  - La página vigente solo trae lo último; rel=next lleva a instantáneas de 500 entradas con la hora de la regeneración y un sufijo (_20260930_201747.atom, _20260930_201747_1.atom...); un día laborable ocupa unas 7 páginas.
  - Las bajas llegan como at:deleted-entry (ref = id de la entry, when, at:comment type ANULADA en el 643 y CERRADA en el 1044) delante y fuera de los entry; un parser que solo lee entry no las ve.
  - Una entrada por cambio de estado; deduplicar por el id de la entry (prefijo distinto por feed) con updated mayor, no por ContractFolderID (se repite entre órganos), y aplicar luego los deleted-entry.
  - TotalAmount lleva IVA y TaxExclusiveAmount no; EstimatedOverallContractAmount es el valor estimado con prórrogas previstas, no lo adjudicado; prórrogas y modificados reales en cac:ContractModification.
  - Espacios de nombres propios; cbc y cac en urn:dgpe:names:draft:codice:schema:xsd, extensiones cbc-place-ext y cac-place-ext en urn:dgpe:names:draft:codice-place-ext y at en http://purl.org/atompub/tombstones/1.0.
  - "El DIR3 del órgano falta en el 29 % del 643 (116 de 452 el 2026-10-05), así que se elige el cbc:ID por schemeName; el NIF del adjudicatario llega con schemeName OTROS, guion, minúscula o enmascarado (***1234**)."
  - En el 1044 el órgano solo trae ID_OC_PLAT (contiene su NIF), no hay TotalAmount ni AwardDate (0 de 17.222 adjudicaciones de agosto de 2026; usar cac:Contract/cbc:IssueDate) y el summary usa coma decimal.
  - Ni ZIP ni atom responden a HEAD, Range se ignora y no hay Content-Length (el tamaño asoma en el ETag, en hexadecimal); un fichero inexistente da 200 con un HTML de 521 bytes, así que comprobar que empieza por PK.
  - "updated es la fecha del último cambio del expediente, no la de publicación; la fecha de cada anuncio va en ValidNoticeInfo/AdditionalPublicationStatus/AdditionalPublicationDocumentReference/IssueDate."
  - Lo de hoy solo está en el buscador JSF del portal (sin API localizada; el link de cada entry es un deeplink HTML).
tips:
  - Identificadores útiles en cada entry. cbc:ContractFolderID (expediente), cbc:ItemClassificationCode (CPV), cbc:ID del órgano con schemeName DIR3 (p. ej. L01120022), NIF o ID_PLATAFORMA y cbc:TypeCode (tipo de contrato).
  - OpenPLACSP, la herramienta oficial, pasa los feeds a hoja de cálculo.
  - contrataciondelsectorpublico.gob.es/datosabiertos/ lista OrganosContratacion en json (23.487 órganos el 2026-10-05 con idPlataforma, nif y dir3), csv (UTF-8, BOM y ;) y xlsx, más manifest.sha256.
  - contrataciondelsectorpublico.gob.es, el dominio que enlaza Hacienda, sirve los mismos feeds y ZIP que contrataciondelestado.es; los id y link del feed siguen usando el antiguo.
related: [bdns-api, hacienda-registro-licitadores, dir3-directorio]
status: active
verified: "2026-10-05"
