id: dir3-directorio
name: DIR3 – Directorio Común de Unidades Orgánicas y Oficinas
org: Secretaría General de Administración Digital
ministry: Transformación Digital y de la Función Pública
level: age
sector: gobierno-abierto-administracion
tags: [dir3, organismos, unidades-organicas, oficinas-registro, codigos, estructura-administrativa]
summary: >-
  Inventario oficial de unidades orgánicas, entidades y oficinas de todas las Administraciones con código DIR3,
  jerarquía, NIF, provincia y estado. Descarga pública en xlsx por nivel más catálogos auxiliares; es la clave
  de FACe, PLACSP, BDNS y datos.gob.es.
access: [download, portal]
auth: none
formats: [xlsx, pdf]
update: daily
coverage: "Unidades vigentes (estado V) y transitorias (T); las oficinas y catálogos, vigentes"
license: Reutilización libre con cita de la fuente
base_url: https://administracionelectronica.gob.es/ctt/verPestanaDescargas.htm?idIniciativa=dir3
docs_url: https://administracionelectronica.gob.es/ctt/verPestanaGeneral.htm?idIniciativa=dir3
endpoints:
  - path: https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Listado%20Unidades%20{nivel}.xlsx?idIniciativa=238&idElemento={n}
    desc: Unidades orgánicas por nivel; idElemento AGE 2741, CCAA 2742, EELL 2744, Universidades 2808, Institucionales 2810
    params: "Justicia en Listado-unidades-organicas-Justicia.xlsx con idElemento 7326"
    example: 'UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"; curl -s -A "$UA" -H "Accept: text/html" -c cj -b cj -o /dev/null "https://administracionelectronica.gob.es/ctt/verPestanaDescargas.htm?idIniciativa=dir3"; curl -sL -A "$UA" -c cj -b cj -o unidades_age.xlsx "https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Listado%20Unidades%20AGE.xlsx?idIniciativa=238&idElemento=2741"'
  - path: https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Listado%20Oficinas%20{nivel}.xlsx?idIniciativa=238&idElemento={n}
    desc: Oficinas de registro y atención por nivel; idElemento AGE 2745, EELL 2807, Universidades 2809, Institucionales 2811
    params: "Oficinas SIR en Listado de oficinas SIR.xlsx con idElemento 2740"
  - path: https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Catalogo%20de%20{catalogo}.xlsx?idIniciativa=238&idElemento={n}
    desc: Catálogos auxiliares; idElemento Localidades 428, Provincias 427, Países 425, Tipos de Entidad Publica 423, Tipos de Unidad Organica 424, Tipos de Via 429
  - path: https://proveedores.face.gob.es/api/v1/relations.csv
    desc: Alternativa sin WAF, las 50000 relaciones oficina contable, órgano gestor y unidad tramitadora con sus DIR3 (ver face-facturas)
quirks: [session-required, user-agent-browser, static-html]
ids: [dir3, nif, ine-provincia]
gotchas:
  - El portal CTT (F5) responde Request Rejected con código 200 a User-Agent genéricos.
  - La primera petición devuelve 302 a la misma URL fijando cookies TS; con User-Agent de navegador completo y cookie jar, la segunda petición pasa.
  - La descarga de cada xlsx exige las mismas cookies; sin ellas devuelve Request Rejected. curl -L sin cookie jar entra en bucle de redirecciones.
  - Las rutas antiguas /ctt/dir3 y /ctt/dir3/descargas redirigen a verPestanaGeneral.htm y verPestanaDescargas.htm con idIniciativa=dir3.
  - Hoja de unidades con fila de título y cabecera en la fila 2 (leer con header=1).
  - Columnas clave. C_ID_UD_ORGANICA (código DIR3), C_ID_DEP_UD_SUPERIOR y C_ID_DEP_UD_PRINCIPAL (jerarquía), C_ID_NIVEL_ADMON, C_ID_TIPO_ENT_PUBLICA, C_ID_ESTADO, NIF_CIF y C_ID_AMB_PROVINCIA.
  - Los códigos DIR3 tienen 9 caracteres, una o dos letras y dígitos (E05251701, EA0008567, LA0002807, U01700001); no convertir a número ni recortar.
  - La base completa consolidada y los servicios web SOAP están en el área privada de la red SARA para usuarios registrados; el área pública solo tiene los xlsx por nivel.
tips:
  - Las relaciones de FACe (face-facturas) dan en un solo CSV el DIR3 de oficina contable, órgano gestor y unidad tramitadora de quien recibe facturas, sin pasar por el WAF del CTT.
related: [datos-gob-es-api, bdns-api, placsp-datos-abiertos, face-facturas]
status: active
verified: "2026-09-30"
