gotchas:
  - Los datasets se publican por ministerio y trimestre en ficheros separados; agregarlos requiere normalizar nombres de organismos (usar DIR3).
  - Las agendas de altos cargos son HTML por persona; no hay descarga masiva.
  - El derecho de acceso se ejerce vía Cl@ve; las resoluciones se publican sin datos del solicitante.
