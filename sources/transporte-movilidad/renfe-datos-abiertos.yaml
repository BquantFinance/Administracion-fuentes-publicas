id: renfe-datos-abiertos
name: Renfe – Datos abiertos (GTFS, GTFS-RT, estaciones, viajeros)
org: Renfe Viajeros (Grupo Renfe)
ministry: Empresa pública adscrita a Transportes y Movilidad Sostenible
level: age
sector: transporte-movilidad
tags: [ferrocarril, gtfs, gtfs-rt, horarios, cercanias, alta-velocidad, estaciones, viajeros, renfe, ckan]
summary: >-
  CKAN con 44 datasets: horarios GTFS de Cercanías y de alta velocidad, larga y media distancia, feeds GTFS-RT
  (alertas, viajes y posiciones de trenes) en protobuf y JSON, 1.035 estaciones con coordenadas y viajeros por
  franja horaria y núcleo (año 2018). CC BY 4.0, sin clave.
code:
  module: fuentes_publicas.clientes.ckan
  use:
    - "ckan.buscar('renfe', 'cercanias', fl=['name', 'title']): los 38 conjuntos; fl va como parámetro repetido (separado por comas da «No es una lista»)"
  mcp: [ckan_buscar, ckan_filas]
access: [api-rest, download, feed]
auth: none
formats: [zip, csv, xlsx, json, protobuf]
update: realtime
coverage: "GTFS vigentes (AV y LD generado el 30-9-2026, Cercanías el 24-9-2026); viajeros por franja de 2018 y demás datasets estáticos sin cambios desde 2020-2021"
license: CC BY 4.0 (license_title de los datasets)
base_url: https://data.renfe.com/api/3/action
docs_url: https://data.renfe.com/
endpoints:
  - path: /package_search?rows=100
    desc: Los 44 datasets con resources[].url, format y last_modified; package_list solo nombres; package_show?id={name} un dataset
    example: curl -s "https://data.renfe.com/api/3/action/package_show?id=horarios-cercanias"
    returns: "CKAN {success, result:{id, name, title, notes, metadata_modified, license_title, resources:[{id, name, url, format, size, last_modified, mimetype}], archiver}}; fechas ISO sin zona; size puede estar desfasado (9,8 MB declarados frente a 14 MB reales en Cercanías)"
  - path: https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip
    desc: GTFS de alta velocidad, larga y media distancia (754 KB, 36 MB descomprimido; agency, calendar, calendar_dates, routes, stops, stop_times, trips; sin feed_info)
    example: curl -sO "https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip"
  - path: https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip
    desc: GTFS de Cercanías (14 MB; 263 MB descomprimido, con stop_times de 241 MB, shapes y transfers)
    example: curl -sO "https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip"
  - path: https://ssl.renfe.com/ftransit/Fichero_estaciones/estaciones.csv
    desc: 1.035 estaciones con CODIGO, DESCRIPCION, LATITUD, LONGITUD, DIRECION, CP, POBLACION, PROVINCIA, PAIS, CERCANIAS, ANCHO MÉTRICO y COMUN; también estaciones.xlsx
    example: curl -sO "https://ssl.renfe.com/ftransit/Fichero_estaciones/estaciones.csv"
  - path: https://gtfsrt.renfe.com/{alerts|trip_updates|vehicle_positions}.{pb|json}
    desc: GTFS-RT de Cercanías; con sufijo _LD (trip_updates_LD, vehicle_positions_LD) para alta velocidad y larga distancia
    example: curl -s "https://gtfsrt.renfe.com/alerts.json"
    returns: "GTFS-RT 2.0 (73 alertas, 176 trip_updates_LD el 1-10-2026); el JSON va en camelCase con timestamp y time como cadenas de segundos epoch; entity con alert, tripUpdate (delay en segundos) o vehicle; tripId y stopId cruzan con el GTFS"
  - path: https://data.renfe.com/dataset/{uuid}/resource/{id}/download/{fichero}.{csv|xlsx}
    desc: Estaciones por núcleo, viajeros por franja horaria (Madrid, Barcelona, Valencia, Sevilla, Bilbao...), indemnizaciones, fichas de trenes; URL en resources[].url
quirks: [latin1]
ids: []
gotchas:
  - gtfsrt.renfe.com y ssl.renfe.com no completaron el TLS en cerca de la mitad de las conexiones desde el entorno de verificación (sin respuesta y corte a los 11 s, 1-10-2026); reintentar con espera.
  - El GTFS de AV y LD no lleva feed_info.txt ni fecha de versión; comprobar last_modified del recurso en package_show para saber si cambió.
  - Todas las líneas de los .txt van rellenas de espacios hasta 350 caracteres (AV y LD) o 150 (Cercanías), también la cabecera y campos como route_short_name (C1); recortar antes de parsear.
  - stop_id y CODIGO llevan ceros a la izquierda (04040, 01003); leer como texto, porque pandas los convierte a entero.
  - El CSV de estaciones va en ISO-8859-1 con CRLF, separador ; y todas las columnas entre comillas.
  - estaciones.csv cubre las 1.006 paradas del GTFS de AV y LD (stop_id igual a CODIGO) pero solo 642 de las 1.139 de Cercanías; para el resto usar stop_lat y stop_lon del GTFS.
  - Los datasets de viajeros por franja (año 2018, sin columna de fecha), estaciones por núcleo y fichas de trenes no cambian desde 2020-2021; compromiso-puntualidad son las indemnizaciones, no la puntualidad.
  - En AV y LD las horas van sin cero inicial (8:30:00) y algunas pasan de 24:00; el trip_id es número de tren, un dígito y fecha de inicio (0019012026-10-01).
  - El CKAN 2.8 de Renfe rechaza fl=name,title en package_search con Validation Error «No es una lista» (otros CKAN lo aceptan); repetir el parámetro, fl=name&fl=title (1-10-2026).
  - No localicé portal de datos abiertos de Adif (data.adif.es no responde y adif.es/datos-abiertos da 404 el 1-10-2026).
tips:
  - "gtfs_kit.read_feed(zip, dist_units='km') lee el GTFS de AV y LD sin tocarlo (recorta el relleno y deja stop_id como texto); para geometría de estaciones basta estaciones.csv en WGS84."
  - "pd.read_csv(f, dtype=str).rename(columns=str.strip) y después str.strip en cada columna evita los nombres y valores con relleno."
related: [dgt-datex-trafico, puertos-estado-datos, mitma-opendata-movilidad]
status: active
verified: "2026-10-01"
