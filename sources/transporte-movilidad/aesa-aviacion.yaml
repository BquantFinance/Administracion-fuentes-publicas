id: aesa-aviacion
name: Aena y AESA – Estadísticas de tráfico aéreo, registro de aeronaves y operadores UAS
org: Aena SME y Agencia Estatal de Seguridad Aérea (AESA)
ministry: Transportes y Movilidad Sostenible
level: age
sector: transporte-movilidad
tags: [aviacion, aeropuertos, pasajeros, operaciones, mercancias, trafico-aereo, aena, aeronaves, matriculas, drones]
summary: >-
  Informes mensuales y anuales de tráfico de Aena desde 2004 en xlsx y PDF con URL directa (pasajeros,
  operaciones y mercancía por aeropuerto con variación interanual); cuadros por compañía y destino solo con
  registro. Registro de aeronaves y de operadores UAS de AESA sin listado descargable.
access: [download, portal]
auth: none
formats: [xlsx, pdf, html]
update: monthly
coverage: "Informes mensuales 2004-2026 y anuales 2004-2025"
license: Condiciones propias de Aena (sociedad mercantil estatal); reutilización libre con cita de la fuente en AESA
base_url: https://www.aena.es/es/estadisticas/inicio.html
docs_url: https://www.aena.es/es/estadisticas/glosario-y-ayuda.html
endpoints:
  - path: https://www.aena.es/es/estadisticas/informes-mensuales.html?anio={AAAA}
    desc: Doce bloques div.informes (id=Enero a Diciembre) con enlaces PDF y XLS a /sites/Satellite?...blobwhere={id}; años 2004-2026 en el selector
    example: curl -s "https://www.aena.es/es/estadisticas/informes-mensuales.html?anio=2025" | grep -o 'blobwhere=[0-9]*&amp;ssbinary=true'
  - path: https://www.aena.es/sites/Satellite?blobcol=urldata&blobkey=id&blobtable=MungoBlobs&blobwhere={id}&ssbinary=true
    desc: Fichero del informe; el XLS es xlsx (55 KB) con la hoja Ranking mensual y tres bloques (pasajeros, operaciones, mercancías) por aeropuerto con total y variación
    example: curl -sL -o aena_2025_01.xlsx "https://www.aena.es/sites/Satellite?blobcol=urldata&blobkey=id&blobtable=MungoBlobs&blobwhere=1576870695595&ssbinary=true"
  - path: https://www.aena.es/es/estadisticas/informes-anuales.html
    desc: Informes anuales 2004-2025 (22 pares PDF y XLS en una sola página); el xlsx anual tiene la hoja AÑO {AAAA} con la misma estructura que el mensual
    example: curl -sL -o aena_2025.xlsx "https://www.aena.es/sites/Satellite?blobcol=urldata&blobkey=id&blobtable=MungoBlobs&blobwhere=1576873058143&ssbinary=true"
  - path: https://www.aena.es/es/estadisticas/{informes-detallados|consultas-personalizadas}.html
    desc: Cuadros de mando por compañía, aeropuerto y destino en MicroStrategy (informeswpa.aena.es); exigen registro e inicio de sesión (token en la URL)
  - path: https://www.seguridadaerea.gob.es/es/ambitos/aeronaves/registro-de-matriculas-de-aeronaves-civiles/registro-de-matriculas
    desc: Registro de Matrícula de Aeronaves Civiles con cuadros estadísticos anuales en PDF (registro general, AFI, ULM); no localicé listado descargable de aeronaves
  - path: https://www.seguridadaerea.gob.es/es/ambitos/drones/registro-de-operador-de-drones-uas
    desc: Registro de operadores de UAS; el alta y la consulta se hacen en sede.seguridadaerea.gob.es con identificación electrónica
quirks: [static-html, url-drift]
ids: []
gotchas:
  - Los enlaces PDF y XLS están en el HTML servido de informes-mensuales.html?anio= e informes-anuales.html (div.descargas); el JavaScript solo conmuta pestañas y no hace falta navegador ni sesión.
  - El id de blobwhere es un número opaco sin fecha (1576870695595 es enero de 2025); rascar la página en cada ejecución y emparejar cada div.informes con su texto Informe {mes} {año}.
  - Lo etiquetado XLS es xlsx (Content-Type spreadsheetml); cabeceras en las filas 5 a 7, datos desde la 8, variaciones como fracción (0.084 es 8,4 por ciento), mercancía en kilogramos y hoja Mozart Reports de metadato.
  - Los informes se publican como Datos provisionales; el Boletín Estadístico del MITMA (mitma-boletin-estadistico-online) da la misma serie mensual por aeropuerto con URL fija.
  - Aena es sociedad mercantil estatal (51 por ciento público) y publica por cuenta propia; sus condiciones de reutilización no son las de la AGE.
  - informeswpa.aena.es/MicroStrategyLibrary/api/status responde JSON sin autenticación, pero los cuadros detallados exigen usuario registrado.
  - La ruta matriculacion-de-aeronaves de AESA responde 200 con cuerpo vacío; la información está en registro-de-matriculas-de-aeronaves-civiles y no localicé ningún Excel con el censo de aeronaves.
tips:
  - "pd.read_excel(f, sheet_name='Ranking mensual', header=None, skiprows=7, usecols='B:D') da aeropuerto, pasajeros y variación; repetir con F:H (operaciones) y J:L (mercancías)."
related: [mitma-boletin-estadistico-online, dgt-estadisticas, ine-api-tempus, mincotur-industria-turismo]
status: active
verified: "2026-09-30"
