id: dgt-estadisticas
name: DGT en cifras – Parque, matriculaciones, bajas, conductores, siniestralidad y microdatos
org: Dirección General de Tráfico (DGT)
ministry: Interior
level: age
sector: transporte-movilidad
tags: [dgt, matriculaciones, parque-vehiculos, bajas, conductores, accidentes, siniestralidad, microdatos, matraba]
summary: >-
  Portal DGT en cifras con 226 productos por tema (tablas y series en xlsx, anuarios en PDF) y microdatos
  sin registro: matriculaciones diarias y mensuales (MATRABA, ancho fijo, desde 2014), bajas hasta 2024,
  parque de vehículos anual y mensual por vehículo, censo de conductores y sanciones.
access: [download, portal]
auth: none
formats: [xlsx, txt, zip, pdf, html]
update: daily
coverage: "Tablas hasta 2025; matriculaciones de 2014-12 a 2026-09; bajas de 2014-12 a 2024-06; parque anual 2015-2025 y mensual de 2025-03 a 2026-08"
license: Reutilización libre con cita de la fuente
base_url: https://www.dgt.es/menusecundario/dgt-en-cifras/
docs_url: https://www.dgt.es/export/sites/web-DGT/.galleries/downloads/dgt-en-cifras/matraba/MATRICULACIONES_MATRABA.pdf
endpoints:
  - path: https://www.dgt.es/menusecundario/dgt-en-cifras/dgt-en-cifras-resultados/?categorias=/Tema/{Vehiculos|Conductores|Siniestros-de-trafico|Informacion-municipal|Denuncias-e-ingresos|Motoristas}/&page={n}
    desc: Listado paginado de productos por tema (lento, 40 a 60 s por página); cada uno tiene ficha en /dgt-en-cifras-detalle/{slug}/ con los ficheros
  - path: https://www.dgt.es/menusecundario/dgt-en-cifras/dgt-en-cifras-resultados/dgt-en-cifras-detalle/{slug}/
    desc: Ficha con enlaces xlsx bajo /export/sites/web-DGT/.galleries/downloads/dgt-en-cifras/ (series y tablas de matriculaciones, parque, bajas, conductores)
    example: curl -sSL -o parque.xlsx "https://www.dgt.es/export/sites/web-DGT/.galleries/downloads/dgt-en-cifras/publicaciones/Parque-de-vehiculos-Tablas-Estadisticas/Parque-de-vehiculos-Tablas-estadisticas-2025.xlsx"
    returns: "xlsx de 82 KB con 21 hojas (V_4, V_4_CA...); en cada una el título Tabla N en la fila 1, cabecera en la 3 y una fila por territorio o categoría con enteros"
  - path: https://www.dgt.es/menusecundario/dgt-en-cifras/matraba-listados/{matriculaciones|bajas}-automoviles-{diario|mensual}.html
    desc: Listados con los enlaces ZIP; matriculaciones con 24 diarios del último mes y 141 mensuales de 2014-12 a 2026-08; bajas detenidas en 2024
  - path: https://www.dgt.es/microdatos/salida/{AAAA}/{M}/vehiculos/{matriculaciones|bajas}/export_{mat|bajas}_{AAAAMMDD}.zip
    desc: Microdatos diarios (ZIP de 1,4 MB con un txt de 10 MB el 29/09/2026); mensuales en export_mensual_{mat|bajas}_{AAAAMM}.zip (12 MB en 2026-08)
    example: curl -sSL -o mat.zip "https://www.dgt.es/microdatos/salida/2026/9/vehiculos/matriculaciones/export_mat_20260929.zip"
    returns: "txt Latin-1 de ancho fijo (714 caracteres, 14.526 registros) tras una línea de texto; FEC_MATRICULA DDMMAAAA, MARCA_ITV, MODELO_ITV, bastidor enmascarado, COD_MUNICIPIO_INE_VEH de 5 cifras, potencia con punto decimal"
  - path: https://www.dgt.es/microdatos/Parque/{AAAA}/parque_consolidado_{AAAA}.zip
    desc: Parque anual por vehículo (2015-2025, 1,6 GB el de 2025, variante _PROVINCIA.zip); mensual en Parque/parque_vehiculos_{AAAAMM}.zip desde 2025-03, hasta 1,75 GB
  - path: https://www.dgt.es/menusecundario/dgt-en-cifras/dgt-en-cifras-resultados/dgt-en-cifras-detalle/Datos-municipales-informacion-general-2025/
    desc: Datos municipales (parque, conductores, censo) en DatosMunicipalesGeneral_{AAAA}.xlsx con ficha de contenidos en PDF
quirks: [latin1, url-drift, tls-chain-incomplete]
ids: [ine-municipio, ine-provincia]
gotchas:
  - Los microdatos son txt de ancho fijo en Latin-1 con una línea de texto libre (letras de la última matrícula) que también trae el mensual, aunque el PDF MATRICULACIONES_MATRABA diga otra cosa; el diseño no va en el ZIP.
  - El bastidor viene enmascarado (UA8D72FZ5T***********) salvo acreditación de interés legítimo; el registro incluye marca, modelo, fecha, código INE de municipio (39020 Castro Urdiales), potencia, emisiones y distintivo.
  - Los listados de bajas terminan en 2024-05 (mensual) y 2024-06-14 (diario) y export_mensual_bajas_202608.zip da 404; no localicé bajas posteriores.
  - El portal IEST (sedeapl.dgt.gob.es/WEB_IEST_CONSULTA) redirige a dgt-en-cifras; el listado de transferencias mensuales (transferencias-automoviles-mensual.html) da 404 aunque exista la ficha.
  - No localicé microdatos de accidentes entre los 226 productos del portal (solo anuarios y estudios de siniestralidad en PDF y tablas xlsx); los microdatos disponibles son de vehículos, conductores, exámenes y sanciones.
  - Las fichas de resultados no filtran por texto (buscar= se ignora); para localizar un producto recorrer las categorías con page=n hasta que no aparezcan slugs nuevos.
  - Las páginas de resultados tardan 40 a 60 s y a veces responden 302 a www-pro.dgt.es/error500.html, y un xlsx de 82 KB tardó 4 minutos; usar tiempos de espera largos y reintentar.
  - Los cuadros de mando (paneldatos.dgt.es, MicroStrategy) sirven el certificado sin la cadena FNMT; añadir los intermedios FNMT para verificar TLS.
  - Los ficheros del parque son muy grandes (1,6 GB el anual de 2025 y hasta 1,75 GB cada mensual); descargar con reanudación y procesar por trozos.
tips:
  - "pandas.read_fwf con los anchos del PDF y encoding='latin-1', saltando la primera línea; el municipio es INE de cinco dígitos sin dígito de control, listo para cruzar con ine-codigos-territoriales."
  - Para series mensuales de matriculaciones por marca o combustible, los ZIP mensuales (export_mensual_mat) evitan descargar 30 diarios.
related: [dgt-datex-trafico, ine-codigos-territoriales]
status: active
verified: "2026-10-01"
