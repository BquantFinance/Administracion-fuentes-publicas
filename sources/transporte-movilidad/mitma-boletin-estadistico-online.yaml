id: mitma-boletin-estadistico-online
name: Transportes – Boletín estadístico online (aviación, puertos, carretera, ferrocarril)
org: Subdirección General de Estudios Económicos y Estadísticas, Ministerio de Transportes y Movilidad Sostenible
ministry: Transportes y Movilidad Sostenible
level: age
sector: transporte-movilidad
tags: [boletin-estadistico, aviacion-civil, aeropuertos, puertos, carretera, autopistas-peaje, ferrocarril, licitacion, construccion, xls]
summary: >-
  Capítulos del Boletín estadístico del ministerio: licitación y adjudicaciones de obra, aviación civil
  (total y 16 mayores aeropuertos), Puertos del Estado, mercancías por carretera, autopistas de peaje,
  ferrocarril, costes de la construcción y visados. Cada tabla en XLS con URL fija por código.
access: [download, portal]
auth: none
formats: [xls, html]
update: monthly
coverage: "Series mensuales desde 1990 en aviación (último mes, julio de 2026, publicado el 3-9-2026); segunda aplicación con EPTMC 2007-2025 y MOVILIA 2006-2007"
license: Reutilización libre con cita de la fuente
base_url: https://apps.fomento.gob.es/BoletinOnline/
docs_url: https://www.transportes.gob.es/informacion-para-el-ciudadano/informacion-estadistica/BoletinEstadistico
endpoints:
  - path: https://apps.fomento.gob.es/BoletinOnline/?nivel=2&orden={CC}000000
    desc: Índice de tablas del capítulo; 01 licitación, 02 adjudicaciones, 03 aviación civil, 04 puertos, 05 carretera, 06 autopistas de peaje, 07 ferrocarril
    example: curl -s "https://apps.fomento.gob.es/BoletinOnline/?nivel=2&orden=03000000" | grep -o 'sedal/[0-9]*\.XLS'
  - path: https://apps.fomento.gob.es/BoletinOnline/sedal/{codigo}.XLS
    desc: Tabla en Excel 97; 03010100 a 03010300 aeronaves, pasajeros y mercancías del total de aeropuertos, 03020100 a 03021600 los 16 mayores aeropuertos
    example: curl -sO "https://apps.fomento.gob.es/BoletinOnline/sedal/03010100.XLS"
    returns: "Excel 97 de una hoja; título en filas 2-4, PERIODO en la 8 y subcabecera en la 10; desde la 12, totales anuales 2025-1990, tres filas de variación en porcentaje (5.75) y meses en orden descendente de 2026 Jul a 1990 Ene con el año solo en el primer mes de cada año"
  - path: https://apps.fomento.gob.es/BoletinOnline2/?nivel=2&orden={CC}000000
    desc: Segunda aplicación (capítulos 25 a 59); encuesta de mercancías por carretera por año, MOVILIA, índices antiguos y vivienda (mivau-precios-vivienda-alquiler)
quirks: [static-html]
ids: []
gotchas:
  - Los códigos de tabla no son secuenciales (08010000 existe y 08201000 da 404); tomar los href sedal/ del índice del capítulo en vez de construirlos.
  - Excel 97 binario (application/vnd.ms-excel, 550 KB la tabla 03010100) que xlrd abre; la hoja se llama como el código en 03010100 pero Aeropuerto en 03020100, así que leer la primera hoja.
  - Los meses van en orden descendente y solo el primero de cada año lleva el año (2026 Jul, Jun, May...); rellenar el año hacia abajo y separar las filas anuales y las de variación (V. anual, V. acumulado).
  - Las tablas de aviación excluyen otras clases de tráfico (OCT) y solo hay 16 aeropuertos con tabla propia; para la red completa de Aena usar aesa-aviacion, con cifras algo mayores.
  - La aplicación vive en el dominio antiguo apps.fomento.gob.es y transportes.gob.es solo enlaza a ella; el anuario estadístico por capítulos (capitulos-{AAAA}) se publica solo en PDF.
  - Los capítulos 09, 10, 13, 15 y 19 son visados, licencias e índices de construcción con bases antiguas; mirar el título del capítulo antes de usarlos.
tips:
  - "pd.read_excel(url, header=None) y localizar la fila cuyo primer valor es PERIODO para fijar la cabecera."
  - Tráfico de todos los aeropuertos de Aena en los xlsx mensuales de aesa-aviacion; tráfico portuario mensual más detallado en puertos-estado-datos.
related: [aesa-aviacion, puertos-estado-datos, mivau-precios-vivienda-alquiler, dgt-estadisticas, renfe-datos-abiertos]
status: active
verified: "2026-10-01"
