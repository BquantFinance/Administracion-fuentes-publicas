id: dgt-datex-trafico
name: DGT – NAP de tráfico y ficheros DATEX II (incidencias, detectores, cámaras, ZBE)
org: Dirección General de Tráfico (DGT)
ministry: Interior
level: age
sector: transporte-movilidad
tags: [dgt, trafico, incidencias, datex2, nap, carreteras, camaras, detectores, radares, zbe, electrolineras, tiempo-real]
summary: >-
  Ficheros DATEX II públicos sin clave: incidencias en tiempo real (versión 3.7, cada minuto) y cámaras en el
  NAP; en infocar.dgt.es, medidas de 5.569 detectores cada minuto, radares, tramos, zonas de bajas emisiones,
  puntos de recarga eléctrica e incidencias de Cataluña y Gipuzkoa.
access: [download]
auth: none
formats: [xml, rdf]
update: realtime
coverage: "Situación actual; sin histórico"
license: Licencia gratuita con condiciones en el aviso legal de la DGT
base_url: https://infocar.dgt.es/datex2/
docs_url: https://nap.dgt.es/dataset
endpoints:
  - path: https://nap.dgt.es/datex2/v3/dgt/SituationPublication/datex2_v37.xml
    desc: Incidencias activas de la red DGT en DATEX II 3.7 (perfil RTTI de la DGT), actualizado cada minuto según la ficha del NAP
    example: curl -s "https://nap.dgt.es/datex2/v3/dgt/SituationPublication/datex2_v37.xml"
    returns: "DATEX II v3 (4,7 MB): payload/situation[@id]/situationRecord[@type,@id,@version] con situationRecordCreationTime, validity/validityStatus, cause/causeType, locationReference (roadInformation/roadName, tpegLinearLocation from y to con pointCoordinates, kilometerPoint, municipality, autonomousCommunity)"
  - path: https://nap.dgt.es/datex2/v3/dgt/DevicePublication/camaras_datex2_v37.xml
    desc: Cámaras de tráfico con localización (95 KB)
  - path: https://infocar.dgt.es/datex2/dgt/MeasuredDataPublication/detectores/content.xml
    desc: Medidas de 5.569 puntos de detección (TrafficSpeed, intensidad) en DATEX II 1.0, 18,7 MB regenerados cada minuto
    example: curl -s "https://infocar.dgt.es/datex2/dgt/MeasuredDataPublication/detectores/content.xml" | head -c 3000
  - path: https://infocar.dgt.es/datex2/dgt/PredefinedLocationsPublication/{radares|detectores|tramos_invive|tefiva|tramosriesgomotos}/content.xml
    desc: Localizaciones predefinidas (radares fijos 62 KB, detectores, tramos INVIVE, tramos de riesgo para motos); caminoSantiago tiene subcarpetas
    example: curl -s "https://infocar.dgt.es/datex2/dgt/PredefinedLocationsPublication/radares/content.xml"
  - path: https://infocar.dgt.es/datex2/v3/dgt/zbe/ControledZonePublication/{Municipio}.xml
    desc: Zonas de bajas emisiones en DATEX II 3 (MadridCentral, Barcelona, SevillaCartuja, ACoruña, MolinaDeSegura y otros; listado en el directorio)
  - path: https://infocar.dgt.es/datex2/v3/miterd/EnergyInfrastructureTablePublication/electrolineras.xml
    desc: Puntos de recarga eléctrica (EnergyInfrastructureTablePublication, datos del MITERD), actualizado a diario
  - path: https://infocar.dgt.es/datex2/{sct|dt-gv}/SituationPublication/all/content.xml
    desc: Incidencias de Cataluña (Servei Català de Trànsit) y Gipuzkoa (Diputación Foral) en DATEX II 1.0
  - path: https://nap.dgt.es/dataset
    desc: Catálogo del NAP con 37 datasets (paneles, límites de velocidad, mapa de tráfico, conos conectados, datos de TomTom y HERE) con licencia y frecuencia por ficha
quirks: [url-drift, static-html]
ids: []
gotchas:
  - La ruta clásica infocar.dgt.es/datex2/dgt/SituationPublication/all/content.xml ya no existe (404); el directorio solo enlaza al dataset del NAP, donde vive el fichero v3.7.
  - Conviven tres generaciones. DATEX II 1.0 (detectores, localizaciones, Cataluña, Gipuzkoa), DATEX II 3 (ZBE, electrolineras) y 3.7 con espacio de nombres propio http://levelC/schema/3; cada una necesita su parser.
  - La API CKAN del NAP (/api/3/action) responde 403; el catálogo solo se puede leer en HTML (dos páginas) y catalog.ttl devolvió 500. Las fichas y los ficheros son públicos sin registro.
  - El fichero de detectores pesa 18,7 MB y se regenera cada minuto sin Content-Length; descargar como máximo una vez por minuto y parsear en streaming.
  - Sin histórico en ningún fichero; hay que archivar cada descarga. El feed LOD (lod/dgt/incidencias.rdf) contiene solo la cabecera (882 bytes).
  - Las incidencias de la DGT no cubren Cataluña ni País Vasco; usar los ficheros sct y dt-gv del mismo servidor (Bizkaia y Álava no están).
tips:
  - "lxml.etree.iterparse sobre el XML de detectores buscando siteMeasurements: measurementSiteReference (GUID_DET_nnnnnn) enlaza con PredefinedLocationsPublication/detectores para las coordenadas."
related: [dgt-estadisticas]
status: active
verified: "2026-09-30"
