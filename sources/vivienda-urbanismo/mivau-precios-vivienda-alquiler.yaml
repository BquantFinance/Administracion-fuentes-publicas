id: mivau-precios-vivienda-alquiler
name: Ministerio de Vivienda – Estadísticas de vivienda (Boletín Online en XLS) y SERPAVI
org: Dirección General de Vivienda y Suelo
ministry: Vivienda y Agenda Urbana
level: age
sector: vivienda-urbanismo
tags: [vivienda, alquiler, precios, valor-tasado, transacciones, parque-viviendas, suelo, serpavi]
summary: >-
  Transacciones inmobiliarias, valor tasado, estimación del parque, stock de vivienda nueva, precios del
  suelo urbano y vivienda protegida en tablas XLS del Boletín Estadístico Online (un capítulo por
  estadística), más SERPAVI, índices de precios de alquiler consultables por municipio y distrito.
access: [download, portal]
auth: none
formats: [xls, pdf, html]
update: quarterly
coverage: "Valor tasado desde 1995; transacciones desde 2004; SERPAVI según año fiscal"
license: Reutilización libre con cita de la fuente
base_url: https://www.mivau.gob.es/el-ministerio/observatorios-y-estadisticas
docs_url: https://www.mivau.gob.es/vivienda/alquila-bien-es-tu-derecho/serpavi
endpoints:
  - path: https://apps.fomento.gob.es/BoletinOnline2/?nivel=2&orden={NN}000000
    desc: Capítulo del Boletín Online; orden 31 vivienda protegida, 32 libre, 33 parque, 34 transacciones, 35 valor tasado, 36 suelo, 46 viviendas tasadas
    example: curl -s "https://apps.fomento.gob.es/BoletinOnline2/?nivel=2&orden=34000000"
  - path: https://apps.fomento.gob.es/BoletinOnline2/sedal/{codigo}.XLS
    desc: Tabla en XLS (por ejemplo 34010110.XLS, 145 KB, transacciones totales); los códigos se leen en la página del capítulo
    example: curl -sSL -o transacciones.xls "https://apps.fomento.gob.es/BoletinOnline2/sedal/34010110.XLS"
  - path: https://apps.fomento.gob.es/BoletinOnline2/?nivel=1&orden=34000000
    desc: Índice de todos los capítulos (orden 25 a 59), incluidos transporte de mercancías, MOVILIA y costes de la construcción
  - path: https://www.mivau.gob.es/el-ministerio/observatorios-y-estadisticas/estadisticas/{valor-tasado-vivienda|transacciones-inmobiliarias-compraventa|estimacion-parque-viviendas|precios-suelo-urbano|stock-vivienda-nueva|vivienda-libre}
    desc: Página de cada estadística con metodología en PDF y enlace a su capítulo del Boletín Online
  - path: https://www.mivau.gob.es/vivienda/alquila-bien-es-tu-derecho/serpavi/{municipio|distrito|comunidad_autonoma}
    desc: Consulta de SERPAVI por ámbito (páginas JavaScript, metodología en PDF, sin fichero descargable)
quirks: [url-drift, js-rendered]
ids: []
gotchas:
  - La ruta mivau.gob.es/vivienda/estadisticas da 404; el índice está en el-ministerio/observatorios-y-estadisticas y los datos siguen en apps.fomento.gob.es (dominio antiguo, sin redirección al nuevo).
  - Las tablas son XLS antiguos (application/vnd.ms-excel) con varias filas de cabecera; abrir con xlrd o calamine, no con openpyxl.
  - No localicé descarga masiva ni API pública de SERPAVI; el índice por sección censal solo se consulta en la web. Se construye con datos fiscales y excluye País Vasco y Navarra.
  - Las transacciones proceden del Consejo General del Notariado y el valor tasado de las sociedades de tasación; el ministerio agrega y publica con retraso trimestral.
tips:
  - "Para una serie municipal de transacciones, localizar en el capítulo 34 la tabla por municipios (código 3401xxxx) y leerla con pandas.read_excel(engine='xlrd' o 'calamine')."
related: [catastro-ovc, ine-api-tempus, ine-codigos-territoriales, mitma-boletin-estadistico-online]
status: active
verified: "2026-09-30"
