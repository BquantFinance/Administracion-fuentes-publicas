id: mapa-pesca
name: MAPA – Registro de flota pesquera y estadísticas de capturas, desembarcos y acuicultura
org: Secretaría General de Pesca
ministry: Agricultura, Pesca y Alimentación
level: age
sector: agricultura-pesca-alimentacion
tags: [pesca, flota, registro-flota, capturas, desembarques, acuicultura, caladeros, buques]
summary: >-
  Registro General de la Flota Pesquera 2006-2025 en un xlsx por buque y año (197.131 filas con código de
  buque, puerto base, caladero, modalidad, arqueo, potencia, eslora y edad), capturas y desembarcos por
  especie, destino y zona (serie 1992-2024), flota por características y acuicultura.
access: [download, portal]
auth: none
formats: [xlsx, pdf, html]
update: annual
coverage: "Flota 2006-2025; capturas 1992-2024"
license: Reutilización libre con cita de la fuente
base_url: https://www.mapa.gob.es/es/estadistica/temas/estadisticas-pesqueras/
docs_url: https://www.mapa.gob.es/es/pesca/temas/registro-flota/informacion-sobre-flota-pesquera
endpoints:
  - path: https://www.mapa.gob.es/dam/mapa/contenido/pesca/temas--nuevo/registro-de-flota--flota-pesquera-espanola/registro-general-de-la-flota-pesquera/informacion-sobre-la-flota-pesquera/rgfp_bi_excel_2006_2025_20260127.xlsx
    desc: Registro de flota 2006-2025 (15 MB, hoja Datos con AÑO, CODIGOBUQUE, PUERTO BASE, PROVINCIA, CCAA, CALADERO, modalidad, ARQUEO GT, POTENCIA KW, ESLORA, EDAD)
    example: curl -sSL -o flota.xlsx "https://www.mapa.gob.es/dam/mapa/contenido/pesca/temas--nuevo/registro-de-flota--flota-pesquera-espanola/registro-general-de-la-flota-pesquera/informacion-sobre-la-flota-pesquera/rgfp_bi_excel_2006_2025_20260127.xlsx"
    returns: "Hoja Datos (15 MB) con una fila por buque y año 2006-2025: AÑO, CODIGOBUQUE, NOMBRE BUQUE, PUERTO BASE, PROVINCIA, CCAA, CALADERO, SUBCALADERO, CENSO POR MODALIDAD Y CALADERO, MODALIDAD DE PESCA, ARQUEO GT, POTENCIA KW, ESLORA TOTAL, EDAD..."
  - path: https://www.mapa.gob.es/es/estadistica/temas/estadisticas-pesqueras/pesca-maritima/estadistica-capturas-desembarcos
    desc: Capturas y desembarcos en xlsx (peso y valor por especie, destino y zona del último año, serie bcap 1992-2024)
  - path: https://www.mapa.gob.es/es/estadistica/temas/estadisticas-pesqueras/pesca-maritima/estadistica-flota-pesquera
    desc: Estadística de flota en xlsx (19 tablas por eslora, edad, características, 2025)
  - path: https://www.mapa.gob.es/es/estadistica/temas/estadisticas-pesqueras/acuicultura
    desc: Encuesta de establecimientos y encuesta económica de acuicultura (subpáginas; sin xlsx directo en la de establecimientos)
  - path: https://www.mapa.gob.es/es/pesca/temas/registro-flota/informacion-sobre-flota-pesquera
    desc: Página del registro con el xlsx anterior y catálogos de flota en PDF
quirks: [url-drift, static-html]
ids: []
gotchas:
  - La ruta censo-flota-pesquera-operativa de la ficha anterior da 404; el fichero de flota está en informacion-sobre-flota-pesquera y su nombre lleva la fecha de generación (20260127), así que cambia con cada actualización.
  - CODIGOBUQUE es el identificador interno del registro español, no el CFR europeo; el xlsx no incluye el CFR ni la matrícula.
  - Los xlsx de estadística llevan en el nombre una marca de tiempo de publicación (2025-12-17-13-41-18) y una carpeta con hash; leer los href de la página en cada descarga.
  - Los textos del registro vienen en mayúsculas y con espacios finales; normalizar antes de agrupar por puerto o caladero.
  - Las notas de venta individuales no se publican; solo agregados de peso y valor.
tips:
  - "pandas.read_excel(f, sheet_name='Datos') y luego groupby(['AÑO', 'CALADERO']) para evolución de la flota; PROVINCIA y CCAA por nombre, sin código INE."
related: [mapa-estadisticas-agrarias, puertos-estado-datos]
status: active
verified: "2026-09-30"
