id: mapa-sigpac
name: SIGPAC – Recintos agrícolas por OGC API, consultas REST, WMS, teselas y GeoPackage (FEGA)
org: Fondo Español de Garantía Agraria (FEGA) y MAPA
level: age
sector: agricultura-pesca-alimentacion
ministry: Agricultura, Pesca y Alimentación
tags: [sigpac, parcelas-agricolas, recintos, usos-suelo, wms, ogc-api, geopackage, cultivo-declarado, red-natura]
summary: >-
  Recintos SIGPAC de toda España (uso, superficie, pendiente, regadío, altitud) con OGC API Features,
  consultas REST por coordenadas o códigos (referencia catastral, Red Natura, nitratos), WMS, teselas
  vectoriales y GeoPackage por provincia y campaña. Sin clave, licencia CC BY 4.0.
access: [api-rest, ogc, download, portal]
auth: none
formats: [json, geojson, gpkg, zip, xml, pdf]
update: annual
coverage: "Campañas 2025 y 2026 en descarga; campaña en uso en los servicios"
license: CC BY 4.0
base_url: https://sigpac-hubcloud.es/
docs_url: https://sigpac-hubcloud.es/html/csp/descServicio.html
endpoints:
  - path: https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/{srid}/{x}/{y}.json
    desc: Recinto que contiene un punto (códigos SIGPAC, superficie, pendiente_media, coef_regadio, uso_sigpac, altitud, wkt); con extensión .geojson devuelve GeoJSON
    example: curl -s "https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/4326/-3.9/40.3.json"
  - path: https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfo/{pr}/{mu}/{ag}/{zo}/{po}/{pa}/{re}.json
    desc: Propiedades de un recinto por códigos; recinfoparc devuelve todos los recintos de la parcela y recincentroid su centroide
    example: curl -s "https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfo/28/15/0/0/3/9000/6.json"
  - path: https://sigpac-hubcloud.es/servicioconsultassigpac/query/refcatparcela/{pr}/{mu}/{ag}/{zo}/{po}/{pa}.json
    desc: Referencia catastral de la parcela SIGPAC (referencia_cat de 14 caracteres); refrecinbycoord da los códigos SIGPAC de un punto
    example: curl -s "https://sigpac-hubcloud.es/servicioconsultassigpac/query/refcatparcela/28/15/0/0/3/9000.json"
  - path: https://sigpac-hubcloud.es/servicioconsultassigpac/intersection/{red_natura|nitratos}/{pr}/{mu}/{ag}/{zo}/{po}/{pa}/{re}.json
    desc: Intersección del recinto con Red Natura 2000 (lic_code, zepa_code, surface_intersection, surface_tpc) o zonas vulnerables a nitratos
  - path: https://sigpac-hubcloud.es/ogcapi/collections/{recintos|cultivo_declarado|elementos_paisaje_area|elementos_paisaje_linea|elementos_paisaje_punto}/items?bbox={bbox}&limit={n}&f=json
    desc: OGC API Features con filtro por bbox y por atributos (provincia=28); numberMatched y paginación estándar
    example: curl -s "https://sigpac-hubcloud.es/ogcapi/collections/recintos/items?bbox=-3.71,40.41,-3.70,40.42&limit=5&f=json"
  - path: https://sigpac-hubcloud.es/geopackages/{campaña}/recintos/{PP}_{PROVINCIA}_rec_{campaña}_{AAAAMMDD}_gpkg.zip
    desc: Descarga masiva por provincia (50 ficheros de 200 a 900 MB por campaña; listado en el directorio geopackages/{campaña}/recintos/ y en elementos_del_paisaje/)
    example: curl -sSL -o 01_ALAVA.zip "https://sigpac-hubcloud.es/geopackages/2026/recintos/01_ALAVA_rec_2026_20251201_gpkg.zip"
  - path: https://sigpac-hubcloud.es/wms?SERVICE=WMS&REQUEST=GetCapabilities
    desc: WMS con capas AU.Sigpac:recinto, cultivo_declarado y e_paisaje (CRS 84, EPSG 25829-25831); réplica en https://wms.mapa.gob.es/sigpac/wms
  - path: https://sigpac-hubcloud.es/mvt/{capa}@3857@{pbf|geojson}/{z}/{x}/{y}.{pbf|geojson}
    desc: Teselas vectoriales de la campaña en uso (anterior/ para la previa) para recinto, cultivo_declarado y elementos del paisaje
  - path: https://sigpac-hubcloud.es/codigossigpac/provincia.json
    desc: Lista de códigos de provincia; las de municipio, uso y aprovechamiento anunciadas en listCod devolvieron 404 con esos nombres
quirks: [url-drift]
ids: [referencia-sigpac, referencia-catastral, ine-provincia, ine-municipio]
gotchas:
  - Los códigos de provincia y municipio de SIGPAC son los del INE (28/15 es Madrid/Alcorcón) y agregado y zona suelen ser 0; la referencia completa se escribe pr:mu:ag:zo:po:pa:re (28:15:0:0:3:9000:6).
  - Las consultas por códigos devuelven la geometría en srid 4258 (ETRS89) y las consultas por punto en el srid pedido; wkt en texto, no GeoJSON, salvo con extensión .geojson.
  - refcatparcela repite la misma fila varias veces (una por recinto); deduplicar. La referencia catastral es la de 14 caracteres de la parcela rústica.
  - Códigos incorrectos devuelven 400 Bad Request sin cuerpo JSON; comprobar antes con refrecinbycoord o recinfobypoint.
  - Las capas cambian cada campaña y los recintos se renumeran; los GeoPackages se publican por campaña (directorios 2025 y 2026) con la fecha de generación en el nombre.
  - La descarga.aspx de mapa.gob.es citada antes da 404; el visor sigpac.mapa.gob.es/fega/visor es un componente web (wc-vsp.js de 3,6 MB) sin URL de datos propia.
  - Los Excel y visores de las CCAA con SIGPAC propio (por ejemplo Cataluña) pueden diferir; el catálogo del FEGA es la referencia estatal.
tips:
  - Cruce parcela agrícola con catastro en dos llamadas. refrecinbycoord con las coordenadas, refcatparcela con los códigos; después Consulta_DNPRC de la ficha catastro-ovc para el detalle catastral.
  - "Para procesar una provincia entera, descargar el GeoPackage y leerlo con geopandas.read_file(zip, layer=...) o con ogr2ogr; para consultas puntuales masivas, OGC API con bbox pequeños y limit alto."
related: [catastro-ovc, fega-beneficiarios-pac, miteco-banco-datos-naturaleza]
status: active
verified: "2026-09-30"
