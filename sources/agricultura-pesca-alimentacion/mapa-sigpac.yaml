gotchas:
  - La referencia SIGPAC (provincia, municipio, agregado, zona, polígono, parcela, recinto) no es la referencia catastral, aunque comparten polígono y parcela en rústica.
  - Las capas cambian cada campaña; guardar la campaña usada porque los recintos se renumeran.
  - La descarga por CCAA a veces la sirven los servicios autonómicos, no el FEGA.
