gotchas:
  - Las URLs del portal WebSphere (wps/portal) son largas pero estables por código ESTnn.
  - Afiliación media mensual y afiliación a último día son series distintas con cifras distintas.
  - Los Excel tienen varias hojas con cabeceras combinadas; no leer con parsers CSV.
  - Los datos por municipio de afiliados solo se publican para municipios de más de 40.000 habitantes.
