id: sepe-estadisticas
name: SEPE – Paro registrado, contratos y prestaciones
org: Servicio Público de Empleo Estatal (SEPE)
ministry: Trabajo y Economía Social
level: age
sector: empleo-seguridad-social
tags: [sepe, paro-registrado, contratos, prestaciones, demandantes, municipios, ocupaciones, cnae]
summary: >-
  Paro registrado, demandantes, contratos y prestaciones por desempleo, mensuales: avances en xls con URL fija y
  series desde 2001, paro y contratos de todos los municipios con código INE en un xls por mes, y desglose por
  división CNAE, sexo y edad de capitales y municipios de más de 20.000.
alerts:
  - "«<5» es secreto (1 a 4), no cero: un sexo sale restando el otro del TOTAL (Abengibre agosto 2026, hombres 18 - 13 = 5) y la provincia, de su fila de total (Albacete 20.710, no los 20.698 de sumar municipios)."
access: [download, portal]
auth: none
formats: [xls, pdf, html, rss]
update: monthly
coverage: "Todos los municipios desde mayo de 2005; por actividad, capitales y más de 45.000 habitantes desde 2009 y de 20.000 a 45.000 desde 2017; series nacionales desde enero de 2001"
sync:
  since: "Mayo de 2005 en el paro por municipio"
  full: "Página municipios/{AAAA}/{mes}.html (hasta 2019, {mes}-{AAAA}.html) y su ESTADISTICA_MUNICIPIOS.xls, unos 257 meses."
  size: "De 2,9 a 3,9 MB por mes en xls, unos 0,85 GB en total."
  new: "La página del mes siguiente da 404 hasta que se publica (la de septiembre de 2026 daba 404 el 01/10); el RSS no trae fecha."
license: Reutilización libre con cita de la fuente
base_url: https://www.sepe.es/HomeSepe/que-es-el-sepe/estadisticas.html
docs_url: https://www.sepe.es/HomeSepe/que-es-el-sepe/estadisticas/datos-estadisticos.html
endpoints:
  - path: https://www.sepe.es/SiteSepe/contenidos/que_es_el_sepe/estadisticas/datos_avance/xls/{carpeta}/{tabla}.xls
    desc: Avance mensual con URL fija; carpeta empleo (evolparo, evolparoseries, evolparoseries2001, paroprovsector), contratos (serie_contratos), paro_prov
    example: curl -sO -A "Mozilla/5.0" "https://www.sepe.es/SiteSepe/contenidos/que_es_el_sepe/estadisticas/datos_avance/xls/empleo/evolparoseries.xls"
    returns: "xls con hojas Sectores y Sexo y Edad, cinco filas de título, año solo en la primera fila de cada año (rellenar hacia abajo), mes como 201701.0 y nombre, y enteros; evolparoseries va de 2017-01 al último mes y evolparoseries2001 de 2001-01 a 2016-12 con las columnas desplazadas una posición"
  - path: https://www.sepe.es/HomeSepe/que-es-el-sepe/estadisticas/datos-estadisticos/municipios/{AAAA}/{mes}.html
    desc: Página del mes con ESTADISTICA_MUNICIPIOS.xls (todos los municipios) y MUNI_{PROVINCIA}_{MMAA}.xls; hasta 2019 la página es {mes}-{AAAA}.html
    example: curl -s -A "Mozilla/5.0" "https://www.sepe.es/HomeSepe/que-es-el-sepe/estadisticas/datos-estadisticos/municipios/2026/agosto.html" | grep -o '/HomeSepe/dam/jcr:[^"]*ESTADISTICA_MUNICIPIOS.xls'
    returns: "ESTADISTICA_MUNICIPIOS.xls (3,7 MB) con Indice y hojas PARO {PROVINCIA} y CONTRATOS {PROVINCIA}; ocho filas de cabecera y una fila por municipio con código INE como número (28001.0), nombre (ACEBEDA, LA), total, sexo por edad y sector; «<5» como texto y fila final de total sin código"
  - path: https://www.sepe.es/SiteSepe/contenidos/que_es_el_sepe/estadisticas/datos_estadisticos/municipios_20_45/{AAAA}/{mes}_{AAAA}/Muniacteco_20-45_{CCAA}.xls
    desc: Paro y contratos por división CNAE, sexo, edad y municipio solo de 20.000 a 45.000 habitantes sin capitales; página municipios-20-45/{AAAA}/{mes}.html
    example: curl -sO -A "Mozilla/5.0" "https://www.sepe.es/SiteSepe/contenidos/que_es_el_sepe/estadisticas/datos_estadisticos/municipios_20_45/2026/agosto_2026/Muniacteco_20-45_ANDALUCIA.xls"
    returns: "xls de 3 MB con 12 hojas (paro y contratos totales, indefinidos y temporales por sexo); bloques por municipio con filas Provincia y Municipio por nombre, edades 16-19 a >59 en filas y divisiones CNAE en columnas ('00' a '99'; en contratos de 2026 '25/47  '), «<5» como texto"
  - path: https://www.sepe.es/SiteSepe/contenidos/que_es_el_sepe/estadisticas/datos_estadisticos/municipios_capitales/{AAAA}/{mes}_{AAAA}/Municipios_acteco_{CCAA}.xls
    desc: Mismo formato para capitales y municipios de más de 45.000 habitantes (24 en Madrid); página municipios-capitales/{AAAA}/{mes}.html desde 2009
    example: curl -sO -A "Mozilla/5.0" "https://www.sepe.es/SiteSepe/contenidos/que_es_el_sepe/estadisticas/datos_estadisticos/municipios_capitales/2026/agosto_2026/Municipios_acteco_MADRID.xls"
  - path: https://www.sepe.es/HomeSepe/rssgen/RSSServlet?namePage={pagina}.html&param1=HomeSepe
    desc: RSS de cada página de estadísticas; un único item con el enlace a la página, sin fecha ni ficheros
    example: curl -s -A "Mozilla/5.0" "https://www.sepe.es/HomeSepe/rssgen/RSSServlet?namePage=municipios.html&param1=HomeSepe"
    returns: "RSS 2.0 en UTF-8 con un solo item (title, link, description, category, guid) y sin pubDate; un namePage desconocido responde 302 sin cuerpo"
quirks: [static-html, overwritten-in-place, url-drift]
ids: [ine-municipio, cnae]
gotchas:
  - HEAD devuelve 403 en los ficheros; usar GET, que admite Range.
  - municipios.html (todos los municipios por provincia) llega hasta el último mes; municipios-20-45 y municipios-capitales son otras tablas con desglose por actividad, no su continuación.
  - Los xls por actividad (Muniacteco_20-45, Municipios_acteco) identifican provincia y municipio solo por nombre en filas de título; el código INE está en ESTADISTICA_MUNICIPIOS.xls y MUNI_{PROVINCIA}.
  - xlrd falla en parte de los xls (evolparoseries, MUNI_*, Muniacteco; Expected little-endian marker) y LibreOffice no convirtió ninguno de los probados; pandas con engine calamine los lee todos.
  - En paroprovsector, parosexoedadprov y evolprovsectores la primera columna numera filas de 1 a 62 con provincias y totales de comunidad intercalados (9 ANDALUCIA), no es el código INE.
  - En evolparo.xls la variación anual del año en curso llega como texto con coma decimal ('-6,17') y la del año anterior como número.
  - Desde 2020 los ficheros municipales cuelgan de /HomeSepe/dam/jcr:{uuid}/ con uuid nuevo cada mes y hay páginas con nombre irregular (2025/Octubre.html, 2019/noviembre.html); tomar los enlaces de la página.
  - Los xls de avance se sobreescriben cada mes en la misma URL; guardar copia fechada para el histórico de publicaciones.
  - Paro registrado no es lo mismo que desempleo EPA (INE); no comparar niveles.
tips:
  - "Paro por municipio con código INE: GET de municipios/{AAAA}/{mes}.html, enlace a ESTADISTICA_MUNICIPIOS.xls y pd.read_excel(f, sheet_name=None, header=None, engine='calamine'); filas con código numérico en la columna 0."
related: [ine-api-tempus, segsocial-estadisticas, ine-codigos-territoriales, mites-estadisticas]
status: active
verified: "2026-10-01"
