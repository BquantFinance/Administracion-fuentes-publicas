id: boe-api-sumario
name: BOE – API de sumarios
org: Agencia Estatal Boletín Oficial del Estado (AEBOE)
ministry: Presidencia, Justicia y Relaciones con las Cortes
level: age
sector: legislacion-boletines
tags: [boe, diario-oficial, legislacion, sumario, disposiciones, anuncios]
summary: >-
  Sumario diario del BOE en JSON o XML: todas las disposiciones y anuncios publicados cada día con identificador,
  título, sección, departamento, epígrafe y URLs de PDF, HTML y XML del texto completo de cada uno.
access: [api-rest]
auth: none
formats: [json, xml, pdf, html]
update: daily
coverage: "1960-09-"
sync:
  since: "1960-09-01, primer sumario de la API (1960-08-31 y anteriores dan 404)"
  full: "Recorrer /boe/sumario/{AAAAMMDD} de lunes a sábado desde 19600901, unos 20.000 sumarios, y el url_xml de cada item si hace falta el texto; scripts/clientes/boe.py sumarios() salta domingos y trata 404 como día sin boletín."
  size: "2025 entero medido, 313 sumarios, 97 MB de JSON y 75.720 entradas, con 17,2 GB de PDF (szBytes) y unos 0,5 GB de XML (media de 7,4 KB en 40). Desde 1960, unos 4 GB de sumarios y 3 millones de entradas (un día por trimestre); 0,23 s por sumario."
  new: "Pedir el sumario del día; 404 es día sin boletín (domingos). Para avisar sin descargar, los RSS de boe-feeds."
license: Reutilización libre con cita de la fuente (aviso legal AEBOE)
base_url: https://www.boe.es/datosabiertos/api
docs_url: https://www.boe.es/datosabiertos/api/api.php
endpoints:
  - path: /boe/sumario/{AAAAMMDD}
    desc: Sumario del día, anidado en diario > seccion > departamento > epigrafe > item
    example: 'curl -s -H "Accept: application/json" "https://www.boe.es/datosabiertos/api/boe/sumario/20240102"'
    returns: "{status, data.sumario:{metadatos, diario[]:{numero, seccion[]:{codigo, nombre, departamento[]:{codigo, nombre, epigrafe[]:{nombre, item[]}}}}}}; item {identificador, titulo, url_pdf{texto, szBytes}, url_html, url_xml}; en 4, 5A y 5B item cuelga de departamento; nodos texto intermedios; un solo elemento es objeto"
  - path: https://www.boe.es/diario_boe/xml.php?id={BOE-A-AAAA-NNNNN}
    desc: Texto completo y metadatos de una disposición o anuncio en XML; no necesita cabecera Accept
    example: curl -s "https://www.boe.es/diario_boe/xml.php?id=BOE-A-2024-87"
    returns: "XML documento con metadatos (identificador, departamento y rango con atributo codigo, fecha_disposicion, titulo, fecha_publicacion, seccion, url_pdf, estatus_derogacion), analisis (materias, notas, referencias anteriores y posteriores) y texto"
  - path: https://www.boe.es/diario_boe/txt.php?id={id}
    desc: Versión HTML de la disposición
  - path: https://www.boe.es/boe/dias/{AAAA}/{MM}/{DD}/pdfs/{id}.pdf
    desc: PDF de la disposición; la fecha del path es la de publicación
    example: curl -sO "https://www.boe.es/boe/dias/2024/01/02/pdfs/BOE-A-2024-87.pdf"
rate_limit: No documentado
quirks: [accept-header-required, json-object-or-list, errors-html-or-xml, no-weekend-data, soft-errors-200]
ids: [boe-id]
gotchas:
  - Cabecera Accept obligatoria con application/json o application/xml; sin ella, o con */*, responde 400.
  - Los errores (400, 404, 500) llegan siempre con cuerpo XML aunque se pida JSON; comprobar el código HTTP antes de parsear.
  - En JSON, diario, seccion, departamento, epigrafe e item son objeto si hay un elemento y lista si hay varios; normalizar a lista antes de iterar.
  - Entre niveles aparecen nodos texto (departamento.texto en las secciones 4 y 5C, seccion.texto en algún número) y un día puede traer dos números (241 y 242 el 30/09/2026); recorrer el árbol sin suponer niveles.
  - El BOE sale todos los días salvo los domingos, festivos nacionales incluidos (el 1/1 y el 25/12 solo con secciones 1 a 3); los domingos la API devuelve 404.
  - Algunos días antiguos (p. ej. 19700102) devuelven 500 aunque exista boletín; reintentar o saltar.
  - Cada item trae url_pdf.texto, url_html y url_xml ya construidas; no montar la URL del PDF a mano (BOE-A-2024-1 no está en 2024/01/02).
  - Los identificadores siguen el patrón BOE-A-AAAA-NNNNN (disposiciones) y BOE-B-AAAA-NNNNN (anuncios); la numeración es anual.
  - No hay búsqueda por texto en esta API; descargar sumarios y filtrar en local, o usar la API de legislación consolidada.
  - xml.php con un id inexistente responde 200 con raíz error (descripcion No se encontró el documento original) y Content-Type text/html; comprobar la raíz.
tips:
  - El OpenAPI 3.1 completo está embebido en api.php (variable openApiFile); el documento técnico es APIsumarioBOE.pdf en /datosabiertos/documentos/.
  - scripts/clientes/boe.py aplana el sumario con todas sus variantes (items), lee el XML de cada disposición (documento) y recorre días saltando domingos (sumarios).
related: [boe-api-legislacion-consolidada, borme-api-sumario, boe-feeds]
status: active
verified: "2026-10-01"
