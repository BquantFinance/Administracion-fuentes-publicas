id: boe-eli
name: ELI – Identificador Europeo de Legislación en el BOE
org: Agencia Estatal Boletín Oficial del Estado (AEBOE)
ministry: Presidencia, Justicia y Relaciones con las Cortes
level: age
sector: legislacion-boletines
tags: [eli, legislacion, uris, linked-data, rdf]
summary: >-
  URIs estables tipo ELI para normas estatales, con metadatos RDFa embebidos en las páginas de legislación
  consolidada, interoperables con EUR-Lex y otros boletines europeos.
access: [download]
auth: none
formats: [html, rdf]
update: daily
license: Reutilización libre con cita de la fuente (aviso legal AEBOE)
base_url: https://www.boe.es/eli/
docs_url: https://www.boe.es/legislacion/eli.php
endpoints:
  - path: https://www.boe.es/eli/es/{tipo}/{AAAA}/{MM}/{DD}/{num}/con
    desc: Texto consolidado de una norma por su URI ELI
    example: curl -sL "https://www.boe.es/eli/es/lo/2018/12/05/3/con"
  - path: https://www.boe.es/eli/es/{tipo}/{AAAA}/{MM}/{DD}/{num}/dof
    desc: Versión publicada en el diario oficial
gotchas:
  - Los tipos de norma en la URI son abreviaturas (lo ley orgánica, l ley, rd real decreto, rdl real decreto-ley, o orden).
  - La URI ELI redirige a la página HTML; para JSON usar la API de legislación consolidada con el id BOE.
related: [boe-api-legislacion-consolidada]
status: active
verified: null
