    emp = boe.borme_empresas("BORME-A-2026-187-46")
    sum(1 for e in emp if any(a["tipo"] == "Constitución" for a in e["actos"]))
  esperado: 32
  tipo: exacto
  por_que_estable: BORME A de Valencia del 28/09/2026, ya publicado; las correcciones salen en boletines posteriores
  segunda_via: XML crudo de diario_borme/xml.php con curl, 132 empresas y 32 «Constitución.» (2026-10-05)
