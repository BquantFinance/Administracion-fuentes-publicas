# Cifras de control: datos pasados que no cambian, leídos con los clientes de scripts/clientes y confirmados por otra vía.
# check_cifras.py ejecuta cada fragmento python en un proceso aparte (hasta 6 líneas; la última expresión es el valor; los
# módulos de scripts/clientes se importan por su nombre) y lo compara con esperado según tipo: exacto (números como
# números, textos y null tal cual; null es secreto o sin dato, no cero) o minimo (número igual o mayor). Si el dato falta,
# el fragmento devuelve None o un texto en vez de lanzar, para que cuente como cambio y no como error de red. timeout en
# segundos, 180 si no se pone. Nunca se cambia esperado a lo que salga sin confirmarlo antes por la segunda vía.

