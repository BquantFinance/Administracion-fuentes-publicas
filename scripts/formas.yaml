# Sondas de forma: para cada fuente de la que tiran los clientes, dónde están los registros y qué campos se miran.
# check_formas.py compara los campos de hoy con scripts/formas-base.json: un campo que desaparece es un fallo (el
# cliente leería None sin error); uno nuevo solo se informa. tipo json (ruta con puntos, * para recorrer una lista),
# csv (salta líneas, codificación), xml (elemento registro, nombres locales de sus descendientes) o xls (filas de
# cabecera); clave toma ese campo de cada registro en vez de sus claves (CKAN fields, Socrata columns). Para regenerar la base tras un cambio comprobado: python scripts/check_formas.py --actualizar [ids].

- id: ine-datos-tabla
  ficha: ine-api-tempus
  usa: perfil_municipio (padrón, renta, viviendas turísticas)
  url: https://servicios.ine.es/wstempus/js/ES/DATOS_TABLA/29005?nult=1&tv=19:6124
  tipo: json
  rutas: ["*", "*.Data.*"]

