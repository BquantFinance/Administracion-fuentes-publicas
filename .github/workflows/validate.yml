name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate.py
      - name: Comprobar que los artefactos generados están al día
        run: |
          python scripts/build.py
          git diff --exit-code -- catalog.json llms.txt llms-full.txt sources/*/README.md README.md \
            || (echo "::error::Ejecuta 'python scripts/build.py' y sube los ficheros generados" && exit 1)
