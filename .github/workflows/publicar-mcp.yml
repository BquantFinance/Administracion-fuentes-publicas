name: publicar-mcp

# Al subir una etiqueta vX.Y.Z: empaqueta mcpb/ como .mcpb fijado a esa etiqueta, lo adjunta a una release de GitHub y
# publica server.json en el registro oficial de MCP con OIDC de GitHub (io.github.BquantFinance/*). Sin secretos ni
# cuentas externas. La versión de server.json debe coincidir con la etiqueta.
on:
  push:
    tags: ["v*"]

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear la release
      id-token: write   # OIDC para el registro de MCP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fijar el paquete MCPB a la etiqueta y comprobar la versión de server.json
        run: |
          python3 - <<'PY'
          import json, os
          tag = os.environ["GITHUB_REF_NAME"]; v = tag.removeprefix("v"); repo = os.environ["GITHUB_REPOSITORY"]
          s = json.load(open("server.json", encoding="utf-8"))
          assert s["version"] == v, f"server.json lleva {s['version']} y la etiqueta es {tag}"
          m = json.load(open("mcpb/manifest.json", encoding="utf-8"))
          m["version"] = v
          m["server"]["mcp_config"]["args"] = ["--from", f"git+https://github.com/{repo}@{tag}", "mcp-catalogo"]
          json.dump(m, open("mcpb/manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
      - name: Empaquetar el .mcpb
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb catalogo-fuentes-publicas.mcpb
      - name: Crear la release con el paquete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" catalogo-fuentes-publicas.mcpb --title "$GITHUB_REF_NAME" --notes "Servidor MCP del catálogo de fuentes públicas de España.

          Sin instalar nada: uvx --from git+https://github.com/$GITHUB_REPOSITORY@$GITHUB_REF_NAME mcp-catalogo
          El paquete .mcpb hace lo mismo y necesita uv (https://docs.astral.sh/uv/). Configuración por cliente en guides/servidor-mcp.md."
      - name: Completar server.json con la URL y el hash del paquete
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          tag = os.environ["GITHUB_REF_NAME"]; repo = os.environ["GITHUB_REPOSITORY"]
          sha = hashlib.sha256(open("catalogo-fuentes-publicas.mcpb", "rb").read()).hexdigest()
          s = json.load(open("server.json", encoding="utf-8"))
          s["packages"] = [{"registryType": "mcpb", "fileSha256": sha, "transport": {"type": "stdio"},
                            "identifier": f"https://github.com/{repo}/releases/download/{tag}/catalogo-fuentes-publicas.mcpb"}]
          json.dump(s, open("server.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY
      - name: Instalar mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validar server.json
        run: ./mcp-publisher validate
      - name: Autenticar con OIDC de GitHub (concede io.github.BquantFinance/*)
        run: ./mcp-publisher login github-oidc
      - name: Publicar en el registro oficial
        run: ./mcp-publisher publish
