name: publicar-mcp

# Publica el paquete en PyPI (Trusted Publishing) y server.json en el registro oficial de MCP (OIDC de GitHub).
# Se dispara al subir una etiqueta vX.Y.Z; la versión de la etiqueta, de pyproject.toml y de server.json debe coincidir.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar que etiqueta, pyproject.toml y server.json llevan la misma versión
        run: |
          python - <<'PY'
          import json, os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          sj = json.load(open("server.json", encoding="utf-8"))
          found = {tag, py, sj["version"], *(p["version"] for p in sj.get("packages", []))}
          assert len(found) == 1, f"versiones distintas: etiqueta {tag}, pyproject {py}, server.json {sj['version']}"
          PY
      - name: Construir sdist y wheel
        run: pip install build && python -m build
      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  registro-mcp:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a que PyPI sirva la versión (el registro la consulta al publicar)
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            curl -fsS "https://pypi.org/pypi/fuentes-publicas-mcp/$V/json" > /dev/null && exit 0
            sleep 15
          done
          echo "::error::PyPI no sirve fuentes-publicas-mcp $V"
          exit 1
      - name: Instalar mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Validar server.json
        run: ./mcp-publisher validate
      - name: Autenticar con OIDC de GitHub (concede io.github.BquantFinance/*)
        run: ./mcp-publisher login github-oidc
      - name: Publicar en el registro oficial
        run: ./mcp-publisher publish
