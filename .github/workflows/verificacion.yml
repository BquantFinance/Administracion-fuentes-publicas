name: verificacion-semanal

on:
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC
  workflow_dispatch:
    inputs:
      solo:
        description: "ids de ficha para check_ejemplos, separados por espacios (vacío = todas)"
        required: false
        default: ""
      muestra:
        description: "bytes de cada respuesta de check_ejemplos que se imprimen en el log (0 = ninguno)"
        required: false
        default: "0"
  push:
    branches: [main]   # sin esto, cada etiqueta de release y la rama de trabajo lanzaban otra verificación completa
    paths:
      - ".github/workflows/verificacion.yml"   # una ejecución al cambiar el flujo; cron y dispatch exigen que esté en la rama por defecto

permissions:
  contents: read
  issues: write

jobs:
  recetas:
    runs-on: ubuntu-latest
    env:
      AEMET_KEY: ${{ secrets.AEMET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Bundle de CA con las intermedias de FNMT
        run: python scripts/fnmt_bundle.py --out ca-age.pem
      - name: Batería de recetas contra los servidores reales
        id: recetas
        run: |
          set +e
          python scripts/check_recetas.py --ca ca-age.pem --report recetas-report.md --fail
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Ejemplos de las fichas contra los servidores reales
        id: ejemplos
        env:
          SOLO: ${{ github.event.inputs.solo }}
          MUESTRA: ${{ github.event.inputs.muestra || '0' }}
        run: |
          set +e
          filtro=""
          for id in $SOLO; do filtro="$filtro --only $id"; done
          python scripts/check_ejemplos.py --ca ca-age.pem --report ejemplos-report.md --fail --muestra "$MUESTRA" $filtro
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Cargadores de scripts/clientes contra los servidores reales
        id: cargadores
        run: |
          set +e
          fallos=0
          echo "# Cargadores · $(date -u +%F)" > cargadores-report.md
          ejecutar() {
            salida=$(timeout 600 python "$@" 2>&1); rc=$?
            [ $rc -ne 0 ] && fallos=$((fallos+1))
            { echo; echo "## $* · exit $rc"; echo '```'; echo "$salida" | tail -n 15; echo '```'; } >> cargadores-report.md
          }
          ejecutar scripts/clientes/boe.py
          ejecutar scripts/clientes/bdns.py
          ejecutar scripts/clientes/ine_tempus.py 02001
          ejecutar scripts/clientes/saiku.py
          ejecutar scripts/clientes/placsp.py 1
          ejecutar scripts/clientes/ckan.py
          ejecutar scripts/clientes/socrata.py
          ejecutar scripts/clientes/pcaxis.py
          ejecutar scripts/clientes/sepe.py 15902
          ejecutar scripts/clientes/arcgis.py
          ejecutar scripts/clientes/ogc.py
          ejecutar ejemplos/carburante_cerca.py "Alcalá de Henares" gasoleo 8
          ejecutar ejemplos/boe_hoy.py
          ejecutar ejemplos/mi_municipio.py 28005
          ejecutar ejemplos/subvenciones_empresa.py Q1132001G
          ejecutar ejemplos/empresa_nif.py A02066116
          ejecutar ejemplos/licitaciones.py 45
          ejecutar ejemplos/adjudicaciones.py 0   # solo hoy: con 1 la cadena del 643 (15 MB por página) pasaba de los 10 minutos desde GitHub
          ejecutar scripts/clientes/radar.py ejemplos/radar/radar.yaml --estado /tmp/radar/estado.json --salida /tmp/radar   # lo que corre la plantilla del radar
          if [ -n "$AEMET_KEY" ]; then ejecutar scripts/clientes/aemet.py 16078; else echo "AEMET sin clave: omitido" >> cargadores-report.md; fi
          cat cargadores-report.md
          echo "exit=$fallos" >> "$GITHUB_OUTPUT"
      - name: Informe de enlaces de las fichas
        run: python scripts/check_links.py > link-report.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: informes-verificacion
          path: |
            recetas-report.md
            ejemplos-report.md
            cargadores-report.md
            link-report.md
      - name: Abrir o actualizar el issue si hay fallos
        if: steps.recetas.outputs.exit != '0' || steps.ejemplos.outputs.exit != '0' || steps.cargadores.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="Verificación semanal: comprobaciones de recetas con fail o error"
          cuerpo="$(cat recetas-report.md cargadores-report.md ejemplos-report.md | head -c 60000)"
          num=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$cuerpo"
          else
            gh issue create --title "$titulo" --body "$cuerpo" --label verificacion || gh issue create --title "$titulo" --body "$cuerpo"
          fi
