name: publicar-pypi

# Al publicar una release vX.Y.Z (o a mano, para subir la versión de main): construye el wheel y el sdist de
# fuentes-publicas-mcp y los sube a PyPI con publicación de confianza (OIDC de GitHub, sin token ni secretos).
# Apagado hasta que el propietario dé de alta el publicador pendiente en pypi.org (proyecto fuentes-publicas-mcp,
# propietario BquantFinance, repositorio Administracion-fuentes-publicas, flujo publicar-pypi.yml, entorno pypi) y cree
# la variable de repositorio PYPI con el valor si. Con el paquete en PyPI, `uvx fuentes-publicas-mcp` arranca el
# servidor sin git y server.json puede llevar la entrada pypi además del .mcpb.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publicar-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    if: vars.PYPI == 'si'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # publicación de confianza en PyPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: La versión de pyproject.toml coincide con la etiqueta
        if: github.event_name == 'release'
        run: |
          python3 - <<'PY'
          import os, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert v == tag, f"pyproject.toml lleva {v} y la etiqueta es {tag}: subir la versión en main antes de la release"
          PY
      - name: Construir y comprobar
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
