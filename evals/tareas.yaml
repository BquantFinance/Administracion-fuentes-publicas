# Batería de 24 tareas para medir lo que aporta el repo a un agente (ver evals/README.md).
# Cada tarea: ask (lo que pediría un usuario), expected (qué debe contener una respuesta correcta), sources (fichas que la
# resuelven), check (llamada que da el valor de referencia en el momento de la prueba) y trap (lo que falla sin el repo).

- id: ipc-ultimo
  ask: "¿Cuál es el último dato publicado del IPC general nacional (índice) y de qué mes es?"
  expected: "El valor de Valor y Anyo con T3_Periodo del último elemento no vacío de Data en DATOS_SERIE/IPC290751 (con tip=A); el mes debe coincidir con el último publicado, no con el corriente"
  sources: [ine-api-tempus]
  check:
    url: "https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/IPC290751?nult=2&tip=A"
    contains: "IPC290751"
  trap: "nult=1 devuelve Data vacío cuando el mes corriente aún no está publicado; la tabla se pide por Id numérico (24077), no por código"

- id: paro-municipio
  ask: "Paro registrado en Abengibre (Albacete) en agosto de 2026, por sexo"
  expected: "Total y sexo de la fila de Abengibre en la hoja PARO ALBACETE de ESTADISTICA_MUNICIPIOS.xls de la página del mes (agosto de 2026, 18 parados, 5 hombres y 13 mujeres); no de la EPA del INE ni de Muniacteco_20-45, que es por actividad"
  sources: [sepe-estadisticas]
  check:
    url: "https://www.sepe.es/HomeSepe/que-es-el-sepe/estadisticas/datos-estadisticos/municipios/2026/agosto.html"
    contains: "ESTADISTICA_MUNICIPIOS"
  trap: "El paro por municipio es del SEPE (xls por mes con User-Agent de navegador, «<5» como texto y el código INE como número); la EPA del INE no baja de provincia"

- id: gasolinera-mas-barata
  ask: "Gasolinera más barata en gasóleo A hoy en la provincia de Cuenca"
  expected: "Rótulo, municipio y precio del mínimo de Precio Gasoleo A entre las estaciones de FiltroProvinciaProducto/16/4; el precio es texto con coma y hay que descartar los vacíos"
  sources: [minetur-precios-carburantes]
  check:
    url: "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroProvinciaProducto/16/4"
    contains: "ListaEESSPrecio"
  trap: "IDProducto 4 es Gasóleo A habitual y IDProvincia es el código INE; los precios llegan como texto con coma decimal y los vacíos son cadenas vacías"

- id: prediccion-cuenca
  ask: "Predicción del tiempo para mañana en Cuenca capital (máxima, mínima y probabilidad de lluvia)"
  expected: "Valores de prediccion.dia[1] (temperatura.maxima, temperatura.minima, probPrecipitacion) del fichero datos de prediccion/especifica/municipio/diaria/16078 con clave de AEMET"
  sources: [aemet-opendata]
  check:
    url: "https://opendata.aemet.es/opendata/api/prediccion/especifica/municipio/diaria/16078"
    headers: {"api_key": "${AEMET_KEY}"}
    contains: "datos"
  trap: "Clave gratuita obligatoria, respuesta en dos pasos (URL en datos), fichero en ISO-8859-15, errores con HTTP 200 y estado 404 en el cuerpo, código INE sin dígito de control"

- id: boe-disposiciones-dia
  ask: "¿Qué disposiciones generales (sección I) publicó el BOE el 29 de septiembre de 2026?"
  expected: "Lista de identificador y titulo de los item de la sección con codigo 1 del sumario de 20260929, con sus url_xml"
  sources: [boe-api-sumario]
  check:
    url: "https://www.boe.es/datosabiertos/api/boe/sumario/20260929"
    headers: {"Accept": "application/json"}
    contains: "BOE-S-2026"
  trap: "Sin Accept application/json el servidor responde 400; departamento, epigrafe e item llegan como objeto cuando hay uno solo"

- id: constitucion-articulo
  ask: "Texto vigente del artículo 1 de la Constitución Española"
  expected: "Texto de los tres apartados tomado de legislacion-consolidada/id/BOE-A-1978-31229/texto/bloque/a1, no de un buscador ni de un PDF"
  sources: [boe-api-legislacion-consolidada]
  check:
    url: "https://www.boe.es/datosabiertos/api/legislacion-consolidada/id/BOE-A-1978-31229/texto/bloque/a1"
    headers: {"Accept": "application/xml"}
    contains: "Artículo 1"
  trap: "El id de bloque (a1, preambulo, da1) sale de /texto/indice; el texto completo de una norma larga pesa megabytes"

- id: borme-alava
  ask: "Sociedades con actos inscritos en Álava publicados en el BORME del 2 de enero de 2024"
  expected: "Pares p.articulo (número y denominación) con su p.parrafo del documento BORME-A-2024-1-01 en XML"
  sources: [borme-api-sumario]
  check:
    url: "https://www.boe.es/diario_borme/xml.php?id=BORME-A-2024-1-01"
    contains: "ANSOARAN"
  trap: "El identificador de la sección A lleva la provincia (BORME-A-AAAA-NNN-PP, 01 Álava); el sumario JSON exige Accept"

- id: bdns-concesion
  ask: "¿Quién recibió la subvención de la convocatoria BDNS 931918 y por qué importe?"
  expected: "beneficiario G50653179 FUNDACION PARA LA CONSERVACION... e importe 70000, de concesiones/busqueda?numeroConvocatoria=931918"
  sources: [bdns-api]
  check:
    url: "https://www.infosubvenciones.es/bdnstrans/api/concesiones/busqueda?page=0&pageSize=50&numeroConvocatoria=931918"
    headers: {"Accept": "application/json"}
    contains: "G50653179"
  trap: "beneficiario mezcla NIF y nombre en una cadena; la paginación es Spring (content, totalElements) y sin Accept JSON algunos despliegues devuelven XML"

- id: licitaciones-obras-hoy
  ask: "Licitaciones de obras (CPV que empieza por 45) publicadas hoy con presupuesto sin IVA superior a un millón de euros"
  expected: "ContractFolderID, nombre del órgano (PartyName) y TaxExclusiveAmount filtrados en el Atom de sindicacion_643 por ItemClassificationCode y BudgetAmount"
  sources: [placsp-datos-abiertos]
  check:
    url: "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom"
    contains: "ContractFolderStatus"
  trap: "El feed usa espacios de nombres CODICE (cac, cbc, cac-place-ext); el importe está en TaxExclusiveAmount; el histórico va en zips mensuales, no en el feed"

- id: cima-suministro-ibuprofeno
  ask: "Medicamentos con ibuprofeno que tienen ahora un problema de suministro activo"
  expected: "Cruce de medicamentos?nombre=ibuprofeno (o presentaciones por cn) con psuministro filtrando activo true; cn y nregistro son distintos"
  sources: [aemps-cima-api]
  check:
    url: "https://cima.aemps.es/cima/rest/psuministro"
    contains: "tipoProblemaSuministro"
  trap: "psuministro no filtra por nombre y pagina de 200 en 200 (882 filas); las fechas son epoch en milisegundos"

- id: euribor-ultimo
  ask: "Último valor del euríbor a un año publicado por el Banco de España"
  expected: "valor y fechaValor de la serie D_1NBAF472 en favoritas (o último elemento de listaSeries)"
  sources: [bde-estadisticas]
  check:
    url: "https://app.bde.es/bierest/resources/srdatosapp/favoritas?idioma=es&series=D_1NBAF472"
    contains: "D_1NBAF472"
  trap: "El cuerpo llega comprimido en gzip sin Content-Encoding; el código de serie no se adivina, sale del catálogo CSV"

- id: deuda-pde-aapp
  ask: "Deuda según el Protocolo de Déficit Excesivo de las Administraciones Públicas en porcentaje del PIB, último trimestre"
  expected: "Primer par fechas[0] y valores[0] de listaSeries?series=DTNPDE2010_P0000P_PS_APU (orden descendente)"
  sources: [bde-estadisticas]
  check:
    url: "https://app.bde.es/bierest/resources/srdatosapp/listaSeries?idioma=es&series=DTNPDE2010_P0000P_PS_APU&rango=MAX"
    contains: "DTNPDE2010_P0000P_PS_APU"
  trap: "fechas y valores van del más reciente al más antiguo; tomar el último elemento da 1995"

- id: omie-precio-dia
  ask: "Precio del mercado diario de electricidad en España el 29 de septiembre de 2026 en el periodo 3"
  expected: "Tercera fila del fichero marginalpdbc_20260929.1 (2026;09;29;3;...); en 2026 hay 96 periodos cuarto-horarios"
  sources: [omie-mercado]
  check:
    url: "https://www.omie.es/es/file-download?parents%5B0%5D=marginalpdbc&filename=marginalpdbc_20260929.1"
    contains: "MARGINALPDBC"
  trap: "La URL exige carpeta y nombre de fichero con sufijo de versión; la respuesta es texto con punto y coma y una fila final con asterisco"

- id: poblacion-abengibre
  ask: "Población de Abengibre (Albacete) según el último padrón publicado"
  expected: "Valor de DATOS_TABLA/29005?nult=1&tv=19:6124 (753 habitantes en 2025) citando que 6124 es el Id del INE, no el código de municipio"
  sources: [ine-api-tempus, ine-codigos-territoriales]
  check:
    url: "https://servicios.ine.es/wstempus/js/ES/DATOS_TABLA/29005?nult=1&tv=19:6124"
    contains: "Abengibre"
  trap: "El filtro tv usa el Id interno del INE (VALORES_VARIABLEOPERACION/19/22), no el código INE 02001; sin tv la tabla devuelve los 8.000 municipios"

- id: renta-abengibre
  ask: "Renta neta media por persona en Abengibre según el Atlas de distribución de renta de los hogares"
  expected: "Valor de la tabla 30656 (Atlas, Albacete) filtrada con tv=19:6124; una tabla por provincia dentro de la operación ADRH (Id 353)"
  sources: [ine-api-tempus]
  check:
    url: "https://servicios.ine.es/wstempus/js/ES/DATOS_TABLA/30656?nult=1&tv=19:6124"
    contains: "Renta neta media"
  trap: "El Atlas no tiene una tabla nacional por municipio; hay que localizar la tabla de la provincia (TABLAS_OPERACION/353)"

- id: exportaciones-trigo
  ask: "Exportaciones de trigo (TARIC 1001) desde la provincia de Madrid a Países Bajos en el último mes disponible"
  expected: "Fila con id_pais 003 y euros y kilos (texto con coma) de ObtenerDatos?f=E&pe=LastM&pa=003&ta=1001&pr=28 con token de sesión"
  sources: [datacomex]
  check:
    url: "https://comercio.serviciosmin.gob.es/DatacomexAPI/ObtenerDatos?f=E&pe=LastM&pa=003&ta=1001&pr=28"
    status: 401
  trap: "Cuenta gratuita y token con prefijo token: que hay que recortar; el país es numérico (003), no ISO; pe es sensible a mayúsculas (LastM)"

- id: direccion-a-codigo-ine
  ask: "Código INE del municipio y provincia de la dirección calle Alcalá 50, Madrid"
  expected: "muniCode 28079 y provinceCode 28 de geocoder/find de CartoCiudad, con lat y lng"
  sources: [cnig-centro-descargas]
  check:
    url: "https://www.cartociudad.es/geocoder/api/geocoder/find?q=Calle%20Alcala%2050%20Madrid"
    contains: "28079"
  trap: "El Catastro bloquea la IP tras unas 15 peticiones seguidas; CartoCiudad devuelve el código INE sin registro ni clave"

- id: sigpac-recinto-punto
  ask: "Uso SIGPAC y superficie del recinto situado en longitud -3,9 y latitud 40,3"
  expected: "uso_sigpac (ZU) y superficie del primer elemento de recinfobypoint/4326/-3.9/40.3.json"
  sources: [mapa-sigpac]
  check:
    url: "https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/4326/-3.9/40.3.json"
    contains: "uso_sigpac"
  trap: "El orden es srid/x/y (longitud antes que latitud); la respuesta es una lista aunque haya un solo recinto"

- id: dir3-ayuntamiento-madrid
  ask: "Código DIR3 del Ayuntamiento de Madrid y sus unidades tramitadoras de facturas"
  expected: "administration.code L01280796 y las unidades (oc, og, ut con code DIR3) de relations?fulltext=Ayuntamiento de Madrid en FACe"
  sources: [face-facturas, dir3-directorio]
  check:
    url: "https://proveedores.face.gob.es/api/v1/relations?fulltext=Ayuntamiento%20de%20Madrid&limit=5&page=1"
    contains: "L01280796"
  trap: "La descarga del directorio DIR3 exige cookies y User-Agent de navegador; FACe da la jerarquía de unidades en JSON sin registro"

- id: momo-andalucia
  ask: "Defunciones observadas en Andalucía el 1 de enero de 2015 en hombres de 65 años o más según MoMo"
  expected: "108.88 en la fila ambito ccaa, cod_ine_ambito 1, cod_sexo 1, cod_gedad +65 del CSV de MoMo"
  sources: [isciii-cne]
  check:
    url: "https://momo.isciii.es/public/momo/data"
    contains: "defunciones_observadas"
    read_bytes: 4000
  trap: "El servidor ignora Range y sirve el CSV completo (decenas de MB); cod_ine_ambito usa el código INE de la comunidad"

# Trampas silenciosas (tercera tanda, 2026-10-01): la vía directa da una cifra plausible y errónea sin ningún error.

- id: criminalidad-trimestre
  ask: "¿Cuántas infracciones penales se registraron en el municipio de Barcelona en el segundo trimestre (abril a junio) de 2026?"
  expected: "37.548: III. TOTAL INFRACCIONES PENALES de 08019 Barcelona en 09006 (enero-junio, 75.461) menos 09003 (enero-marzo, 37.913)"
  sources: [interior-criminalidad]
  check:
    url: "https://estadisticasdecriminalidad.ses.mir.es/sec/jaxiPx/files/_px/es/csv_bdsc/DatosBalanceAct/l0/09003.px?nocab=1"
    contains: "enero-marzo 2026"
  trap: "El balance del segundo trimestre es acumulado desde enero; dar 75.461 es el error típico"

- id: encina-gbif
  ask: "¿Cuántos registros de encina hay en España en GBIF?"
  expected: "1.327.134 de Quercus rotundifolia (2881550), o 1.348.456 sumando Quercus ilex (2879098, 21.322); no 21.322 solo"
  sources: [gbif-es]
  check:
    url: "https://api.gbif.org/v1/occurrence/count?country=ES&taxonKey=2881550"
    contains: "1"
  trap: "species/match de encina o Quercus ilex da 2879098; la encina ibérica es Quercus rotundifolia, taxón aceptado aparte"

- id: referencia-catastral-direccion
  ask: "Referencia catastral del edificio de la calle Alcalá 50 de Madrid"
  expected: "1446401VK4714E (14 caracteres de la parcela), vía refCatastral del portal en CartoCiudad o Consulta_DNPLOC del Catastro"
  sources: [catastro-ovc, cnig-centro-descargas]
  check:
    url: "https://www.cartociudad.es/geocoder/api/geocoder/candidates?q=calle%20alcala%2050%20madrid&limit=3"
    contains: "Alcal"
  trap: "El Catastro rechaza IP de centros de datos; find de CartoCiudad ignora municipio_filter y puede devolver otro municipio"

- id: padron-cm-datastore
  ask: "Población empadronada en Alcalá de Henares por sexo en el último año disponible, según el portal de datos abiertos de la Comunidad de Madrid"
  expected: "2025: 97.925 hombres y 105.283 mujeres (203.208), del CSV de padron_por_sexo; el datastore se queda en 2022 con 5.000 de 18.718 filas"
  sources: [comunidad-madrid-datos-abiertos]
  check:
    url: "https://datos.comunidad.madrid/api/3/action/datastore_search?resource_id=bc69f395-1f96-4fc2-a115-025c55b905ad&limit=1"
    contains: "5000"
  trap: "datastore_search responde sin error con una tabla recortada y antigua; el dato vigente está en el fichero CSV del recurso"

# Cuarta tanda (2026-10-05): herramientas que traen el dato resuelto (perfil_municipio, coyuntura, empresa_nif).
# Condiciones M (MCP completo) y B (EVAL_SIN=perfil_municipio,coyuntura,empresa_nif). Referencias tomadas el 2026-10-05.

- id: informe-ubicacion
  ask: "Prepárame los datos básicos para un informe de ubicación de Talavera de la Reina: población empadronada, renta neta media por persona, paro registrado del último mes disponible y número de infracciones penales del último periodo publicado."
  expected: "83.803 habitantes (padrón a 1-1-2025, INE 29005); 11.820 € (renta neta media por persona 2023, Atlas de renta); 7.264 parados (agosto de 2026, SEPE; septiembre aún sin publicar por municipio); 1.767 infracciones penales en enero-junio de 2026 (acumulado, Interior)"
  sources: [ine-api-tempus, sepe-estadisticas, interior-criminalidad]
  check:
    url: "https://sede.sepe.gob.es/es/portaltrabaja/resources/sede/datos_abiertos/datos/Paro_por_municipios_2026_csv.csv"
    contains: "45165"
  trap: "Cuatro fuentes con códigos de municipio distintos (Id interno del INE, código INE, nombre en Interior); paro registrado no es EPA y la criminalidad es acumulada"

- id: comparar-municipios
  ask: "Compara la población empadronada y el paro registrado del último mes disponible en Getafe, Leganés, Alcorcón y Fuenlabrada, y di cuál tiene la mayor proporción de paro registrado sobre la población."
  expected: "Agosto de 2026 y padrón 2025: Getafe 8.305 / 193.238 (4,30 %), Leganés 8.119 / 195.734 (4,15 %), Alcorcón 7.056 / 175.719 (4,02 %), Fuenlabrada 8.914 / 190.076 (4,69 %); la mayor, Fuenlabrada"
  sources: [ine-api-tempus, sepe-estadisticas]
  check:
    url: "https://sede.sepe.gob.es/es/portaltrabaja/resources/sede/datos_abiertos/datos/Paro_por_municipios_2026_csv.csv"
    contains: "28058"
  trap: "Cuatro municipios multiplican las llamadas; perfil_municipio acepta la lista en una"

- id: coyuntura-hoy
  ask: "Dame el último dato publicado de: IPC general (variación anual, mes y si es definitivo o avance), tasa de paro de la EPA, crecimiento trimestral del PIB, Euríbor a 12 meses y prima de riesgo española frente a Alemania a 10 años."
  expected: "IPC 4,9 % en septiembre de 2026 (avance); paro EPA 9,87 % (2026T2); PIB +0,68 % trimestral en 2026T2 (corregido de estacionalidad); Euríbor 3,247 % (media de septiembre de 2026); prima 46 pb (julio de 2026, último mes con los dos bonos en el BdE)"
  sources: [ine-api-tempus, bde-estadisticas]
  check:
    url: "https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/IPC290750?nult=1"
    contains: "IPC290750"
  trap: "El IPC del último mes es avance; el PIB publicado es el corregido; el bono alemán va un mes por detrás del español en el BdE"

- id: empresa-nif-perfil
  ask: "Perfil público de la empresa con NIF B86566304: nombre, cuántas subvenciones ha recibido según la BDNS y por qué importe total, ayudas de Estado y minimis, y si tiene prohibición de contratar."
  expected: "EL ALBERCIAL, S.L.; 9 concesiones por 10.074,23 €; 1 ayuda de Estado (717,38 €); 0 minimis; sin prohibiciones de contratar vigentes"
  sources: [bdns-api, hacienda-registro-licitadores]
  check:
    url: "https://www.infosubvenciones.es/bdnstrans/api/concesiones/busqueda?page=0&pageSize=50&nifCif=B86566304"
    contains: "B86566304"
  trap: "La BDNS separa concesiones, ayudas de Estado y minimis en tres búsquedas; las prohibiciones de contratar están en otra fuente"

# Quinta tanda (2026-10-05): bloques nuevos de perfil_municipio (compraventa, certificados energéticos, cerca y
# viviendas turísticas), medidos frente al mismo MCP sin ellos (EVAL_SIN=perfil_municipio.bloque en mcp_cli.py).

- id: compraventa-palma
  ask: "¿Cuántas compraventas de vivienda hubo en Palma (Illes Balears) en el segundo trimestre de 2026 y cuál es el valor tasado medio de la vivienda libre en euros por metro cuadrado en el último trimestre publicado?"
  expected: "1.152 transacciones en 2026-T2 (provisional; 1.080 en 2026-T1), tabla 34010210 del Ministerio de Vivienda; 3.814,5 €/m² en 2026-T2 con 1.274 tasaciones, tabla 35103500"
  sources: [mivau-precios-vivienda-alquiler]
  check:
    url: https://apps.fomento.gob.es/BoletinOnline2/?nivel=2&orden=35000000
    contains: sedal/35103500.XLS
  trap: "Las tablas no traen código INE y escriben «Palma de Mallorca»; buscar «Palma» no casa o casa con Palma del Río, La Palma d'Ebre o Palma de Gandía"

- id: certificados-edificio
  ask: "¿Cuántas viviendas del edificio de la calle Colón 10 de València tienen certificado de eficiencia energética registrado y qué letra de consumo tiene cada una en su certificado más reciente?"
  expected: "3 viviendas (4 certificados, uno de ellas repetido), las tres con letra E de consumo de energía primaria no renovable; parcela catastral 6021705YJ2762A, WFS 26_GCEE de la Generalitat Valenciana"
  sources: [certificados-eficiencia-energetica, cnig-centro-descargas]
  check:
    url: "https://terramapas.icv.gva.es/26_GCEE?service=WFS&version=1.1.0&request=GetFeature&typeName=ms:CEEEdificios&maxFeatures=1&propertyName=ref_parcela"
    contains: ref_parcela
  trap: "Hay 4 certificados para 3 viviendas: contar certificados da 4; los CSV del IVACE terminan en 2023"

- id: colegios-cerca-madrid
  ask: "¿Cuántos centros educativos en funcionamiento hay a menos de 1 km de la calle Alcalá 50 de Madrid y cuál es el más cercano?"
  expected: "11 en alta a menos de 1 km (directorio de centros educativos de la Comunidad de Madrid); el más cercano, el CPR INF-PRI La Merced, a unos 600 m"
  sources: [centros-docentes-ccaa, cnig-centro-descargas]
  check:
    url: "https://datos.comunidad.madrid/api/3/action/datastore_search?resource_id=28d60557-1d73-4281-ab08-6cfd3b2f5f83&limit=1"
    contains: "SITUACI"
  trap: "El directorio mezcla bajas: sin filtrar SITUACIÓN salen 29 (17 de baja); las coordenadas son UTM huso 30"

- id: recarga-cerca-alicante
  ask: "¿Cuántos emplazamientos de recarga de vehículo eléctrico hay a menos de 1 km de la calle Torres Quevedo 42 de Alicante, y qué operador y potencia máxima en kW tiene el más cercano?"
  expected: "5 emplazamientos; el más cercano, en Doctor Ayela 7 a unos 180 m, de Iberdrola Clientes, con 2 puntos de 22 kW"
  sources: [dgt-datex-trafico, cnig-centro-descargas]
  check:
