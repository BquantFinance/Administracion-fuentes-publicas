[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fuentes-publicas-mcp"
version = "0.2.0"
description = "Servidor MCP del catálogo de fuentes de datos de la Administración pública española"
readme = "guides/servidor-mcp.md"
license = "CC0-1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
clientes = ["requests>=2.31", "certifi>=2024.2"]

[project.urls]
Repository = "https://github.com/BquantFinance/Administracion-fuentes-publicas"
Documentation = "https://github.com/BquantFinance/Administracion-fuentes-publicas/blob/main/guides/servidor-mcp.md"

[project.scripts]
mcp-catalogo = "fuentes_publicas.mcp_catalogo:main"
fuentes-publicas-mcp = "fuentes_publicas.mcp_catalogo:main"

[tool.setuptools]
packages = ["fuentes_publicas", "fuentes_publicas.clientes"]

[tool.setuptools.package-dir]
fuentes_publicas = "scripts"
"fuentes_publicas.clientes" = "scripts/clientes"
