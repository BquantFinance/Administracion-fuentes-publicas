  meteorologia-clima: Meteorología y clima
  medio-ambiente-agua-biodiversidad: Medio ambiente, agua y biodiversidad
  energia: Energía
  sanidad-medicamentos: Sanidad y medicamentos
  ciencia-investigacion: Ciencia e investigación (biología, química, geología, oceanografía)
  agricultura-pesca-alimentacion: Agricultura, pesca y alimentación
  transporte-movilidad: Transporte y movilidad
  comercio-industria-propiedad: Comercio exterior, industria y propiedad industrial
