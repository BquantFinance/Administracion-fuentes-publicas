  api-soap: Servicio web SOAP/WSDL
  sparql: Endpoint SPARQL
  oai-pmh: Protocolo OAI-PMH para metadatos
  ogc: Servicios geográficos OGC (WMS, WFS, WMTS, WCS)
  feed: Sindicación RSS/ATOM
  download: Ficheros descargables con URL estable
