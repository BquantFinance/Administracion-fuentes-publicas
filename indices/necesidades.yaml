# Dónde está cada cosa: necesidad habitual, ficha que la resuelve y la nota que evita el desvío típico.
# source: null cuando no hay fuente en el catálogo (la nota dice por qué). build.py agrupa por sector de la fuente.

- need: Sumario diario del BOE con identificador y URLs de cada disposición
