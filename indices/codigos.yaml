# Códigos que una API exige como parámetro y no se adivinan (ids internos, códigos numéricos, indicativos).
# Cada grupo cita la ficha (source), dónde se usa (use) y la fecha en que se obtuvo con una llamada real (verified).
# Solo los valores de uso frecuente; la lista completa se obtiene con la llamada que indica use o note.
# build.py los vuelca en indices/README.md y catalog.json; validate.py comprueba fuente, fecha y duplicados.

