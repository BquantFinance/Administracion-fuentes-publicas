      do: "Con clave gratuita en la cabecera api_key (caduca a los tres meses), GET prediccion/especifica/municipio/diaria/{INE de 5 dígitos sin dígito de control}; la respuesta es un JSON intermedio (estado, datos) y los datos se descargan con una segunda petición a la URL del campo datos, en ISO-8859-15; sin clave llega 200 con cuerpo vacío"
      example: |-
        curl -s -H "api_key: $AEMET_KEY" "https://opendata.aemet.es/opendata/api/prediccion/especifica/municipio/diaria/28079"
