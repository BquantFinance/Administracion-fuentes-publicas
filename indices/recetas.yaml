# Recetas por intención: cómo resolver una necesidad concreta encadenando fuentes del catálogo.
# Cada paso cita el id de una ficha (sources/**/<id>.yaml); allí están los endpoints completos y las trampas.
# checks: peticiones reales que scripts/check_recetas.py ejecuta como batería de regresión
# (url, method, headers, status, contains, min_bytes, read_bytes, retries, fnmt).
# verified: fecha en que todos los pasos y comprobaciones respondieron; null si algún paso no se pudo probar.

- id: ipc-ultimo-dato
  intent: Último IPC general nacional con variación mensual y anual
  inputs: []
  steps:
    - source: ine-api-tempus
      do: "GET DATOS_SERIE/{cod}?nult=1&tip=A con IPC290751 (índice), IPC290752 (variación mensual) e IPC290750 (variación anual); Data[0].Fecha es ISO y T3_TipoDato distingue Avance de Definitivo"
      example: curl -s "https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/IPC290750?nult=1&tip=A"
    - source: ine-api-tempus
      do: "Serie completa con date=19610101:20261231 en vez de nult (sin nult ni date responde 404); las tablas vigentes son 24077 (índice) y 76134 (tasas), comprobables en TABLAS_OPERACION/IPC"
  output: JSON con COD, Nombre y Data (Fecha, T3_Periodo, Anyo, Valor)
  checks:
    - url: https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/IPC290750?nult=1&tip=A
      contains: '"COD":"IPC290750"'
    - url: https://servicios.ine.es/wstempus/js/ES/DATOS_TABLA/24077?nult=1&tip=A
      contains: IPC290751
  verified: "2026-09-30"

- id: localizar-tabla-ine
  intent: Encontrar y descargar una tabla del INE por operación (EPA, padrón, PIB, natalidad) sin conocer su id
  inputs: []
  steps:
    - source: ine-api-tempus
      do: "GET OPERACIONES_DISPONIBLES para el Codigo de la operación (IPC, EPA...) y TABLAS_OPERACION/{Codigo} para sus tablas vigentes con Id y Nombre"
      example: curl -s "https://servicios.ine.es/wstempus/js/ES/TABLAS_OPERACION/EPA"
    - source: ine-api-tempus
      do: "DATOS_TABLA/{Id}?nult=4&tip=A devuelve todas las series de la tabla; para filtrar, VARIABLES_OPERACION y VALORES_VARIABLEOPERACION dan los pares tv=id_variable:id_valor"
    - source: ine-api-tempus
      do: "Cambiar js por csv en la URL para obtener CSV (tabulador, ISO-8859-15 con BOM)"
      example: curl -s "https://servicios.ine.es/wstempus/csv/ES/DATOS_TABLA/24077?nult=1"
  output: JSON con una entrada por serie (COD, Nombre, Data) o CSV de la tabla
  checks:
    - url: https://servicios.ine.es/wstempus/js/ES/OPERACIONES_DISPONIBLES
      contains: '"Codigo":"IPC"'
    - url: https://servicios.ine.es/wstempus/js/ES/TABLAS_OPERACION/EPA
      contains: Nombre
    - url: https://servicios.ine.es/wstempus/csv/ES/DATOS_TABLA/24077?nult=1
      contains: Periodo
  verified: "2026-09-30"

- id: municipio-a-codigo-ine
  intent: Código INE de un municipio a partir de su nombre, o la relación completa de municipios
  inputs: []
  steps:
    - source: cnig-centro-descargas
      do: "GET del geocoder CartoCiudad find?q={nombre}; devuelve muniCode (INE de 5 dígitos), provinceCode, comunidadAutonomaCode y la geometría; acepta tildes"
      example: curl -s "https://www.cartociudad.es/geocoder/api/geocoder/find?q=Alcal%C3%A1%20de%20Henares"
    - source: ine-codigos-territoriales
      do: "Relación completa en diccionario{AA}.xlsx con CPRO, CMUN y DC; el código es CPRO+CMUN (5 dígitos, conservar ceros) y DC es el dígito de control que algunos ficheros añaden"
      example: curl -sO "https://www.ine.es/daco/daco42/codmun/diccionario26.xlsx"
    - source: catastro-ovc
      do: "Equivalencia con el código catastral en ObtenerMunicipios?Provincia={NOMBRE}&Municipio={texto} (loine es el INE, locat el catastral); el OVC bloquea la IP tras ráfagas de unas 15 peticiones"
  output: código INE de municipio (5 dígitos) y de provincia (2)
  checks:
    - url: https://www.cartociudad.es/geocoder/api/geocoder/find?q=Alcal%C3%A1%20de%20Henares
      contains: muniCode
    - url: https://www.ine.es/daco/daco42/codmun/diccionario26.xlsx
      read_bytes: 100000
      min_bytes: 50000
  verified: "2026-09-30"

- id: coordenadas-a-referencia-catastral
  intent: De unas coordenadas a la parcela (recinto SIGPAC y referencia catastral) y a los datos del inmueble
  inputs: []
  steps:
    - source: mapa-sigpac
      do: "refrecinbycoord/4326/{lon}/{lat}.json devuelve la referencia SIGPAC pr:mu:ag:zo:po:pa:re; recinfobypoint añade uso, superficie, pendiente y geometría WKT"
      example: curl -s "https://sigpac-hubcloud.es/servicioconsultassigpac/query/refrecinbycoord/4326/-3.9/40.3.json"
    - source: mapa-sigpac
      do: "refcatparcela/{pr}/{mu}/{ag}/{zo}/{po}/{pa}.json devuelve referencia_cat (14 caracteres, parcela)"
      example: curl -s "https://sigpac-hubcloud.es/servicioconsultassigpac/query/refcatparcela/28/15/0/0/3/9000.json"
    - source: catastro-ovc
      do: "En suelo urbano, Consulta_RCCOOR (XML, pc1+pc2 son los 14 caracteres) y después Consulta_DNPRC?RefCat= para uso, superficie, año y municipio INE; el OVC bloquea la IP tras unas 15 peticiones seguidas (403 Petición HTTP bloqueada durante más de media hora el 30/09/2026)"
      example: curl -s "https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCoordenadas.asmx/Consulta_RCCOOR?SRS=EPSG:4326&Coordenada_X=-3.6960&Coordenada_Y=40.4185"
  output: referencia SIGPAC, referencia catastral de 14 caracteres y datos no protegidos del inmueble
  checks:
    - url: https://sigpac-hubcloud.es/servicioconsultassigpac/query/refrecinbycoord/4326/-3.9/40.3.json
      contains: refrecinto
    - url: https://sigpac-hubcloud.es/servicioconsultassigpac/query/refcatparcela/28/15/0/0/3/9000.json
      contains: referencia_cat
    - url: https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCoordenadas.asmx/Consulta_RCCOOR?SRS=EPSG:4326&Coordenada_X=-3.6960&Coordenada_Y=40.4185
      contains: <pc1>
  verified: "2026-09-30"

- id: parcela-a-red-natura-y-nitratos
  intent: Saber si un recinto agrícola está en Red Natura 2000 o en zona vulnerable a nitratos
  inputs: [referencia-sigpac]
  steps:
    - source: mapa-sigpac
      do: "Obtener los siete códigos del recinto con refrecinbycoord/4326/{lon}/{lat}.json o recinfobypoint"
    - source: mapa-sigpac
      do: "intersection/red_natura/{pr}/{mu}/{ag}/{zo}/{po}/{pa}/{re}.json devuelve lic_code, lic_name, zepa_code, surface_intersection y surface_tpc; intersection/nitratos igual para zonas vulnerables"
      example: curl -s "https://sigpac-hubcloud.es/servicioconsultassigpac/intersection/red_natura/28/15/0/0/3/9000/6.json"
  output: lista JSON de intersecciones con códigos LIC y ZEPA y superficie afectada
  checks:
    - url: https://sigpac-hubcloud.es/servicioconsultassigpac/intersection/red_natura/28/15/0/0/3/9000/6.json
      contains: lic_code
  verified: "2026-09-30"

- id: empresa-nif-a-ayudas-y-contratos
  intent: Subvenciones, ayudas de investigación y contratos públicos de una empresa o entidad por su NIF
  inputs: [nif]
  steps:
    - source: bdns-api
      do: "concesiones/busqueda?nifCif={NIF}&page=0&pageSize=100 con Accept application/json (con Accept de navegador responde XML); beneficiario trae NIF y nombre en un solo campo, con importe, ayudaEquivalente, numeroConvocatoria y fechaConcesion; el parámetro beneficiario= no existe (400)"
      example: |-
        curl -s -H "Accept: application/json" "https://www.infosubvenciones.es/bdnstrans/api/concesiones/busqueda?page=0&pageSize=100&nifCif=Q1132001G"
    - source: bdns-api
      do: "grandesbeneficiarios, ayudasestado y minimis tienen el mismo patrón de búsqueda (nifCif verificado solo en concesiones); exportación con concesiones/exportar?vpd=GE&tipoDoc=csv y los mismos filtros"
    - source: aei-convocatorias
      do: "Ayudas de investigación en el CSV completo, filtrar la columna C.I.F. (separador ;, UTF-8 con BOM)"
    - source: placsp-datos-abiertos
      do: "Contratos en los feeds ATOM y ZIP mensuales; los documentos CODICE llevan cbc:ID con schemeName NIF (adjudicatarios y órganos), filtrar por el valor y comprobar el elemento padre"
    - source: borme-api-sumario
      do: "Actos societarios solo por nombre y fecha en el XML de cada provincia (receta actos-mercantiles-borme)"
  output: concesiones BDNS (JSON), ayudas AEI (filas CSV) y expedientes PLACSP (XML CODICE)
  checks:
    - url: https://www.infosubvenciones.es/bdnstrans/api/concesiones/busqueda?page=0&pageSize=5&nifCif=Q1132001G
      headers: {Accept: application/json}
      contains: '"beneficiario":"Q1132001G'
    - url: https://www.aei.gob.es/ayudas-concedidas/buscador-ayudas-concedidas/download-unlimit/All/All/All/All?keys=&area=All
      contains: C.I.F.
      read_bytes: 4096
    - url: https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
      contains: schemeName="NIF"
      read_bytes: 400000
  verified: "2026-09-30"

- id: organismo-a-dir3-y-nif
  intent: Código DIR3 y NIF de un organismo público a partir de su nombre, y su jerarquía
  inputs: []
  steps:
    - source: face-facturas
      do: "relations?fulltext={nombre}&limit=100&page=1; cada item trae oc, og y ut con code (DIR3) y og.identifier con el NIF; relations.csv sin filtro descarga las 50186 relaciones"
      example: curl -s "https://proveedores.face.gob.es/api/v1/relations?fulltext=Ayuntamiento%20de%20Madrid&limit=100&page=1"
    - source: dir3-directorio
      do: "Jerarquía completa y unidades ausentes de FACe en los xlsx por nivel (AGE 2741, CCAA 2742, EELL 2744); descargar en dos pasos con cookie jar y User-Agent de navegador"
    - source: datos-gob-es-api
      do: "Con el DIR3, catalog/dataset/publisher/{dir3}.json lista los datasets que publica ese organismo"
  output: DIR3 (E, L, LA, A, U...), NIF y nombres oficiales
  checks:
    - url: https://proveedores.face.gob.es/api/v1/relations?fulltext=Ayuntamiento%20de%20Madrid&limit=2&page=1
      contains: '"identifier"'
    - url: https://administracionelectronica.gob.es/ctt/verPestanaDescargas.htm?idIniciativa=dir3
      headers: {Accept: text/html}
      min_bytes: 50000
      read_bytes: 400000
  verified: "2026-09-30"

- id: boe-sumario-y-texto-consolidado
  intent: Qué se publicó en el BOE un día y cómo pasar de una disposición a su texto y a la norma consolidada
  inputs: [boe-id, eli]
  steps:
    - source: boe-api-sumario
      do: "GET /boe/sumario/{AAAAMMDD} con Accept application/json; recorrer diario, seccion, departamento, epigrafe e item (cada nivel puede ser objeto o lista); cada item trae identificador, titulo y url_pdf, url_html, url_xml"
      example: |-
        curl -s -H "Accept: application/json" "https://www.boe.es/datosabiertos/api/boe/sumario/20240102"
    - source: boe-api-sumario
      do: "Texto completo en xml.php?id={identificador} (raíz documento con metadatos, analisis y texto), sin cabecera Accept"
      example: curl -s "https://www.boe.es/diario_boe/xml.php?id=BOE-A-2024-87"
    - source: boe-api-legislacion-consolidada
      do: "/id/{identificador}/metadatos da vigencia, estado de consolidación y url_eli; /texto/indice los bloques y /texto/bloque/{id} cada artículo con sus versiones (solo XML)"
      example: |-
        curl -s -H "Accept: application/json" "https://www.boe.es/datosabiertos/api/legislacion-consolidada/id/BOE-A-1978-31229/metadatos"
    - source: boe-eli
      do: "La URI ELI más /con devuelve el consolidado vigente en HTML con RDFa; sin sufijo, la versión publicada en el diario"
  output: sumario JSON, XML de cada disposición y consolidado por bloques; 404 los domingos y festivos
  checks:
    - url: https://www.boe.es/datosabiertos/api/boe/sumario/20240102
      headers: {Accept: application/json}
      contains: BOE-A-2024
    - url: https://www.boe.es/diario_boe/xml.php?id=BOE-A-2024-87
      contains: <documento
    - url: https://www.boe.es/datosabiertos/api/legislacion-consolidada/id/BOE-A-1978-31229/metadatos
      headers: {Accept: application/json}
      contains: url_eli
  verified: "2026-09-30"

- id: buscar-norma-por-titulo
  intent: Encontrar normas por palabras del título, rango o fecha y seguir sus cambios
  inputs: [boe-id]
  steps:
    - source: boe-api-legislacion-consolidada
      do: "GET con query (JSON url-encoded con query_string sobre titulo, range sobre fecha_publicacion o fecha_disposicion y sort) y limit; devuelve identificador, titulo, fechas y ámbito de cada norma"
      example: |-
        curl -s -G -H "Accept: application/json" "https://www.boe.es/datosabiertos/api/legislacion-consolidada" --data-urlencode 'query={"query":{"query_string":{"query":"titulo:vivienda"}},"sort":[{"fecha_publicacion":"desc"}]}' --data-urlencode "limit=20"
    - source: boe-api-legislacion-consolidada
      do: "Listado por fecha de última actualización del consolidado con from y to (AAAAMMDD) para detectar normas modificadas; datos-auxiliares/rangos y /materias dan los códigos de filtro"
      example: |-
        curl -s -H "Accept: application/json" "https://www.boe.es/datosabiertos/api/legislacion-consolidada?from=20260901&limit=100"
    - source: boe-feeds
      do: "Para vigilar novedades sin API, RSS diario del BOE por sección (ISO-8859-1)"
  output: lista JSON de normas con identificador BOE; vigencia y url_eli en /id/{id}/metadatos
  checks:
    - url: https://www.boe.es/datosabiertos/api/legislacion-consolidada?query=%7B%22query%22%3A%7B%22query_string%22%3A%7B%22query%22%3A%22titulo%3Avivienda%22%7D%7D%7D&limit=2
      headers: {Accept: application/json}
      contains: identificador
    - url: https://www.boe.es/datosabiertos/api/legislacion-consolidada?from=20260901&limit=2
      headers: {Accept: application/json}
      contains: identificador
  verified: "2026-09-30"

- id: licitaciones-nuevas
  intent: Licitaciones y adjudicaciones publicadas hoy en toda la contratación pública
  inputs: [dir3, cpv]
  steps:
    - source: placsp-datos-abiertos
      do: "GET del feed ATOM vigente (unas 235 entradas, 6 MB); cada entry lleva un documento CODICE con el órgano (cbc:ID schemeName DIR3), CPV, importes (TotalAmount con IVA, TaxExclusiveAmount sin) y estado; link rel=next enlaza la instantánea anterior"
      example: curl -s "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom"
    - source: placsp-datos-abiertos
      do: "Histórico en ZIP mensual por feed (12 a 19 MB) con el mismo XML; PlataformasAgregadasSinMenores.atom para CCAA y EELL y contratosMenoresPerfilesContratantes.atom para menores"
      example: curl -sO "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202508.zip"
    - source: boe-feeds
      do: "Anuncios de licitación publicados en el BOE por división CPV en RSS (canal_cpv.php)"
  output: entradas ATOM con CODICE (XML basado en UBL) por expediente
  checks:
    - url: https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
      contains: <entry>
      read_bytes: 300000
    - url: https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202508.zip
      read_bytes: 1024
  verified: "2026-09-30"

- id: subvenciones-convocatorias-recientes
  intent: Convocatorias de subvenciones publicadas en un rango de fechas y su detalle
  inputs: [bdns]
  steps:
    - source: bdns-api
      do: "convocatorias/busqueda?page=0&pageSize=100&fechaDesde={dd/mm/aaaa}&fechaHasta={dd/mm/aaaa}&order=fechaRecepcion&direccion=desc (tipoAdministracion=C solo estatales); content[] con numeroConvocatoria, descripcion, nivel1 a nivel3 y mrr"
      example: curl -s "https://www.infosubvenciones.es/bdnstrans/api/convocatorias/busqueda?page=0&pageSize=50&fechaDesde=01/09/2026&fechaHasta=30/09/2026&order=fechaRecepcion&direccion=desc"
    - source: bdns-api
      do: "convocatorias?numConv={numero} da órgano, instrumentos, presupuesto, bases y documentos; codigoBDNS es la clave estable"
      example: curl -s "https://www.infosubvenciones.es/bdnstrans/api/convocatorias?numConv=800000"
    - source: bdns-api
      do: "Exportación masiva con convocatorias/exportar?vpd=GE&tipoDoc=csv y los mismos filtros (windows-1252; tope de 10000 filas sin aviso)"
  output: JSON paginado de convocatorias y detalle por número BDNS
  checks:
    - url: https://www.infosubvenciones.es/bdnstrans/api/convocatorias/busqueda?page=0&pageSize=2&fechaDesde=01/09/2026&fechaHasta=30/09/2026&order=fechaRecepcion&direccion=desc
      headers: {Accept: application/json}
      contains: numeroConvocatoria
    - url: https://www.infosubvenciones.es/bdnstrans/api/convocatorias?numConv=800000
      headers: {Accept: application/json}
      contains: codigoBDNS
  verified: "2026-09-30"

- id: deuda-publica-por-administracion
  intent: Deuda de un ayuntamiento, de una comunidad autónoma o del Estado
  inputs: []
  steps:
    - source: hacienda-ovef
      do: "Deuda viva a 31 de diciembre por ayuntamiento en deuda-viva-ayuntamientos-{AAAA}12.xlsx (dipycab y restoeell en la misma carpeta)"
      example: curl -sO "https://www.hacienda.gob.es/cdi/sist%20financiacion%20y%20deuda/informacioneells/2025/deuda-viva-ayuntamientos-202512.xlsx"
    - source: bde-estadisticas
      do: "Deuda según el Protocolo de Déficit Excesivo por subsector y por comunidad autónoma en el capítulo SB_DEUAAPP.zip del Boletín Estadístico (CSV con 6 filas de cabecera)"
      example: curl -sO "https://www.bde.es/webbe/es/estadisticas/compartido/datos/zip/SB_DEUAAPP.zip"
    - source: tesoro-estadisticas
      do: "Deuda del Estado por instrumento, vida media, tenedores y vencimientos en los cuadros mensuales {NN}.xlsx (01 nominal en circulación), con User-Agent de navegador"
      example: curl -sO -A "Mozilla/5.0" "https://www.tesoro.es/sites/default/files/estadisticas/01.xlsx"
    - source: airef-datos
      do: "Histórico de deuda por Administración en Historico_Deuda.xlsx; la URL cambia con cada publicación, localizarla en la página del observatorio de deuda"
  output: xlsx por entidad (Hacienda), CSV por serie (BdE) y cuadros mensuales (Tesoro)
  checks:
    - url: https://www.hacienda.gob.es/cdi/sist%20financiacion%20y%20deuda/informacioneells/2025/deuda-viva-ayuntamientos-202512.xlsx
      min_bytes: 500000
      read_bytes: 1024
    - url: https://www.bde.es/webbe/es/estadisticas/compartido/datos/zip/SB_DEUAAPP.zip
      read_bytes: 1024
    - url: https://www.tesoro.es/sites/default/files/estadisticas/01.xlsx
      read_bytes: 1024
      fnmt: true
  verified: "2026-09-30"

- id: irpf-por-municipio
  intent: Renta y declarantes de IRPF por municipio y tramo, todos los ejercicios
  inputs: [ine-municipio]
  steps:
    - source: aeat-estadisticas
      do: "IRPFmunicipios.csv (31 MB, separador ;, decimal coma) con una fila por ejercicio (EJER), tramo (TRAMO) y municipio (MUNI_DEF) y una columna MUNI_n por variable; MUNI_DEF es un código propio, comprobar en la documentación de la estadística la equivalencia con el INE antes de cruzar"
      example: curl -sO "https://sede.agenciatributaria.gob.es/static_files/Sede/Tema/Estadisticas/Anuario_estadistico/Exportacion/IRPFmunicipios.csv"
    - source: aeat-estadisticas
      do: "Recaudación mensual por figura tributaria en Cuadros_estadisticos_series_es_es.xlsx (URL fija, contenido sobrescrito en cada publicación)"
  output: CSV masivo de todos los ejercicios
  checks:
    - url: https://sede.agenciatributaria.gob.es/static_files/Sede/Tema/Estadisticas/Anuario_estadistico/Exportacion/IRPFmunicipios.csv
      contains: EJER;TRAMO
      read_bytes: 4096
    - url: https://sede.agenciatributaria.gob.es/static_files/Sede/Tema/Estadisticas/Recaudacion_Tributaria/Informes_mensuales/Cuadros_estadisticos_series_es_es.xlsx
      read_bytes: 1024
  verified: "2026-09-30"

- id: paro-registrado-por-municipio
  intent: Paro registrado y demandantes por municipio, sexo, edad y actividad de un mes
  inputs: [ine-municipio]
  steps:
    - source: sepe-estadisticas
      do: "La página del mes municipios-20-45/{AAAA}/{mes}.html (2020 en adelante) enlaza un xls por comunidad autónoma en {AAAA}/{mes}_{AAAA}/Muniacteco_20-45_{CCAA}.xls; de 2005 a 2019 en municipios/{AAAA}/{mes}-{AAAA}.html"
      example: curl -sO -A "Mozilla/5.0" "https://www.sepe.es/SiteSepe/contenidos/que_es_el_sepe/estadisticas/datos_estadisticos/municipios_20_45/2026/agosto_2026/Muniacteco_20-45_ANDALUCIA.xls"
    - source: sepe-estadisticas
      do: "Los xls son de formato informe, sin código INE (solo nombre del municipio); xlrd no los abre, calamine sí (pandas engine=calamine)"
