    - source: aemet-opendata
      do: "Las 64 rutas y sus parámetros están en AEMET_OpenData_specification.json (OpenAPI 3.0.1), sin clave"
      example: curl -s "https://opendata.aemet.es/AEMET_OpenData_specification.json"
  output: JSON de predicción por día (ficheros en ISO-8859-15); errores con HTTP 200 y estado en el cuerpo; 429 tras unas diez peticiones por minuto
